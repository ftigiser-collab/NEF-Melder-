<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEF-Melder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0f3f8f">
<meta name="description" content="Einsatzcodes RLP antippen und passende Differenzialdiagnosen und Kapitel aus Präklinik kompakt erhalten.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@500;600;700&amp;display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
/* Layout: blauer Kopfbalken, Funkmelder-Display, Ziffernblock, darunter Reminder- und DD-Karten. Blau/Weiß wie das Taschenbuch. */
:root {
  --bg: #f2f6fc;
  --panel: #ffffff;
  --panel2: #edf3fb;
  --line: #d2dff1;
  --fg: #0f2747;
  --muted: #5b7192;
  --accent: #1a5cc4;
  --accent-ink: #ffffff;
  --navy: #0b2d62;
  --head: #0f3f8f;
  --blue2: #4a86dc;
  --tint: #e3edf9;
  --tint2: #d6e4f7;
  --font-ui: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-text: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font-family: var(--font-text); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head); }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { min-height: 100%; display: flex; flex-direction: column; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--head); color: #ffffff;
  padding-block: 10px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.logo { background: #ffffff; color: var(--head); font-weight: 700; font-size: 13px; padding: 2px 6px; border-radius: 3px; letter-spacing: 0.06em; }
.bname { font-family: var(--font-ui); font-weight: 700; font-size: 22px; letter-spacing: 0.01em; }
.bsub { font-family: var(--font-ui); color: #b9cff0; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
.tabs { display: flex; gap: 4px; margin-top: 8px; }
.tab { flex: 1; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 4px 9px; font-family: var(--font-ui); font-weight: 600; font-size: 16px; color: #b9cff0; letter-spacing: 0.02em; }
.tab.on { color: #ffffff; border-bottom-color: #ffffff; }

.main {
  flex: 1; width: 100%; max-width: 760px; margin: 0 auto; box-sizing: border-box;
  padding-block: 14px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.foot {
  color: var(--muted); font-size: 12px; text-align: center; border-top: 1px solid var(--line); background: var(--panel);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Altersgruppe */
.agebar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; align-items: center; }
.agebtn { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 2px; font-family: var(--font-ui); font-weight: 600; font-size: 15px; color: var(--muted); white-space: nowrap; }
.agebtn.on { background: var(--navy); color: #ffffff; border-color: var(--navy); }
.agebtn.kid.on { background: var(--accent); border-color: var(--accent); color: #ffffff; }
.autoage { grid-column: 1 / -1; font-size: 12px; color: var(--accent); font-family: var(--font-ui); letter-spacing: 0.04em; text-transform: uppercase; }

/* Melder-Display */
.melder { display: flex; flex-direction: column; gap: 12px; }
.pager { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.lcd { background: var(--navy); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.lcddigits { color: #ffffff; font-size: 34px; font-weight: 600; letter-spacing: 0.08em; line-height: 1.1; }
.lcdlabel { color: #bcd4f5; font-family: var(--font-ui); font-size: 15px; min-height: 1.3em; }
.prevrow { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow-y: auto; }
.prevbtn { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 15px; }
.prevbtn .mono { color: var(--accent); margin-right: 6px; font-weight: 600; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.key { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 11px 0; font-family: var(--font-mono); font-size: 24px; font-weight: 500; color: var(--navy); box-shadow: 0 1px 0 var(--line); }
.key:active { background: var(--tint); }
.key.fn { font-family: var(--font-ui); font-size: 17px; font-weight: 600; color: var(--accent); background: var(--panel2); }
.padtoggle { background: none; border: 1px dashed var(--line); border-radius: 8px; padding: 8px; color: var(--muted); font-family: var(--font-ui); font-weight: 600; font-size: 15px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-family: var(--font-ui); font-size: 15px; text-align: left; max-width: 100%; }
.chip .mono { color: var(--accent); font-weight: 600; margin-right: 4px; }
.chip.kid, .chip.z { background: var(--tint); }
.chip.kid .mono, .chip.z .mono { color: var(--navy); }
.chip .x { color: var(--muted); margin-left: 6px; }
.chip.clear { background: none; border-style: dashed; color: var(--muted); }

.kidinfo { background: var(--tint); border: 1px solid var(--tint2); border-radius: 8px; padding: 10px 12px; font-size: 15px; display: flex; flex-direction: column; gap: 8px; }
.kidinfo strong { color: var(--navy); }
.kidlinks { display: flex; flex-wrap: wrap; gap: 6px; }
.minibtn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-family: var(--font-ui); font-size: 14px; font-weight: 600; text-align: left; color: var(--accent); }
.minibtn.more { align-self: flex-start; }

/* Ergebnisse */
.results { display: flex; flex-direction: column; gap: 12px; }
.hint { color: var(--muted); font-size: 15px; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.hint p { margin: 0; }
.hint b { color: var(--accent); }
.notes { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.noteslabel, .ddlabel, .cglabel { font-family: var(--font-ui); font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.noteslabel { color: var(--accent); }
.note { margin: 0; font-size: 15px; }
.note .mono { color: var(--accent); font-weight: 600; margin-right: 4px; }

.pcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.pcard.rem { border-top: 4px solid var(--accent); }
.phead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.phead h3 { margin: 0; font-family: var(--font-ui); font-size: 20px; font-weight: 700; text-wrap: balance; color: var(--navy); }
.agechip { flex: none; font-family: var(--font-ui); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; text-transform: uppercase; }
.agechip.kid { color: var(--accent); border-color: var(--tint2); background: var(--tint); }
.fallback { margin: 0; font-size: 13px; color: var(--accent); }
.pnote { margin: 0; font-size: 15px; background: var(--panel2); border-radius: 6px; padding: 8px 10px; }
.ddgroup { display: flex; flex-direction: column; gap: 4px; }
.ddlabel { color: var(--muted); margin-bottom: 2px; }
.ddlabel.crit { color: #ffffff; background: var(--navy); align-self: flex-start; padding: 2px 8px; border-radius: 4px; }
.dd { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; align-items: baseline; text-align: left; background: var(--panel2); border: 0; border-left: 3px solid var(--line); border-radius: 4px; padding: 8px 10px; width: 100%; box-sizing: border-box; }
.dd.crit { border-left: 4px solid var(--navy); background: var(--tint); }
.ddn { font-weight: 600; font-size: 16px; min-width: 0; color: var(--fg); }
.ddh { grid-column: 1; color: var(--muted); font-size: 14px; min-width: 0; }
.ddgo { grid-column: 2; grid-row: 1; color: var(--accent); font-family: var(--font-ui); font-size: 13px; font-weight: 600; white-space: nowrap; }
.dd.link:active { filter: brightness(0.96); }

/* Kurz-Reminder */
.quick { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.q { display: grid; grid-template-columns: 74px 1fr; gap: 8px; align-items: baseline; font-size: 15.5px; line-height: 1.35; }
.qt { font-family: var(--font-ui); font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; text-align: center; border-radius: 4px; padding: 2px 4px; background: var(--tint); color: var(--navy); }
.qS .qt { background: var(--accent); color: #ffffff; }
.qD .qt { background: var(--tint2); color: var(--accent); }
.qZ .qt { background: var(--panel2); color: var(--accent); border: 1px solid var(--tint2); }
.qA .qt { background: var(--navy); color: #ffffff; }
.qA .qx { font-weight: 600; }
.qx { min-width: 0; }

.seclist { display: flex; flex-direction: column; gap: 4px; }
.secbtn { display: flex; align-items: center; gap: 10px; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
.secnum { flex: none; font-family: var(--font-mono); font-size: 13px; color: #ffffff; background: var(--accent); border-radius: 3px; min-width: 22px; text-align: center; padding: 1px 3px; font-weight: 600; }
.sectxt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sect { font-weight: 600; font-size: 15px; }
.secc { color: var(--muted); font-size: 12px; font-family: var(--font-ui); letter-spacing: 0.03em; }
.chev { color: var(--accent); font-size: 22px; line-height: 1; }

/* Organsystem */
.organ { display: flex; flex-direction: column; gap: 12px; }
.sysgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.sysbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 12px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.sysbtn.ra { background: var(--accent); border-color: var(--accent); color: #ffffff; grid-column: 1 / -1; }
.sysbtn.ra .sysmeta { color: #d6e4f7; }
.systitle { font-family: var(--font-ui); font-weight: 700; font-size: 18px; }
.sysmeta { color: var(--muted); font-size: 13px; }
.vh { margin: 0; font-family: var(--font-ui); font-size: 24px; color: var(--navy); }
.plist { display: flex; flex-direction: column; gap: 6px; }
.prow { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 8px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.ptitle { font-weight: 600; font-size: 16px; color: var(--navy); }
.pmeta { grid-column: 1; color: var(--muted); font-size: 13px; }
.prow .chev { grid-column: 2; grid-row: 1 / span 2; }
.back { background: none; border: 0; color: var(--accent); font-family: var(--font-ui); font-weight: 600; font-size: 16px; padding: 6px 0; text-align: left; white-space: nowrap; flex: none; }
.back.inline { align-self: flex-start; }

/* Kapitel */
.kapitel { display: flex; flex-direction: column; gap: 14px; }
.chap { display: flex; flex-direction: column; gap: 6px; }
.chapt { margin: 0; font-family: var(--font-ui); font-size: 18px; display: flex; gap: 8px; align-items: center; color: var(--navy); }
.search { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font: inherit; color: var(--fg); }
.search.wide { width: 100%; box-sizing: border-box; }
.empty { color: var(--muted); }

/* Overlays */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.ovhead {
  display: flex; align-items: center; gap: 12px; background: var(--head); color: #ffffff;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.ovhead .back { color: #ffffff; }
.ovhead .search { background: #ffffff; border-color: #ffffff; }
.ovbody {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-block: 12px calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.cgroup { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; max-width: 760px; }
.cglabel { color: var(--muted); padding: 4px 0; }
.crow { display: flex; gap: 10px; align-items: baseline; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; }
.crow.on { border-color: var(--accent); background: var(--tint); }
.crow.org { opacity: 0.65; }
.ccode { font-family: var(--font-mono); color: var(--accent); font-weight: 600; flex: none; }
.ctitle { flex: 1; min-width: 0; }
.ccheck { color: var(--accent); font-weight: 700; }

.rtitle { display: flex; flex-direction: column; min-width: 0; }
.rch { color: #b9cff0; font-family: var(--font-ui); font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rt { font-family: var(--font-ui); font-weight: 700; font-size: 19px; }
.rtabs { display: flex; gap: 6px; margin-bottom: 12px; max-width: 760px; }
.rtab { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-family: var(--font-ui); font-weight: 700; font-size: 15px; color: var(--muted); }
.rtab.on { background: var(--accent); border-color: var(--accent); color: #ffffff; }
.rnav { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; max-width: 760px; }

/* Leseansicht: Inhalte aus dem Taschenbuch */
.rd { max-width: 760px; font-size: 16px; line-height: 1.5; }
.rd h3 { font-family: var(--font-ui); font-size: 18px; color: var(--accent); margin: 18px 0 8px; }
.rd p { margin: 0 0 10px; }
.rd ul, .rd ol { margin: 0 0 10px; padding-left: 20px; }
.rd .quick { padding-left: 0; }
.rd li { margin-bottom: 5px; }
.rd strong { color: var(--navy); font-weight: 700; }
.rd table { display: block; overflow-x: auto; border-collapse: collapse; margin: 0 0 12px; font-size: 14px; max-width: 100%; background: var(--panel); }
.rd th { background: var(--navy); color: #ffffff; text-align: left; padding: 6px 8px; font-family: var(--font-ui); font-weight: 700; white-space: nowrap; }
.rd td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; min-width: 90px; }
.rd tr:nth-child(even) td { background: var(--panel2); }
.rd .box { border-left: 4px solid var(--navy); background: var(--panel); border-radius: 0 8px 8px 0; padding: 10px 12px 2px; margin: 0 0 12px; }
.rd .box-label { font-family: var(--font-ui); font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; color: var(--navy); }
.rd .box-dosis { border-left-color: var(--accent); background: var(--tint); }
.rd .box-dosis .box-label { color: var(--accent); }
.rd .box-neu { border-left-color: var(--blue2); background: #f5f9fe; }
.rd .box-neu .box-label { color: var(--accent); }
.rd .box-pitfall { border-left-color: var(--navy); background: var(--tint2); }
.rd .box-pitfall .box-label { color: #ffffff; background: var(--navy); display: inline-block; padding: 2px 8px; border-radius: 4px; }
.rd .box-merke { border-left-color: #8fb4ea; background: #f7faff; }
.rd .box-merke .box-label { color: var(--accent); }
.rd .box-rf { border-left: 7px solid var(--navy); background: var(--tint2); }
.rd .box-rf .box-label { color: #ffffff; background: var(--accent); display: inline-block; padding: 2px 8px; border-radius: 4px; }
.rd .box table { font-size: 13px; }

@media (min-width: 640px) {
  .keypad { grid-template-columns: repeat(6, 1fr); }
  .key { padding: 12px 0; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

</style>
</head>

<script>window.CONTENT={"sections":{"lage":{"ch":1,"cht":"Grundlagen am Einsatzort","t":"Struktur in den ersten Minuten","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Lage und Eigenschutz<\/strong>, dann Nachforderung früh statt spät: zweiter RTW, RTH, Feuerwehr (Tragehilfe, technische Rettung), Polizei, PSNV.<\/li>\n<li><strong>10-Sekunden-Blick:<\/strong> kritisch oder nicht kritisch? Danach <strong>cABCDE<\/strong> konsequent, jede Intervention mit Re-Evaluation.<\/li>\n<li><strong>Anamnese<\/strong> parallel delegieren: SAMPLER, bei Schmerz OPQRST. Medikamentenplan fotografieren oder mitnehmen.<\/li>\n<li><strong>Antikoagulation<\/strong> ausdrücklich erfragen: Substanz, letzte Einnahme. Ändert Zielklinik, Lyse-Option, Verfahrenswahl bei Regionalanästhesie.<\/li>\n<li><strong>Team-Time-out<\/strong> vor riskanten Maßnahmen (Narkose, Kardioversion, Thoraxentlastung): laut, kurz, mit Rollen.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-merke\">\n<div class=\"box-label\">Merke<\/div>\n<p>Präklinisch gilt: Diagnose so weit wie nötig, Therapie so weit wie möglich, Zeit am Einsatzort so kurz wie vertretbar. Bei Tracer-Diagnosen (STEMI, Schlaganfall, Polytrauma, Sepsis) ist die Zielklinik oft die wichtigste Entscheidung des Einsatzes.<\/p>\n<\/div>","text":" \n vorgehen \n \n  lage und eigenschutz , dann nachforderung früh statt spät: zweiter rtw, rth, feuerwehr (tragehilfe, technische rettung), polizei, psnv. \n  10-sekunden-blick:  kritisch oder nicht kritisch? danach  cabcde  konsequent, jede intervention mit re-evaluation. \n  anamnese  parallel delegieren: sampler, bei schmerz opqrst. medikamentenplan fotografieren oder mitnehmen. \n  antikoagulation  ausdrücklich erfragen: substanz, letzte einnahme. ändert zielklinik, lyse-option, verfahrenswahl bei regionalanästhesie. \n  team-time-out  vor riskanten maßnahmen (narkose, kardioversion, thoraxentlastung): laut, kurz, mit rollen. \n \n \n \n merke \n präklinisch gilt: diagnose so weit wie nötig, therapie so weit wie möglich, zeit am einsatzort so kurz wie vertretbar. bei tracer-diagnosen (stemi, schlaganfall, polytrauma, sepsis) ist die zielklinik oft die wichtigste entscheidung des einsatzes. \n  struktur in den ersten minuten"},"o2":{"ch":1,"cht":"Grundlagen am Einsatzort","t":"Sauerstoff","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Ziel-SpO₂ 92–96 %<\/strong> (S3 Sauerstoff; ERC 94–98 %), bei Risiko für hyperkapnisches Versagen (COPD, Adipositas-Hypoventilation, neuromuskulär, Thoraxdeformität) <strong>88–92 %<\/strong>.<\/li>\n<li><strong>Kein O₂ bei Normoxie<\/strong>: ACS, Schlaganfall, Synkope profitieren nicht, Hyperoxie kann schaden.<\/li>\n<li><strong>Hochdosiert (Reservoir 10–15 l/min) unabhängig von der SpO₂:<\/strong> Reanimation und Periarrest, Schock, CO- und Rauchgasintoxikation, Tauchunfall, Pneumothorax vor Entlastung, Clusterkopfschmerz.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li>SpO₂ bei <strong>CO-Intoxikation falsch normal<\/strong>, bei Zentralisation, Kälte und Bewegung unzuverlässig.<\/li>\n<li>Hypoxie vs. Hyperkapnie: Ein COPD-Patient mit SpO₂ 99 % unter 15 l/min ist <strong>nicht<\/strong> gut versorgt.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  ziel-spo₂ 92–96 %  (s3 sauerstoff; erc 94–98 %), bei risiko für hyperkapnisches versagen (copd, adipositas-hypoventilation, neuromuskulär, thoraxdeformität)  88–92 % . \n  kein o₂ bei normoxie : acs, schlaganfall, synkope profitieren nicht, hyperoxie kann schaden. \n  hochdosiert (reservoir 10–15 l/min) unabhängig von der spo₂:  reanimation und periarrest, schock, co- und rauchgasintoxikation, tauchunfall, pneumothorax vor entlastung, clusterkopfschmerz. \n \n \n \n pitfalls \n \n spo₂ bei  co-intoxikation falsch normal , bei zentralisation, kälte und bewegung unzuverlässig. \n hypoxie vs. hyperkapnie: ein copd-patient mit spo₂ 99 % unter 15 l/min ist  nicht  gut versorgt. \n \n  sauerstoff"},"zugang":{"ch":1,"cht":"Grundlagen am Einsatzort","t":"Zugang","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>i.o. früh<\/strong>, wenn i.v. schwierig ist (Faustregel: 2 Versuche oder 90 s). Proximaler Humerus liefert beim Erwachsenen höheren Fluss als die Tibia; Tibia ist technisch fehlerärmer.<\/li>\n<li>Wacher Patient: <strong>Lidocain 2 % 40 mg<\/strong> (2 ml) langsam über die Nadel, kurz einwirken lassen, dann mit 10 ml NaCl spülen. Ohne Druckinfusion kaum Fluss.<\/li>\n<li><strong>Intranasal<\/strong> über Zerstäuber (MAD): max. 1 ml je Nasenloch, konzentrierte Lösungen verwenden.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  i.o. früh , wenn i.v. schwierig ist (faustregel: 2 versuche oder 90 s). proximaler humerus liefert beim erwachsenen höheren fluss als die tibia; tibia ist technisch fehlerärmer. \n wacher patient:  lidocain 2 % 40 mg  (2 ml) langsam über die nadel, kurz einwirken lassen, dann mit 10 ml nacl spülen. ohne druckinfusion kaum fluss. \n  intranasal  über zerstäuber (mad): max. 1 ml je nasenloch, konzentrierte lösungen verwenden. \n \n  zugang"},"pocus":{"ch":1,"cht":"Grundlagen am Einsatzort","t":"Präklinischer Ultraschall (POCUS)","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>eFAST<\/strong> beim Trauma: freie Flüssigkeit, Perikarderguss, Pneumothorax (fehlendes Lungengleiten, Lungenpunkt).<\/li>\n<li><strong>Schock und Dyspnoe:<\/strong> Perikarderguss, RV-Dilatation (LAE?), grob LV-Funktion, B-Linien (Lungenödem), V. cava, Aortendurchmesser (&gt; 3 cm abdominell auffällig).<\/li>\n<li>Gezielte Fragen mit Ja/Nein-Antwort; das Gerät darf Transport und Therapie nicht verzögern.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li>Fehlender Befund schließt nichts aus (frühe Blutung, retroperitoneal, Thoraxwandemphysem).<\/li>\n<li>In der Reanimation nur in den Rhythmuspausen, maximal 10 s, idealerweise mit Aufzeichnung.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  efast  beim trauma: freie flüssigkeit, perikarderguss, pneumothorax (fehlendes lungengleiten, lungenpunkt). \n  schock und dyspnoe:  perikarderguss, rv-dilatation (lae?), grob lv-funktion, b-linien (lungenödem), v. cava, aortendurchmesser (> 3 cm abdominell auffällig). \n gezielte fragen mit ja/nein-antwort; das gerät darf transport und therapie nicht verzögern. \n \n \n \n pitfalls \n \n fehlender befund schließt nichts aus (frühe blutung, retroperitoneal, thoraxwandemphysem). \n in der reanimation nur in den rhythmuspausen, maximal 10 s, idealerweise mit aufzeichnung. \n \n  präklinischer ultraschall (pocus)"},"ziel":{"ch":1,"cht":"Grundlagen am Einsatzort","t":"Zielklinik und Übergabe","html":"<table>\n<thead>\n<tr>\n<th>Tracer<\/th>\n<th>Ziel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>STEMI / OMI<\/td>\n<td>24/7-Herzkatheterlabor, direkt (Notaufnahme umgehen, wenn möglich)<\/td>\n<\/tr>\n<tr>\n<td>Schlaganfall<\/td>\n<td>Stroke Unit; bei Verdacht auf großen Gefäßverschluss Thrombektomie-Zentrum nach regionalem Konzept<\/td>\n<\/tr>\n<tr>\n<td>Polytrauma<\/td>\n<td>Traumazentrum nach TraumaNetzwerk (überregional bei schwerer Verletzung)<\/td>\n<\/tr>\n<tr>\n<td>Schwerbrandverletzte<\/td>\n<td>Brandverletztenzentrum, Bettenvermittlung über die Zentrale Anlaufstelle<\/td>\n<\/tr>\n<tr>\n<td>Drohende Frühgeburt<\/td>\n<td>Perinatalzentrum Level 1 bei &lt; 29+0 SSW oder &lt; 1250 g, mindestens Level 2 bei 29+0 bis 31+6 SSW (Kapitel 13)<\/td>\n<\/tr>\n<tr>\n<td>Hypothermie mit Kreislaufstillstand<\/td>\n<td>Klinik mit ECLS<\/td>\n<\/tr>\n<tr>\n<td>CO-Intoxikation, Tauchunfall<\/td>\n<td>HBO-Verfügbarkeit klären<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Voranmeldung strukturiert<\/strong>, z. B. nach ATMIST (Alter, Zeit, Mechanismus/Symptom, Befunde, Vitalzeichen, Therapie).<\/li>\n<li><strong>Übergabe im Schockraum:<\/strong> erst Hände weg, dann 60 Sekunden ununterbrochene Übergabe an alle, dann umlagern.<\/li>\n<\/ul>\n<\/div>","text":" \n \n \n tracer \n ziel \n \n \n \n \n stemi / omi \n 24/7-herzkatheterlabor, direkt (notaufnahme umgehen, wenn möglich) \n \n \n schlaganfall \n stroke unit; bei verdacht auf großen gefäßverschluss thrombektomie-zentrum nach regionalem konzept \n \n \n polytrauma \n traumazentrum nach traumanetzwerk (überregional bei schwerer verletzung) \n \n \n schwerbrandverletzte \n brandverletztenzentrum, bettenvermittlung über die zentrale anlaufstelle \n \n \n drohende frühgeburt \n perinatalzentrum level 1 bei < 29+0 ssw oder < 1250 g, mindestens level 2 bei 29+0 bis 31+6 ssw (kapitel 13) \n \n \n hypothermie mit kreislaufstillstand \n klinik mit ecls \n \n \n co-intoxikation, tauchunfall \n hbo-verfügbarkeit klären \n \n \n \n \n vorgehen \n \n  voranmeldung strukturiert , z. b. nach atmist (alter, zeit, mechanismus/symptom, befunde, vitalzeichen, therapie). \n  übergabe im schockraum:  erst hände weg, dann 60 sekunden ununterbrochene übergabe an alle, dann umlagern. \n \n  zielklinik und übergabe"},"recht":{"ch":1,"cht":"Grundlagen am Einsatzort","t":"Recht und Ethik kurz","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Transportverweigerung:<\/strong> Einwilligungsfähigkeit prüfen und dokumentieren (versteht die Information, wägt Folgen ab, äußert eine stabile Entscheidung). Risiken konkret aufklären, bis hin zum Tod. Gegenzeichnung, Zeuge, Rückkehrangebot, Hausarzt oder Angehörige informieren.<\/li>\n<li><strong>Patientenverfügung, Vorsorgevollmacht, Notfallbogen<\/strong> (z. B. aus der Behandlung im Voraus Planen nach § 132g SGB V) ernst nehmen. Im Zweifel beginnen, aber Therapiezieländerung ist auch präklinisch möglich und oft richtig.<\/li>\n<li><strong>Palliative Notfälle:<\/strong> Symptomkontrolle statt Eskalation, Verbleib zu Hause aktiv anbieten (Kapitel 14).<\/li>\n<li><strong>Todesfeststellung und Leichenschau<\/strong> sind landesrechtlich geregelt; bei nicht natürlicher oder ungeklärter Todesart Polizei verständigen.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li>Intoxikation, Hypoglykämie, Schädel-Hirn-Trauma und Delir heben die Einwilligungsfähigkeit oft auf. Dann gilt mutmaßlicher Wille bzw. Notstand, nicht die Unterschrift.<\/li>\n<li>Dokumentation ist der eigentliche Schutz: Befund, Aufklärungsinhalt, Uhrzeit, Zeugen.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  transportverweigerung:  einwilligungsfähigkeit prüfen und dokumentieren (versteht die information, wägt folgen ab, äußert eine stabile entscheidung). risiken konkret aufklären, bis hin zum tod. gegenzeichnung, zeuge, rückkehrangebot, hausarzt oder angehörige informieren. \n  patientenverfügung, vorsorgevollmacht, notfallbogen  (z. b. aus der behandlung im voraus planen nach § 132g sgb v) ernst nehmen. im zweifel beginnen, aber therapiezieländerung ist auch präklinisch möglich und oft richtig. \n  palliative notfälle:  symptomkontrolle statt eskalation, verbleib zu hause aktiv anbieten (kapitel 14). \n  todesfeststellung und leichenschau  sind landesrechtlich geregelt; bei nicht natürlicher oder ungeklärter todesart polizei verständigen. \n \n \n \n pitfalls \n \n intoxikation, hypoglykämie, schädel-hirn-trauma und delir heben die einwilligungsfähigkeit oft auf. dann gilt mutmaßlicher wille bzw. notstand, nicht die unterschrift. \n dokumentation ist der eigentliche schutz: befund, aufklärungsinhalt, uhrzeit, zeugen. \n \n  recht und ethik kurz"},"analgesie":{"ch":2,"cht":"Analgesie, Sedierung, Notfallnarkose","t":"Analgesie","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Ziel:<\/strong> NRS ≤ 4 bzw. für den Patienten erträglich (S3 Polytrauma: Empfehlungsgrad A), nicht Schmerzfreiheit um jeden Preis. Titrieren, nach 5 min neu bewerten.<\/li>\n<li><strong>Fentanyl, Ketamin und Morphin<\/strong> sind beim spontan atmenden Traumapatienten vergleichbar wirksam; entscheidend ist, überhaupt ausreichend zu dosieren.<\/li>\n<li><strong>Multimodal denken:<\/strong> Lagerung, Reposition, Schienung, Kühlung sind Analgesie. Nicht-Opioid früh dazu, Regionalanästhesie wo sinnvoll (Kapitel 3).<\/li>\n<li><strong>Monitoring<\/strong> bei jeder Opioid- oder Ketamingabe: SpO₂, RR, EKG; bei tieferer Sedierung Kapnografie über Nasenbrille.<\/li>\n<li>Analgesie <strong>verschleiert das akute Abdomen nicht<\/strong> und verschlechtert die Diagnostik in der Klinik nicht.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-dosis\">\n<div class=\"box-label\">Medikamente &amp; Dosis<\/div>\n<table>\n<thead>\n<tr>\n<th>Substanz<\/th>\n<th>Erwachsene<\/th>\n<th>Bemerkung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Fentanyl<\/td>\n<td>0,5–1 µg/kg i.v. (50–100 µg), dann 25–50 µg alle 5 min<\/td>\n<td>i.n. 1–2 µg/kg, max. 1 ml je Nasenloch<\/td>\n<\/tr>\n<tr>\n<td>Morphin<\/td>\n<td>2–5 mg i.v. alle 5 min (0,05–0,1 mg/kg)<\/td>\n<td>Kumulation bei Niereninsuffizienz, Histaminfreisetzung<\/td>\n<\/tr>\n<tr>\n<td>Piritramid<\/td>\n<td>3,75–7,5 mg i.v. titriert, max. 22,5 mg<\/td>\n<td>langsamer Wirkbeginn, schlecht steuerbar<\/td>\n<\/tr>\n<tr>\n<td>Nalbuphin<\/td>\n<td>0,1–0,3 mg/kg i.v., max. 20 mg je Gabe<\/td>\n<td>Ceiling-Effekt für Analgesie und Atemdepression; kein BtM<\/td>\n<\/tr>\n<tr>\n<td>Esketamin<\/td>\n<td>0,125–0,25 mg/kg i.v. (0,25–0,5 mg/kg i.m.)<\/td>\n<td>analgetisch, kaum atemdepressiv; i.n. 0,5–1 mg/kg off-label<\/td>\n<\/tr>\n<tr>\n<td>Ketamin (Razemat)<\/td>\n<td>doppelte Esketamin-Dosis<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Metamizol<\/td>\n<td>1–2,5 g als Kurzinfusion, max. 500 mg/min<\/td>\n<td>KI bei Hypotonie und instabilem Kreislauf; Agranulozytose selten<\/td>\n<\/tr>\n<tr>\n<td>Paracetamol<\/td>\n<td>1 g i.v. (≤ 50 kg: 15 mg/kg)<\/td>\n<td>Leberschaden, Mangelernährung: Dosis reduzieren<\/td>\n<\/tr>\n<tr>\n<td>Methoxyfluran<\/td>\n<td>3 ml im Inhalator, ggf. zweite Flasche, max. 6 ml/Tag<\/td>\n<td>Erwachsene mit Traumaschmerz; in Deutschland nur über Import erhältlich<\/td>\n<\/tr>\n<tr>\n<td>Ondansetron<\/td>\n<td>4 mg i.v.<\/td>\n<td>PONV-Prophylaxe bei Opioid; QT beachten<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Ältere und Gebrechliche:<\/strong> halbe Startdosis, längere Intervalle. Opioid plus Benzodiazepin ist die klassische Apnoe-Kombination.<\/li>\n<li><strong>Fentanyl schnell und hoch dosiert<\/strong> kann eine Thoraxrigidität auslösen; dann Relaxierung und Beatmung.<\/li>\n<li><strong>Ketamin bei ACS, Aortendissektion, schwerer Hypertonie<\/strong> zurückhaltend (Sympathikomimetik). Bei Dissoziation beruhigend begleiten; Midazolam 1–2 mg nur bei belastender Agitation, nicht routinemäßig.<\/li>\n<li><strong>Methoxyfluran:<\/strong> kontraindiziert bei Niereninsuffizienz, Bewusstseinsstörung, Kreislauf- oder Atem-Instabilität, maligner Hyperthermie in der Anamnese; im geschlossenen Fahrzeug lüften. In PreMeFen (Lancet 2025) war es i.v. Morphin und i.n. Fentanyl nicht unterlegen, 40 % brauchten aber zusätzliche Analgesie.<\/li>\n<li><strong>Morphin bei ACS<\/strong> verzögert die Resorption oraler P2Y12-Hemmer. Fentanyl titriert ist die pragmatische Alternative.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  ziel:  nrs ≤ 4 bzw. für den patienten erträglich (s3 polytrauma: empfehlungsgrad a), nicht schmerzfreiheit um jeden preis. titrieren, nach 5 min neu bewerten. \n  fentanyl, ketamin und morphin  sind beim spontan atmenden traumapatienten vergleichbar wirksam; entscheidend ist, überhaupt ausreichend zu dosieren. \n  multimodal denken:  lagerung, reposition, schienung, kühlung sind analgesie. nicht-opioid früh dazu, regionalanästhesie wo sinnvoll (kapitel 3). \n  monitoring  bei jeder opioid- oder ketamingabe: spo₂, rr, ekg; bei tieferer sedierung kapnografie über nasenbrille. \n analgesie  verschleiert das akute abdomen nicht  und verschlechtert die diagnostik in der klinik nicht. \n \n \n \n medikamente & dosis \n \n \n \n substanz \n erwachsene \n bemerkung \n \n \n \n \n fentanyl \n 0,5–1 µg/kg i.v. (50–100 µg), dann 25–50 µg alle 5 min \n i.n. 1–2 µg/kg, max. 1 ml je nasenloch \n \n \n morphin \n 2–5 mg i.v. alle 5 min (0,05–0,1 mg/kg) \n kumulation bei niereninsuffizienz, histaminfreisetzung \n \n \n piritramid \n 3,75–7,5 mg i.v. titriert, max. 22,5 mg \n langsamer wirkbeginn, schlecht steuerbar \n \n \n nalbuphin \n 0,1–0,3 mg/kg i.v., max. 20 mg je gabe \n ceiling-effekt für analgesie und atemdepression; kein btm \n \n \n esketamin \n 0,125–0,25 mg/kg i.v. (0,25–0,5 mg/kg i.m.) \n analgetisch, kaum atemdepressiv; i.n. 0,5–1 mg/kg off-label \n \n \n ketamin (razemat) \n doppelte esketamin-dosis \n  \n \n \n metamizol \n 1–2,5 g als kurzinfusion, max. 500 mg/min \n ki bei hypotonie und instabilem kreislauf; agranulozytose selten \n \n \n paracetamol \n 1 g i.v. (≤ 50 kg: 15 mg/kg) \n leberschaden, mangelernährung: dosis reduzieren \n \n \n methoxyfluran \n 3 ml im inhalator, ggf. zweite flasche, max. 6 ml/tag \n erwachsene mit traumaschmerz; in deutschland nur über import erhältlich \n \n \n ondansetron \n 4 mg i.v. \n ponv-prophylaxe bei opioid; qt beachten \n \n \n \n \n \n pitfalls \n \n  ältere und gebrechliche:  halbe startdosis, längere intervalle. opioid plus benzodiazepin ist die klassische apnoe-kombination. \n  fentanyl schnell und hoch dosiert  kann eine thoraxrigidität auslösen; dann relaxierung und beatmung. \n  ketamin bei acs, aortendissektion, schwerer hypertonie  zurückhaltend (sympathikomimetik). bei dissoziation beruhigend begleiten; midazolam 1–2 mg nur bei belastender agitation, nicht routinemäßig. \n  methoxyfluran:  kontraindiziert bei niereninsuffizienz, bewusstseinsstörung, kreislauf- oder atem-instabilität, maligner hyperthermie in der anamnese; im geschlossenen fahrzeug lüften. in premefen (lancet 2025) war es i.v. morphin und i.n. fentanyl nicht unterlegen, 40 % brauchten aber zusätzliche analgesie. \n  morphin bei acs  verzögert die resorption oraler p2y12-hemmer. fentanyl titriert ist die pragmatische alternative. \n \n  analgesie"},"sedierung":{"ch":2,"cht":"Analgesie, Sedierung, Notfallnarkose","t":"Prozedurale Sedierung","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Kardioversion:<\/strong> Propofol 0,5–1 mg/kg titriert oder Etomidat 0,1–0,2 mg/kg; bei Instabilität Esketamin 0,25–0,5 mg/kg plus kleine Propofol-Dosis. Sauerstoff, Beutel und Absaugung bereit.<\/li>\n<li><strong>Reposition:<\/strong> Esketamin 0,25–0,5 mg/kg i.v. plus Midazolam 1 mg oder Propofol 10–20 mg; Spontanatmung erhalten.<\/li>\n<li>Wer sediert, überwacht. Kapnografie über Nasenbrille ist das beste Frühwarnzeichen.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  kardioversion:  propofol 0,5–1 mg/kg titriert oder etomidat 0,1–0,2 mg/kg; bei instabilität esketamin 0,25–0,5 mg/kg plus kleine propofol-dosis. sauerstoff, beutel und absaugung bereit. \n  reposition:  esketamin 0,25–0,5 mg/kg i.v. plus midazolam 1 mg oder propofol 10–20 mg; spontanatmung erhalten. \n wer sediert, überwacht. kapnografie über nasenbrille ist das beste frühwarnzeichen. \n \n  prozedurale sedierung"},"narkose":{"ch":2,"cht":"Analgesie, Sedierung, Notfallnarkose","t":"Notfallnarkose","html":"<h3 id=\"k202-indikation-und-vorbereitung\">Indikation und Vorbereitung<\/h3>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Indikationen (S1 Notfallnarkose, S3 Polytrauma):<\/strong> respiratorisches Versagen (Hypoxie, AF &lt; 6 oder &gt; 29/min) trotz oder bei Kontraindikation für NIV; Bewusstlosigkeit mit Aspirationsgefahr; Trauma mit SpO₂ &lt; 90 % trotz O₂ (nach Ausschluss Spannungspneumothorax), SHT mit GCS &lt; 9, schwerem Thoraxtrauma mit AF &gt; 29/min; drohende Atemwegsverlegung (Inhalationstrauma, Anaphylaxie, Hals); nicht beherrschbare Agitation mit Eigen- oder Fremdgefährdung.<\/li>\n<li>Immer abwägen: <strong>Transportzeit vs. Risiko der Narkose am Einsatzort.<\/strong> Kurzer Transport in ein Haus mit Schockraum kann die bessere Option sein.<\/li>\n<li><strong>Checkliste laut<\/strong> (Team, Material, Medikamente, Plan B und C), dann Team-Time-out.<\/li>\n<li><strong>Lagerung:<\/strong> Oberkörper 20–30° hoch, Ohr auf Höhe des Sternums (Rampe beim Adipösen).<\/li>\n<li><strong>Kreislauf vorbereiten:<\/strong> zweiter Zugang, laufende Infusion, Vasopressor aufgezogen. Schockindex &gt; 0,9 → Induktionsdosis halbieren, Vasopressor vor Einleitung starten.<\/li>\n<\/ul>\n<\/div>\n<h3 id=\"k202-praeoxygenierung\">Präoxygenierung<\/h3>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>3–4 min dicht sitzende Maske mit 12–15 l/min<\/strong> (Beutel mit PEEP-Ventil oder Reservoir, Demand-Ventil), plus <strong>Nasenbrille 15 l/min<\/strong> für apnoische Oxygenierung.<\/li>\n<li><strong>Krikoiddruck<\/strong> wird nicht empfohlen.<\/li>\n<li><strong>Hypoxämischer Patient:<\/strong> Präoxygenierung über <strong>NIV/CPAP mit FiO₂ 1,0<\/strong> (PREOXI, siehe unten).<\/li>\n<li>Zwischen Einleitung und Laryngoskopie <strong>vorsichtige Maskenbeatmung<\/strong> ist bei Hypoxiegefahr erlaubt und sinnvoll (PREVENT).<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-dosis\">\n<div class=\"box-label\">Medikamente &amp; Dosis<\/div>\n<table>\n<thead>\n<tr>\n<th>Substanz<\/th>\n<th>Dosis<\/th>\n<th>Kommentar<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ketamin<\/td>\n<td>1–2 mg/kg (Esketamin 0,5–1 mg/kg)<\/td>\n<td>Standard im Schock, bei Bronchospasmus<\/td>\n<\/tr>\n<tr>\n<td>Etomidat<\/td>\n<td>0,15–0,3 mg/kg<\/td>\n<td>Myoklonien, Nebennierensuppression; beim Trauma laut S3 vermeiden<\/td>\n<\/tr>\n<tr>\n<td>Propofol<\/td>\n<td>1–2,5 mg/kg<\/td>\n<td>nur beim kreislaufstabilen Patienten<\/td>\n<\/tr>\n<tr>\n<td>Midazolam<\/td>\n<td>0,15–0,2 mg/kg<\/td>\n<td>langsamer Wirkeintritt, hypotensiv<\/td>\n<\/tr>\n<tr>\n<td>Fentanyl<\/td>\n<td>1–2 µg/kg<\/td>\n<td>im Schock reduzieren oder weglassen<\/td>\n<\/tr>\n<tr>\n<td>Rocuronium<\/td>\n<td>1–1,2 mg/kg<\/td>\n<td>Standard; Sugammadex 16 mg/kg nur, wenn mitgeführt<\/td>\n<\/tr>\n<tr>\n<td>Succinylcholin<\/td>\n<td>1–1,5 mg/kg<\/td>\n<td>KI: Hyperkaliämie, Verbrennung &gt; 24 h, Immobilisation, Myopathie, MH<\/td>\n<\/tr>\n<tr>\n<td>Noradrenalin-Bolus<\/td>\n<td>5–10 µg (1 mg auf 100 ml = 10 µg/ml)<\/td>\n<td>Push-dose, Perfusor 0,05–0,5 µg/kg/min<\/td>\n<\/tr>\n<tr>\n<td>Adrenalin-Bolus<\/td>\n<td>5–10 µg (1 mg auf 100 ml)<\/td>\n<td>Push-dose bei Periarrest<\/td>\n<\/tr>\n<tr>\n<td>Akrinor<\/td>\n<td>1 Amp. (2 ml) auf 10 ml, davon 1–2 ml<\/td>\n<td>Cafedrin/Theodrenalin, schneller Effekt<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<h3 id=\"k202-atemweg\">Atemweg<\/h3>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Videolaryngoskopie mit Macintosh-Spatel primär<\/strong> (S1 Prähospitales Atemwegsmanagement; S1 Atemwegsmanagement 2023: bei Aspirationsrisiko und kritisch Kranken „soll\"), Bougie griffbereit. Maximal <strong>2 Intubationsversuche<\/strong> von je ≤ 30 s, dann <strong>supraglottischer Atemweg der 2. Generation<\/strong>.<\/li>\n<li><strong>HWS-Trauma:<\/strong> manuelle Inline-Stabilisierung, Orthese zur Intubation öffnen.<\/li>\n<li><strong>CICO<\/strong> (cannot intubate, cannot oxygenate): sofort <strong>Koniotomie<\/strong> (Skalpell-Bougie-Tubus); nicht zu lange mit weiteren Versuchen verlieren.<\/li>\n<li><strong>Kapnografie kontinuierlich<\/strong>, vom ersten Atemzug bis zur Übergabe. Ohne Kurve liegt der Tubus falsch, bis das Gegenteil bewiesen ist (Ausnahme: Kreislaufstillstand mit sehr niedrigem, aber vorhandenem Signal).<\/li>\n<li>Tubus nach jeder Umlagerung kontrollieren (Lage, Kapnografie, Fixierung).<\/li>\n<\/ul>\n<\/div>\n<h3 id=\"k202-nach-der-intubation\">Nach der Intubation<\/h3>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Beatmung:<\/strong> Tidalvolumen 6–8 ml/kg Idealgewicht, AF 12–16/min, PEEP 5–8 cmH₂O, Plateaudruck &lt; 30 cmH₂O, FiO₂ nach SpO₂ 94–98 %. Ziel-etCO₂ 35–40 mmHg, aber: im Schock und bei Lungenpathologie liegt der paCO₂ deutlich über dem etCO₂.<\/li>\n<li><strong>Aufrechterhaltung:<\/strong> Analgesie plus Hypnose vor erneuter Relaxierung. Awareness ist präklinisch häufiger als gedacht, besonders nach Ketamin-Einzeldosis mit langwirkendem Relaxans.<\/li>\n<li>Magensonde bei Maskenbeatmung mit Mageninsufflation.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-neu\">\n<div class=\"box-label\">Evidenz &amp; Neu<\/div>\n<ul>\n<li><strong>RSI-Trial (NEJM 2025, n = 2365, Notaufnahme und ITS):<\/strong> Ketamin (median 1,6 mg/kg) vs. Etomidat (0,28 mg/kg): 28-Tage-Mortalität 28,1 vs. 29,1 % (kein Unterschied). <strong>Kardiovaskulärer Kollaps unter Ketamin häufiger<\/strong> (22,1 vs. 17,0 %, bei Sepsis 30,6 vs. 20,9 %). Ketamin ist nicht automatisch das „kreislaufstabile\" Mittel: Dosis reduzieren, Vasopressor vorbereiten.<\/li>\n<li><strong>S3 Polytrauma<\/strong> empfiehlt beim Trauma trotzdem Ketamin statt Etomidat (Nebennierensuppression).<\/li>\n<li><strong>PREOXI (NEJM 2024):<\/strong> NIV-Präoxygenierung halbiert die Hypoxämierate (SpO₂ &lt; 85 %: 9,1 vs. 18,5 %, NNT 11) gegenüber Maske.<\/li>\n<li><strong>DEVICE (NEJM 2023):<\/strong> Videolaryngoskopie erhöht die Erstintubationsrate (85,1 vs. 70,8 %) ohne mehr Komplikationen.<\/li>\n<li><strong>PREVENT (NEJM 2019):<\/strong> Maskenbeatmung zwischen Einleitung und Laryngoskopie halbiert schwere Hypoxämien (SpO₂ &lt; 80 %: 10,9 vs. 22,8 %) ohne mehr Aspirationen.<\/li>\n<li><strong>BOUGIE (JAMA 2021):<\/strong> routinemäßiger Bougie-Einsatz verbessert die Erstintubationsrate nicht (80,4 vs. 83,0 %); als Hilfsmittel beim Videolaryngoskop und als Rescue trotzdem sinnvoll.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Postinduktionshypotonie<\/strong> ist der häufigste schwere Zwischenfall; Ursache meist zu hohe Dosis bei Volumenmangel plus Überdruckbeatmung.<\/li>\n<li><strong>Desaturation nach Intubation:<\/strong> DOPES (Dislokation, Obstruktion, Pneumothorax, Equipment, Stomach/Stacking).<\/li>\n<li><strong>Asthma und COPD:<\/strong> niedrige Frequenz, lange Exspiration; bei Kreislaufeinbruch diskonnektieren (Auto-PEEP).<\/li>\n<li><strong>Metabolische Azidose<\/strong> (DKA, Sepsis, Intoxikation): Der Patient kompensiert mit hohem Atemminutenvolumen. Nach der Intubation sofort mit hoher Frequenz weiterbeatmen, sonst droht der Kreislaufstillstand.<\/li>\n<li><strong>Rechtsherzbelastung<\/strong> (LAE, pulmonale Hypertonie): Einleitung und PEEP können den Kreislauf kippen; Noradrenalin vorab, minimale Hypnotikadosis.<\/li>\n<\/ul>\n<\/div>","text":" indikation und vorbereitung \n \n vorgehen \n \n  indikationen (s1 notfallnarkose, s3 polytrauma):  respiratorisches versagen (hypoxie, af < 6 oder > 29/min) trotz oder bei kontraindikation für niv; bewusstlosigkeit mit aspirationsgefahr; trauma mit spo₂ < 90 % trotz o₂ (nach ausschluss spannungspneumothorax), sht mit gcs < 9, schwerem thoraxtrauma mit af > 29/min; drohende atemwegsverlegung (inhalationstrauma, anaphylaxie, hals); nicht beherrschbare agitation mit eigen- oder fremdgefährdung. \n immer abwägen:  transportzeit vs. risiko der narkose am einsatzort.  kurzer transport in ein haus mit schockraum kann die bessere option sein. \n  checkliste laut  (team, material, medikamente, plan b und c), dann team-time-out. \n  lagerung:  oberkörper 20–30° hoch, ohr auf höhe des sternums (rampe beim adipösen). \n  kreislauf vorbereiten:  zweiter zugang, laufende infusion, vasopressor aufgezogen. schockindex > 0,9 → induktionsdosis halbieren, vasopressor vor einleitung starten. \n \n \n präoxygenierung \n \n vorgehen \n \n  3–4 min dicht sitzende maske mit 12–15 l/min  (beutel mit peep-ventil oder reservoir, demand-ventil), plus  nasenbrille 15 l/min  für apnoische oxygenierung. \n  krikoiddruck  wird nicht empfohlen. \n  hypoxämischer patient:  präoxygenierung über  niv/cpap mit fio₂ 1,0  (preoxi, siehe unten). \n zwischen einleitung und laryngoskopie  vorsichtige maskenbeatmung  ist bei hypoxiegefahr erlaubt und sinnvoll (prevent). \n \n \n \n medikamente & dosis \n \n \n \n substanz \n dosis \n kommentar \n \n \n \n \n ketamin \n 1–2 mg/kg (esketamin 0,5–1 mg/kg) \n standard im schock, bei bronchospasmus \n \n \n etomidat \n 0,15–0,3 mg/kg \n myoklonien, nebennierensuppression; beim trauma laut s3 vermeiden \n \n \n propofol \n 1–2,5 mg/kg \n nur beim kreislaufstabilen patienten \n \n \n midazolam \n 0,15–0,2 mg/kg \n langsamer wirkeintritt, hypotensiv \n \n \n fentanyl \n 1–2 µg/kg \n im schock reduzieren oder weglassen \n \n \n rocuronium \n 1–1,2 mg/kg \n standard; sugammadex 16 mg/kg nur, wenn mitgeführt \n \n \n succinylcholin \n 1–1,5 mg/kg \n ki: hyperkaliämie, verbrennung > 24 h, immobilisation, myopathie, mh \n \n \n noradrenalin-bolus \n 5–10 µg (1 mg auf 100 ml = 10 µg/ml) \n push-dose, perfusor 0,05–0,5 µg/kg/min \n \n \n adrenalin-bolus \n 5–10 µg (1 mg auf 100 ml) \n push-dose bei periarrest \n \n \n akrinor \n 1 amp. (2 ml) auf 10 ml, davon 1–2 ml \n cafedrin/theodrenalin, schneller effekt \n \n \n \n \n atemweg \n \n vorgehen \n \n  videolaryngoskopie mit macintosh-spatel primär  (s1 prähospitales atemwegsmanagement; s1 atemwegsmanagement 2023: bei aspirationsrisiko und kritisch kranken „soll\"), bougie griffbereit. maximal  2 intubationsversuche  von je ≤ 30 s, dann  supraglottischer atemweg der 2. generation . \n  hws-trauma:  manuelle inline-stabilisierung, orthese zur intubation öffnen. \n  cico  (cannot intubate, cannot oxygenate): sofort  koniotomie  (skalpell-bougie-tubus); nicht zu lange mit weiteren versuchen verlieren. \n  kapnografie kontinuierlich , vom ersten atemzug bis zur übergabe. ohne kurve liegt der tubus falsch, bis das gegenteil bewiesen ist (ausnahme: kreislaufstillstand mit sehr niedrigem, aber vorhandenem signal). \n tubus nach jeder umlagerung kontrollieren (lage, kapnografie, fixierung). \n \n \n nach der intubation \n \n vorgehen \n \n  beatmung:  tidalvolumen 6–8 ml/kg idealgewicht, af 12–16/min, peep 5–8 cmh₂o, plateaudruck < 30 cmh₂o, fio₂ nach spo₂ 94–98 %. ziel-etco₂ 35–40 mmhg, aber: im schock und bei lungenpathologie liegt der paco₂ deutlich über dem etco₂. \n  aufrechterhaltung:  analgesie plus hypnose vor erneuter relaxierung. awareness ist präklinisch häufiger als gedacht, besonders nach ketamin-einzeldosis mit langwirkendem relaxans. \n magensonde bei maskenbeatmung mit mageninsufflation. \n \n \n \n evidenz & neu \n \n  rsi-trial (nejm 2025, n = 2365, notaufnahme und its):  ketamin (median 1,6 mg/kg) vs. etomidat (0,28 mg/kg): 28-tage-mortalität 28,1 vs. 29,1 % (kein unterschied).  kardiovaskulärer kollaps unter ketamin häufiger  (22,1 vs. 17,0 %, bei sepsis 30,6 vs. 20,9 %). ketamin ist nicht automatisch das „kreislaufstabile\" mittel: dosis reduzieren, vasopressor vorbereiten. \n  s3 polytrauma  empfiehlt beim trauma trotzdem ketamin statt etomidat (nebennierensuppression). \n  preoxi (nejm 2024):  niv-präoxygenierung halbiert die hypoxämierate (spo₂ < 85 %: 9,1 vs. 18,5 %, nnt 11) gegenüber maske. \n  device (nejm 2023):  videolaryngoskopie erhöht die erstintubationsrate (85,1 vs. 70,8 %) ohne mehr komplikationen. \n  prevent (nejm 2019):  maskenbeatmung zwischen einleitung und laryngoskopie halbiert schwere hypoxämien (spo₂ < 80 %: 10,9 vs. 22,8 %) ohne mehr aspirationen. \n  bougie (jama 2021):  routinemäßiger bougie-einsatz verbessert die erstintubationsrate nicht (80,4 vs. 83,0 %); als hilfsmittel beim videolaryngoskop und als rescue trotzdem sinnvoll. \n \n \n \n pitfalls \n \n  postinduktionshypotonie  ist der häufigste schwere zwischenfall; ursache meist zu hohe dosis bei volumenmangel plus überdruckbeatmung. \n  desaturation nach intubation:  dopes (dislokation, obstruktion, pneumothorax, equipment, stomach/stacking). \n  asthma und copd:  niedrige frequenz, lange exspiration; bei kreislaufeinbruch diskonnektieren (auto-peep). \n  metabolische azidose  (dka, sepsis, intoxikation): der patient kompensiert mit hohem atemminutenvolumen. nach der intubation sofort mit hoher frequenz weiterbeatmen, sonst droht der kreislaufstillstand. \n  rechtsherzbelastung  (lae, pulmonale hypertonie): einleitung und peep können den kreislauf kippen; noradrenalin vorab, minimale hypnotikadosis. \n \n  notfallnarkose"},"ra":{"ch":3,"cht":"Regionalanästhesie in der Präklinik","t":"Stellenwert","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Wofür:<\/strong> gezielte Analgesie für Lagerung, Reposition und Transport ohne Opioid-Nebenwirkungen; besonders beim älteren, deliranzgefährdeten Patienten mit Hüftfraktur.<\/li>\n<li><strong>Keine Leitlinie<\/strong> in Deutschland. Durchführung nach Facharztstandard bzw. mit nachgewiesener Erfahrung, idealerweise mit SOP oder Freigabe durch den ÄLRD.<\/li>\n<li>Die folgenden Abschnitte sind nach <strong>Lagebild<\/strong> gegliedert: Was liegt vor, welches Verfahren passt, wie geht es, worauf achten.<\/li>\n<\/ul>\n<\/div>\n<table>\n<thead>\n<tr>\n<th>Lagebild<\/th>\n<th>Verfahren der Wahl<\/th>\n<th>Alternative<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Proximale Femurfraktur<\/td>\n<td>Fascia-iliaca-Block (FICB) infrainguinal<\/td>\n<td>Femoralisblock, suprainguinaler FICB (beide Ultraschall)<\/td>\n<\/tr>\n<tr>\n<td>Femurschaftfraktur<\/td>\n<td>Femoralisblock (Ultraschall) oder FICB<\/td>\n<td>Analgosedierung<\/td>\n<\/tr>\n<tr>\n<td>Patellaluxation<\/td>\n<td>Reposition ohne Block, ggf. Analgesie<\/td>\n<td>Femoralisblock<\/td>\n<\/tr>\n<tr>\n<td>OSG-Fraktur, Luxationsfraktur<\/td>\n<td>Analgosedierung zur Reposition<\/td>\n<td>intraartikuläres Lidocain; poplitealer Ischiadikusblock nur mit Routine<\/td>\n<\/tr>\n<tr>\n<td>Schulterluxation (vordere)<\/td>\n<td>intraartikuläres Lidocain oder Technik ohne Medikamente<\/td>\n<td>Analgosedierung<\/td>\n<\/tr>\n<tr>\n<td>Distale Radiusfraktur<\/td>\n<td>Hämatomblock<\/td>\n<td>Analgosedierung<\/td>\n<\/tr>\n<tr>\n<td>Finger: Fraktur, Luxation, Wunde<\/td>\n<td>Fingerblock<\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td>Rippenserienfraktur<\/td>\n<td>systemische Analgesie, NIV<\/td>\n<td>Serratus- oder ESP-Block (Ultraschall, Routine)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"box box-neu\">\n<div class=\"box-label\">Evidenz &amp; Neu<\/div>\n<ul>\n<li><strong>Cochrane 2020 (Hüftfraktur, perioperativ und Notaufnahme):<\/strong> periphere Nervenblockaden senken den Bewegungsschmerz nach 30 min um etwa 2,5 NRS-Punkte (hohe Evidenz), das <strong>Delir<\/strong> (RR 0,67, NNT 12, hohe Evidenz) und wahrscheinlich die <strong>Pneumonie<\/strong> (RR 0,41, moderate Evidenz). Kein klarer Effekt auf die Mortalität.<\/li>\n<li><strong>Präklinischer FICB (Metaanalysen 2018 und 2023):<\/strong> Erfolgsrate etwa 90 %, sehr wenige Komplikationen (Einzelfälle von LAST). Überlegenheit gegenüber Opioiden präklinisch nicht belegt, Datenlage klein und heterogen.<\/li>\n<li><strong>RAPID2<\/strong> (UK, Notfallsanitäter, Landmarken-FICB mit Prilocain 1 %, n = 1404) rekrutiert noch; Ergebnisse frühestens 2027.<\/li>\n<li><strong>Kalmbach 2018 (deutsche Notarzt-RCT):<\/strong> ultraschallgesteuerte Blockade (10 ml Prilocain 1 % plus 10 ml Ropivacain 0,2 %) vs. Analgosedierung vor Reposition: Reposition „einfach\" in 80 vs. 22 %, NRS median 0 vs. 6.<\/li>\n<li><strong>ESRA-Umfrage 2026:<\/strong> 82 % befürworten präklinische Regionalanästhesie, nur 20 % nutzen sie. Als Voraussetzung werden Ultraschall und mitgeführte Lipidemulsion genannt.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  wofür:  gezielte analgesie für lagerung, reposition und transport ohne opioid-nebenwirkungen; besonders beim älteren, deliranzgefährdeten patienten mit hüftfraktur. \n  keine leitlinie  in deutschland. durchführung nach facharztstandard bzw. mit nachgewiesener erfahrung, idealerweise mit sop oder freigabe durch den älrd. \n die folgenden abschnitte sind nach  lagebild  gegliedert: was liegt vor, welches verfahren passt, wie geht es, worauf achten. \n \n \n \n \n \n lagebild \n verfahren der wahl \n alternative \n \n \n \n \n proximale femurfraktur \n fascia-iliaca-block (ficb) infrainguinal \n femoralisblock, suprainguinaler ficb (beide ultraschall) \n \n \n femurschaftfraktur \n femoralisblock (ultraschall) oder ficb \n analgosedierung \n \n \n patellaluxation \n reposition ohne block, ggf. analgesie \n femoralisblock \n \n \n osg-fraktur, luxationsfraktur \n analgosedierung zur reposition \n intraartikuläres lidocain; poplitealer ischiadikusblock nur mit routine \n \n \n schulterluxation (vordere) \n intraartikuläres lidocain oder technik ohne medikamente \n analgosedierung \n \n \n distale radiusfraktur \n hämatomblock \n analgosedierung \n \n \n finger: fraktur, luxation, wunde \n fingerblock \n – \n \n \n rippenserienfraktur \n systemische analgesie, niv \n serratus- oder esp-block (ultraschall, routine) \n \n \n \n \n evidenz & neu \n \n  cochrane 2020 (hüftfraktur, perioperativ und notaufnahme):  periphere nervenblockaden senken den bewegungsschmerz nach 30 min um etwa 2,5 nrs-punkte (hohe evidenz), das  delir  (rr 0,67, nnt 12, hohe evidenz) und wahrscheinlich die  pneumonie  (rr 0,41, moderate evidenz). kein klarer effekt auf die mortalität. \n  präklinischer ficb (metaanalysen 2018 und 2023):  erfolgsrate etwa 90 %, sehr wenige komplikationen (einzelfälle von last). überlegenheit gegenüber opioiden präklinisch nicht belegt, datenlage klein und heterogen. \n  rapid2  (uk, notfallsanitäter, landmarken-ficb mit prilocain 1 %, n = 1404) rekrutiert noch; ergebnisse frühestens 2027. \n  kalmbach 2018 (deutsche notarzt-rct):  ultraschallgesteuerte blockade (10 ml prilocain 1 % plus 10 ml ropivacain 0,2 %) vs. analgosedierung vor reposition: reposition „einfach\" in 80 vs. 22 %, nrs median 0 vs. 6. \n  esra-umfrage 2026:  82 % befürworten präklinische regionalanästhesie, nur 20 % nutzen sie. als voraussetzung werden ultraschall und mitgeführte lipidemulsion genannt. \n \n  stellenwert"},"ra-vor":{"ch":3,"cht":"Regionalanästhesie in der Präklinik","t":"Voraussetzungen","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Aufklärung<\/strong> kurz mündlich: Nervenschaden, LAST, Blutung, Schwäche des Beins mit Sturzgefahr. Ein analgetischer Block ist aufschiebbar, deshalb ist die Aufklärung nötig.<\/li>\n<li><strong>pDMS, Motorik und Sensibilität vor dem Block<\/strong> dokumentieren.<\/li>\n<li><strong>Monitoring<\/strong> (EKG, SpO₂, NIBP), <strong>laufender Zugang<\/strong>, Notfallmedikamente.<\/li>\n<li><strong>Lipidemulsion 20 % ≥ 500 ml<\/strong> im Fahrzeug, sonst keine Blockade.<\/li>\n<li><strong>Asepsis:<\/strong> Hautdesinfektion, sterile Handschuhe, steril verpackte Nadel.<\/li>\n<li><strong>Überwachung ≥ 30 min<\/strong> nach dem Block (Transportzeit zählt).<\/li>\n<li><strong>Gegenanzeigen:<\/strong> fehlende Einwilligung oder Kooperation, Infektion an der Punktionsstelle, LA-Allergie, unklarer neurologischer Status, ungeklärter Gefäßschaden.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Antikoagulation<\/div>\n<ul>\n<li><strong>Oberflächliche, komprimierbare Blöcke<\/strong> (infrainguinaler FICB, Femoralisblock, Hämatomblock, Fingerblock) sind nach ESAIC/ESRA 2022 auch unter VKA, DOAK, Heparin und Thrombozytenaggregationshemmern möglich.<\/li>\n<li><strong>Tiefe Blöcke<\/strong> folgen den Regeln für rückenmarksnahe Verfahren: präklinisch unter Antikoagulation nicht.<\/li>\n<li>Ultraschall reduziert das Risiko einer Gefäßpunktion.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  aufklärung  kurz mündlich: nervenschaden, last, blutung, schwäche des beins mit sturzgefahr. ein analgetischer block ist aufschiebbar, deshalb ist die aufklärung nötig. \n  pdms, motorik und sensibilität vor dem block  dokumentieren. \n  monitoring  (ekg, spo₂, nibp),  laufender zugang , notfallmedikamente. \n  lipidemulsion 20 % ≥ 500 ml  im fahrzeug, sonst keine blockade. \n  asepsis:  hautdesinfektion, sterile handschuhe, steril verpackte nadel. \n  überwachung ≥ 30 min  nach dem block (transportzeit zählt). \n  gegenanzeigen:  fehlende einwilligung oder kooperation, infektion an der punktionsstelle, la-allergie, unklarer neurologischer status, ungeklärter gefäßschaden. \n \n \n \n antikoagulation \n \n  oberflächliche, komprimierbare blöcke  (infrainguinaler ficb, femoralisblock, hämatomblock, fingerblock) sind nach esaic/esra 2022 auch unter vka, doak, heparin und thrombozytenaggregationshemmern möglich. \n  tiefe blöcke  folgen den regeln für rückenmarksnahe verfahren: präklinisch unter antikoagulation nicht. \n ultraschall reduziert das risiko einer gefäßpunktion. \n \n  voraussetzungen"},"la":{"ch":3,"cht":"Regionalanästhesie in der Präklinik","t":"Lokalanästhetika","html":"<div class=\"box box-dosis\">\n<div class=\"box-label\">Medikamente &amp; Dosis<\/div>\n<table>\n<thead>\n<tr>\n<th>Substanz<\/th>\n<th>Maximaldosis Erwachsene<\/th>\n<th>Präklinische Rolle<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Prilocain 1 %<\/td>\n<td>400 mg (DGAI) bzw. 600 mg oder 8,5 mg/kg (Fachinfo)<\/td>\n<td>erste Wahl: schneller Wirkbeginn, geringe Toxizität, 2–3 h Wirkung<\/td>\n<\/tr>\n<tr>\n<td>Lidocain 1 %<\/td>\n<td>300 mg ohne, 500 mg mit Adrenalin (DGAI konservativer: 200–400 mg)<\/td>\n<td>Hämatomblock, Fingerblock, FICB mit Adrenalin<\/td>\n<\/tr>\n<tr>\n<td>Mepivacain 1 %<\/td>\n<td>300–400 mg<\/td>\n<td>Alternative zu Prilocain<\/td>\n<\/tr>\n<tr>\n<td>Ropivacain 0,2–0,375 %<\/td>\n<td>etwa 225–300 mg<\/td>\n<td>lange Wirkung (6–12 h); Neurostatus in der Klinik erschwert<\/td>\n<\/tr>\n<tr>\n<td>Bupivacain<\/td>\n<td>150 mg (2 mg/kg)<\/td>\n<td>präklinisch keine Rolle (Kardiotoxizität)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Mischungen<\/strong> addieren die Toxizität: nicht von jedem Mittel die Maximaldosis geben.<\/li>\n<li><strong>Prilocain<\/strong> bildet dosisabhängig Methämoglobin (relevant ab etwa 600 mg oder bei Wiederholung): SpO₂ fällt scheinbar, Haut grau-zyanotisch. Therapie Toluidinblau 2–4 mg/kg i.v. Prilocain nicht bei Säuglingen &lt; 6 Monate; Vorsicht bei schwerer Anämie und Herzinsuffizienz.<\/li>\n<li><strong>Ältere, Kachektische, Niereninsuffiziente:<\/strong> Maximaldosis nach Gewicht, nicht nach Tabelle für 70 kg.<\/li>\n<\/ul>\n<\/div>","text":" \n medikamente & dosis \n \n \n \n substanz \n maximaldosis erwachsene \n präklinische rolle \n \n \n \n \n prilocain 1 % \n 400 mg (dgai) bzw. 600 mg oder 8,5 mg/kg (fachinfo) \n erste wahl: schneller wirkbeginn, geringe toxizität, 2–3 h wirkung \n \n \n lidocain 1 % \n 300 mg ohne, 500 mg mit adrenalin (dgai konservativer: 200–400 mg) \n hämatomblock, fingerblock, ficb mit adrenalin \n \n \n mepivacain 1 % \n 300–400 mg \n alternative zu prilocain \n \n \n ropivacain 0,2–0,375 % \n etwa 225–300 mg \n lange wirkung (6–12 h); neurostatus in der klinik erschwert \n \n \n bupivacain \n 150 mg (2 mg/kg) \n präklinisch keine rolle (kardiotoxizität) \n \n \n \n \n \n pitfalls \n \n  mischungen  addieren die toxizität: nicht von jedem mittel die maximaldosis geben. \n  prilocain  bildet dosisabhängig methämoglobin (relevant ab etwa 600 mg oder bei wiederholung): spo₂ fällt scheinbar, haut grau-zyanotisch. therapie toluidinblau 2–4 mg/kg i.v. prilocain nicht bei säuglingen < 6 monate; vorsicht bei schwerer anämie und herzinsuffizienz. \n  ältere, kachektische, niereninsuffiziente:  maximaldosis nach gewicht, nicht nach tabelle für 70 kg. \n \n  lokalanästhetika"},"ficb":{"ch":3,"cht":"Regionalanästhesie in der Präklinik","t":"Lagebild: Proximale Femurfraktur","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Lagebild<\/div>\n<ul>\n<li>Meist älterer Patient nach Sturz aus dem Stand; Bein verkürzt und außenrotiert, Leistenschmerz, Bewegung unmöglich.<\/li>\n<li>Häufig antikoaguliert, delirgefährdet, mit Vorerkrankungen. <strong>Sturzursache<\/strong> mitklären (Synkope, Rhythmusstörung, Hypoglykämie, Infekt).<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Verfahren<\/div>\n<ul>\n<li><strong>Fascia-iliaca-Block infrainguinal<\/strong>, Landmarke oder Ultraschall. Erfasst N. femoralis und meist N. cutaneus femoris lateralis, den N. obturatorius nur inkonstant.<\/li>\n<li>Unter Antikoagulation möglich (oberflächlich, komprimierbar).<\/li>\n<li><strong>Alternative mit Ultraschall:<\/strong> suprainguinaler FICB (bessere Ausbreitung zum Plexus lumbalis, perioperativ länger wirksam, präklinisch kaum Daten) oder Femoralisblock.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Technik: Landmarke („Two-Pop&quot;)<\/div>\n<ul>\n<li><strong>Rückenlage<\/strong>, Bein neutral. Verbindungslinie Spina iliaca anterior superior bis Tuberculum pubicum dritteln.<\/li>\n<li><strong>Punktion 1–2 cm kaudal<\/strong> des Übergangs vom lateralen zum mittleren Drittel; A. femoralis tasten und sicher medial der Punktionsstelle lassen.<\/li>\n<li><strong>Stumpfe Nadel<\/strong> (z. B. 18-G-Tuohy oder kurzer Schliff), senkrecht bzw. leicht nach kranial. Zwei Widerstandsverluste: <strong>Fascia lata<\/strong>, dann <strong>Fascia iliaca<\/strong>.<\/li>\n<li><strong>Aspirieren<\/strong>, dann fraktioniert in 5-ml-Schritten mit Zwischenaspiration injizieren. <strong>Distal komprimieren<\/strong> während der Injektion fördert die Ausbreitung nach kranial. Wirkbeginn nach 15–20 min.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Technik: Ultraschall<\/div>\n<ul>\n<li><strong>Linearschallkopf<\/strong> quer in der Leiste: A. femoralis, lateral davon N. femoralis unter der Fascia iliaca, darunter M. iliacus.<\/li>\n<li><strong>In-plane von lateral<\/strong>, Nadelspitze unter die Fascia iliaca etwa im lateralen Drittel, Hydrodissektion zwischen Faszie und Muskel nach medial und lateral.<\/li>\n<li><strong>Ultraschall vs. Landmarke:<\/strong> vollständigere Blockade des Oberschenkels (82 vs. 47 %); ohne regelmäßige Übung ist die Landmarkentechnik eine vertretbare Wahl.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-dosis\">\n<div class=\"box-label\">Medikamente &amp; Dosis<\/div>\n<table>\n<thead>\n<tr>\n<th>Präparat<\/th>\n<th>Volumen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Prilocain 1 %<\/td>\n<td>30–40 ml (300–400 mg); bei &lt; 50 kg nach Gewicht reduzieren<\/td>\n<\/tr>\n<tr>\n<td>Lidocain 1 % mit Adrenalin<\/td>\n<td>0,3 ml/kg (3 mg/kg)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Zu medial<\/strong> = Nähe zur A. femoralis und intravasale Injektion. Lateral bleiben.<\/li>\n<li><strong>Keine vollständige Analgesie<\/strong> der Hüfte (dorsale Kapsel, N. obturatorius): ergänzend Analgetikum anbieten.<\/li>\n<li><strong>Quadrizepsschwäche:<\/strong> Patient darf nicht aufstehen; Sturzgefahr bei Umlagerung.<\/li>\n<\/ul>\n<\/div>","text":" \n lagebild \n \n meist älterer patient nach sturz aus dem stand; bein verkürzt und außenrotiert, leistenschmerz, bewegung unmöglich. \n häufig antikoaguliert, delirgefährdet, mit vorerkrankungen.  sturzursache  mitklären (synkope, rhythmusstörung, hypoglykämie, infekt). \n \n \n \n verfahren \n \n  fascia-iliaca-block infrainguinal , landmarke oder ultraschall. erfasst n. femoralis und meist n. cutaneus femoris lateralis, den n. obturatorius nur inkonstant. \n unter antikoagulation möglich (oberflächlich, komprimierbar). \n  alternative mit ultraschall:  suprainguinaler ficb (bessere ausbreitung zum plexus lumbalis, perioperativ länger wirksam, präklinisch kaum daten) oder femoralisblock. \n \n \n \n technik: landmarke („two-pop\") \n \n  rückenlage , bein neutral. verbindungslinie spina iliaca anterior superior bis tuberculum pubicum dritteln. \n  punktion 1–2 cm kaudal  des übergangs vom lateralen zum mittleren drittel; a. femoralis tasten und sicher medial der punktionsstelle lassen. \n  stumpfe nadel  (z. b. 18-g-tuohy oder kurzer schliff), senkrecht bzw. leicht nach kranial. zwei widerstandsverluste:  fascia lata , dann  fascia iliaca . \n  aspirieren , dann fraktioniert in 5-ml-schritten mit zwischenaspiration injizieren.  distal komprimieren  während der injektion fördert die ausbreitung nach kranial. wirkbeginn nach 15–20 min. \n \n \n \n technik: ultraschall \n \n  linearschallkopf  quer in der leiste: a. femoralis, lateral davon n. femoralis unter der fascia iliaca, darunter m. iliacus. \n  in-plane von lateral , nadelspitze unter die fascia iliaca etwa im lateralen drittel, hydrodissektion zwischen faszie und muskel nach medial und lateral. \n  ultraschall vs. landmarke:  vollständigere blockade des oberschenkels (82 vs. 47 %); ohne regelmäßige übung ist die landmarkentechnik eine vertretbare wahl. \n \n \n \n medikamente & dosis \n \n \n \n präparat \n volumen \n \n \n \n \n prilocain 1 % \n 30–40 ml (300–400 mg); bei < 50 kg nach gewicht reduzieren \n \n \n lidocain 1 % mit adrenalin \n 0,3 ml/kg (3 mg/kg) \n \n \n \n \n \n pitfalls \n \n  zu medial  = nähe zur a. femoralis und intravasale injektion. lateral bleiben. \n  keine vollständige analgesie  der hüfte (dorsale kapsel, n. obturatorius): ergänzend analgetikum anbieten. \n  quadrizepsschwäche:  patient darf nicht aufstehen; sturzgefahr bei umlagerung. \n \n  lagebild: proximale femurfraktur"},"femur-schaft":{"ch":3,"cht":"Regionalanästhesie in der Präklinik","t":"Lagebild: Femurschaftfraktur","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Lagebild<\/div>\n<ul>\n<li>Hochrasanztrauma, Sturz aus Höhe, Kinder; grobe Fehlstellung, Instabilität, Schwellung. <strong>Blutverlust bis 1–2 l<\/strong> pro Oberschenkel.<\/li>\n<li>Polytrauma geht vor: Block erst, wenn cABCDE stabil ist.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Verfahren<\/div>\n<ul>\n<li><strong>Femoralisblock<\/strong> unter Ultraschall: N. femoralis lateral der A. femoralis unter der Fascia iliaca, <strong>10–20 ml<\/strong> perineural, In-plane von lateral. Alternativ <strong>FICB<\/strong> (Landmarke) mit 30–40 ml.<\/li>\n<li>Erleichtert achsengerechte Lagerung, Zug und Schienung (Vakuumschiene, Traktionsschiene).<\/li>\n<li><strong>Kinder:<\/strong> FICB gut geeignet; Prilocain 1 % etwa 0,5 ml/kg (5 mg/kg), nicht bei Säuglingen &lt; 6 Monate.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li>Der Block behandelt den Schmerz, nicht den Volumenmangel: Schockzeichen ernst nehmen.<\/li>\n<li>pDMS vor und nach Reposition dokumentieren.<\/li>\n<\/ul>\n<\/div>","text":" \n lagebild \n \n hochrasanztrauma, sturz aus höhe, kinder; grobe fehlstellung, instabilität, schwellung.  blutverlust bis 1–2 l  pro oberschenkel. \n polytrauma geht vor: block erst, wenn cabcde stabil ist. \n \n \n \n verfahren \n \n  femoralisblock  unter ultraschall: n. femoralis lateral der a. femoralis unter der fascia iliaca,  10–20 ml  perineural, in-plane von lateral. alternativ  ficb  (landmarke) mit 30–40 ml. \n erleichtert achsengerechte lagerung, zug und schienung (vakuumschiene, traktionsschiene). \n  kinder:  ficb gut geeignet; prilocain 1 % etwa 0,5 ml/kg (5 mg/kg), nicht bei säuglingen < 6 monate. \n \n \n \n pitfalls \n \n der block behandelt den schmerz, nicht den volumenmangel: schockzeichen ernst nehmen. \n pdms vor und nach reposition dokumentieren. \n \n  lagebild: femurschaftfraktur"},"patella":{"ch":3,"cht":"Regionalanästhesie in der Präklinik","t":"Lagebild: Patellaluxation","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Lagebild<\/div>\n<ul>\n<li>Meist junger Patient, Drehbewegung beim Sport; Knie in Beugung fixiert, Patella <strong>lateral<\/strong> tastbar und sichtbar.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Verfahren<\/div>\n<ul>\n<li><strong>Meist kein Block nötig.<\/strong> Reposition gelingt oft ohne oder mit wenig Analgesie (Fentanyl i.n., Esketamin, Methoxyfluran).<\/li>\n<li>Femoralisblock (Ultraschall) nur bei starker Abwehrspannung oder misslungenem Versuch; er entspannt den Quadrizeps.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Technik<\/div>\n<ul>\n<li>Rückenlage, <strong>Hüfte beugen<\/strong> (entspannt den Quadrizeps), dann das <strong>Knie langsam strecken<\/strong> und gleichzeitig die Patella mit dem Daumen <strong>von lateral nach medial<\/strong> schieben. Reposition ist meist hör- und tastbar.<\/li>\n<li>Danach Knie in Streckung schienen; immer Klinik (Röntgen, osteochondrale Begleitfraktur).<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-neu\">\n<div class=\"box-label\">Evidenz &amp; Neu<\/div>\n<ul>\n<li><strong>New York State EMS (retrospektiv, n = 90):<\/strong> präklinische Reposition in 92 % erfolgreich, ohne Analgetika in 98 %, keine Komplikationen berichtet.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Knieluxation (tibiofemoral) ist ein anderes Krankheitsbild:<\/strong> Gefäßnotfall der A. poplitea, auch nach spontaner Reposition. pDMS, Gefäßchirurgie.<\/li>\n<li>Keine Reposition gegen Widerstand oder bei Verdacht auf Fraktur (direktes Anpralltrauma).<\/li>\n<\/ul>\n<\/div>","text":" \n lagebild \n \n meist junger patient, drehbewegung beim sport; knie in beugung fixiert, patella  lateral  tastbar und sichtbar. \n \n \n \n verfahren \n \n  meist kein block nötig.  reposition gelingt oft ohne oder mit wenig analgesie (fentanyl i.n., esketamin, methoxyfluran). \n femoralisblock (ultraschall) nur bei starker abwehrspannung oder misslungenem versuch; er entspannt den quadrizeps. \n \n \n \n technik \n \n rückenlage,  hüfte beugen  (entspannt den quadrizeps), dann das  knie langsam strecken  und gleichzeitig die patella mit dem daumen  von lateral nach medial  schieben. reposition ist meist hör- und tastbar. \n danach knie in streckung schienen; immer klinik (röntgen, osteochondrale begleitfraktur). \n \n \n \n evidenz & neu \n \n  new york state ems (retrospektiv, n = 90):  präklinische reposition in 92 % erfolgreich, ohne analgetika in 98 %, keine komplikationen berichtet. \n \n \n \n pitfalls \n \n  knieluxation (tibiofemoral) ist ein anderes krankheitsbild:  gefäßnotfall der a. poplitea, auch nach spontaner reposition. pdms, gefäßchirurgie. \n keine reposition gegen widerstand oder bei verdacht auf fraktur (direktes anpralltrauma). \n \n  lagebild: patellaluxation"},"osg":{"ch":3,"cht":"Regionalanästhesie in der Präklinik","t":"Lagebild: OSG-Fraktur und Luxationsfraktur","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Lagebild<\/div>\n<ul>\n<li>Umknick- oder Sturztrauma; grobe Fehlstellung, Haut über dem Innenknöchel gespannt und weiß, Fuß kühl oder pulslos.<\/li>\n<li><strong>Ziel:<\/strong> Fehlstellung mit Hautgefährdung oder Durchblutungsstörung <strong>zeitnah reponieren<\/strong>. Ohne Fehlstellung nur schienen und analgesieren.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Verfahren<\/div>\n<ul>\n<li><strong>Analgosedierung<\/strong> zur Reposition ist präklinisch Standard (Esketamin plus Propofol oder Midazolam, Kapitel 2).<\/li>\n<li><strong>Intraartikuläres Lidocain<\/strong> (OSG-Hämatomblock) als Alternative, besonders bei hohem Sedierungsrisiko (nicht nüchtern, Adipositas, Komorbidität): Gelenk anteromedial medial der Tibialis-anterior-Sehne punktieren, Hämarthros aspirieren, dann 10–15 ml Lidocain 1 % (Maximaldosis beachten), 10–15 min warten.<\/li>\n<li><strong>Poplitealer Ischiadikusblock<\/strong> (Ultraschall) nur mit Routine; der mediale Knöchel (N. saphenus) bleibt ausgespart.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Reposition<\/div>\n<ul>\n<li>Knie leicht beugen (entspannt den Gastrocnemius), mit einer Hand an der Ferse, der anderen am Fußrücken <strong>Längszug<\/strong>, dann den Fuß unter das Unterschenkelende zurückführen.<\/li>\n<li>Danach Vakuumschiene, pDMS vorher und nachher dokumentieren, Hautbefund fotografieren.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-neu\">\n<div class=\"box-label\">Evidenz &amp; Neu<\/div>\n<ul>\n<li><strong>White 2008 (RCT, n = 42):<\/strong> intraartikuläres Lidocain vs. Analgosedierung bei OSG-Luxationsfrakturen: gleiche Schmerzreduktion und gleiche Repositionsqualität. Einzige kleine, unverblindete Studie.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Kompartmentsyndrom am Unterschenkel:<\/strong> Hochrisikoregion; distale Leitungsblöcke zurückhaltend und dokumentiert.<\/li>\n<li><strong>Offene Luxationsfraktur:<\/strong> Foto, steril abdecken, Antibiose nach SOP; Reposition trotzdem, wenn die Haut oder die Durchblutung gefährdet ist.<\/li>\n<\/ul>\n<\/div>","text":" \n lagebild \n \n umknick- oder sturztrauma; grobe fehlstellung, haut über dem innenknöchel gespannt und weiß, fuß kühl oder pulslos. \n  ziel:  fehlstellung mit hautgefährdung oder durchblutungsstörung  zeitnah reponieren . ohne fehlstellung nur schienen und analgesieren. \n \n \n \n verfahren \n \n  analgosedierung  zur reposition ist präklinisch standard (esketamin plus propofol oder midazolam, kapitel 2). \n  intraartikuläres lidocain  (osg-hämatomblock) als alternative, besonders bei hohem sedierungsrisiko (nicht nüchtern, adipositas, komorbidität): gelenk anteromedial medial der tibialis-anterior-sehne punktieren, hämarthros aspirieren, dann 10–15 ml lidocain 1 % (maximaldosis beachten), 10–15 min warten. \n  poplitealer ischiadikusblock  (ultraschall) nur mit routine; der mediale knöchel (n. saphenus) bleibt ausgespart. \n \n \n \n reposition \n \n knie leicht beugen (entspannt den gastrocnemius), mit einer hand an der ferse, der anderen am fußrücken  längszug , dann den fuß unter das unterschenkelende zurückführen. \n danach vakuumschiene, pdms vorher und nachher dokumentieren, hautbefund fotografieren. \n \n \n \n evidenz & neu \n \n  white 2008 (rct, n = 42):  intraartikuläres lidocain vs. analgosedierung bei osg-luxationsfrakturen: gleiche schmerzreduktion und gleiche repositionsqualität. einzige kleine, unverblindete studie. \n \n \n \n pitfalls \n \n  kompartmentsyndrom am unterschenkel:  hochrisikoregion; distale leitungsblöcke zurückhaltend und dokumentiert. \n  offene luxationsfraktur:  foto, steril abdecken, antibiose nach sop; reposition trotzdem, wenn die haut oder die durchblutung gefährdet ist. \n \n  lagebild: osg-fraktur und luxationsfraktur"},"schulter":{"ch":3,"cht":"Regionalanästhesie in der Präklinik","t":"Lagebild: Schulterluxation","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Lagebild<\/div>\n<ul>\n<li>Meist vordere Luxation: Arm in Abduktion und Außenrotation federnd fixiert, leere Pfanne, Epaulettenphänomen.<\/li>\n<li><strong>pDMS vorher:<\/strong> N. axillaris (Sensibilität lateraler Oberarm), Radialispuls.<\/li>\n<li><strong>Präklinisch reponieren<\/strong> nur mit Erfahrung, bei langem Transport und wenn eine Fraktur unwahrscheinlich ist (jung, Rezidivluxation, kein Hochrasanztrauma). Erstluxation ab etwa 40 J oder Hochrasanz: eher schienen und transportieren.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Verfahren<\/div>\n<ul>\n<li><strong>Intraartikuläres Lidocain:<\/strong> Gelenk lateral unter dem Akromion in der tastbaren Mulde punktieren, <strong>20 ml Lidocain 1 %<\/strong> (Maximaldosis beachten), 10–15 min warten.<\/li>\n<li><strong>Techniken ohne Medikamente<\/strong> gelingen oft: Cunningham, FARES, langsame Außenrotation im Liegen.<\/li>\n<li><strong>Analgosedierung<\/strong> als Alternative. Kein interskalenärer Block präklinisch (Phrenikusparese, Pneumothorax, Gefäßnähe).<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-neu\">\n<div class=\"box-label\">Evidenz &amp; Neu<\/div>\n<ul>\n<li><strong>Metaanalyse 2022 (12 RCTs, n = 630):<\/strong> intraartikuläres Lidocain gleich erfolgreich wie i.v.-Sedierung, deutlich weniger Nebenwirkungen (RR 0,16, NNT 6) und rund 1,5 h kürzerer Aufenthalt; die Zufriedenheit der Patienten war geringer.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Hintere Schulterluxation<\/strong> (nach Krampfanfall oder Stromunfall) wird oft übersehen: Arm in Innenrotation fixiert.<\/li>\n<li><strong>Luxationsfraktur<\/strong> nicht präklinisch reponieren.<\/li>\n<\/ul>\n<\/div>","text":" \n lagebild \n \n meist vordere luxation: arm in abduktion und außenrotation federnd fixiert, leere pfanne, epaulettenphänomen. \n  pdms vorher:  n. axillaris (sensibilität lateraler oberarm), radialispuls. \n  präklinisch reponieren  nur mit erfahrung, bei langem transport und wenn eine fraktur unwahrscheinlich ist (jung, rezidivluxation, kein hochrasanztrauma). erstluxation ab etwa 40 j oder hochrasanz: eher schienen und transportieren. \n \n \n \n verfahren \n \n  intraartikuläres lidocain:  gelenk lateral unter dem akromion in der tastbaren mulde punktieren,  20 ml lidocain 1 %  (maximaldosis beachten), 10–15 min warten. \n  techniken ohne medikamente  gelingen oft: cunningham, fares, langsame außenrotation im liegen. \n  analgosedierung  als alternative. kein interskalenärer block präklinisch (phrenikusparese, pneumothorax, gefäßnähe). \n \n \n \n evidenz & neu \n \n  metaanalyse 2022 (12 rcts, n = 630):  intraartikuläres lidocain gleich erfolgreich wie i.v.-sedierung, deutlich weniger nebenwirkungen (rr 0,16, nnt 6) und rund 1,5 h kürzerer aufenthalt; die zufriedenheit der patienten war geringer. \n \n \n \n pit
