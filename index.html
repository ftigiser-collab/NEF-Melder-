ytoin \n 20 mg/kg i.v., max. 50 mg/min, mit monitor \n \n \n \n \n \n pitfalls \n \n  unterdosierung der benzodiazepine  ist der häufigste fehler; in einer großen us-rettungsdienst-serie erhielt kaum jemand die vollen 10 mg midazolam, und höhere dosen bedeuteten weniger folgetherapie. mehr als zwei benzodiazepin-gaben erhöhen vor allem die atemdepression, nicht die wirkung; dann zweite stufe. \n  midazolam i.m.  ist bei fehlendem zugang schneller wirksam als der versuch, einen zugang beim krampfenden patienten zu legen (rampart). \n  valproat  nicht bei schwangerschaft, leberschaden, mitochondriopathie, kindern < 2 j. \n  nicht wach nach anfallsende  (> 20–30 min): nicht-konvulsiver status, intoxikation, sht, blutung bedenken. \n  psychogener nicht-epileptischer anfall:  geschlossene augen mit widerstand, seit-zu-seit-kopfbewegung, beckenbewegungen, wechselnder verlauf, lange dauer. keine eskalation bis zur narkose ohne klares bild. \n  anfall in der schwangerschaft ab 20. ssw oder im wochenbett  ist eine eklampsie, bis das gegenteil bewiesen ist: magnesium (kapitel 13). \n  alkoholiker:  thiamin 100 mg i.v., glukose nicht verzögern. \n \n  krampfanfall und status epilepticus"},"bewusst":{"ch":6,"cht":"Neurologie","t":"Bewusstseinsstörung unklarer Ursache","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Strukturiert:<\/strong> Atemweg und Atmung sichern, dann BZ, Temperatur, Pupillen, Meningismus, Einstichstellen, Geruch, Medikamentenschachteln, Verletzungszeichen, EKG.<\/li>\n<li><strong>Merkhilfe AEIOU-TIPS:<\/strong> Alkohol, Epilepsie/Elektrolyte/Enzephalopathie, Insulin, Opioide/Overdose, Urämie; Trauma/Temperatur, Infektion, Psychiatrie/Poison, Shock/Stroke/SAB.<\/li>\n<li><strong>Naloxon diagnostisch<\/strong> titriert bei Opioid-Toxidrom (Kapitel 8).<\/li>\n<li><strong>GCS ≤ 8 ist kein Automatismus für Intubation<\/strong>, wenn Atemwegsreflexe erhalten sind und die Ursache rasch reversibel ist (Intoxikation, postiktal, Hypoglykämie). Entscheidend sind Atemweg, Aspirationsgefahr und Transportdauer.<\/li>\n<\/ul>\n<\/div>\n<table>\n<thead>\n<tr>\n<th>Glasgow Coma Scale<\/th>\n<th>Punkte<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Augen öffnen:<\/strong> spontan / auf Ansprache / auf Schmerz / nicht<\/td>\n<td>4 / 3 / 2 / 1<\/td>\n<\/tr>\n<tr>\n<td><strong>Verbal:<\/strong> orientiert / verwirrt / inadäquate Wörter / unverständliche Laute / keine<\/td>\n<td>5 / 4 / 3 / 2 / 1<\/td>\n<\/tr>\n<tr>\n<td><strong>Motorik:<\/strong> befolgt Aufforderungen / gezielte Abwehr / ungezielte Abwehr, Rückzug / Beugesynergismen / Strecksynergismen / keine<\/td>\n<td>6 / 5 / 4 / 3 / 2 / 1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":" \n vorgehen \n \n  strukturiert:  atemweg und atmung sichern, dann bz, temperatur, pupillen, meningismus, einstichstellen, geruch, medikamentenschachteln, verletzungszeichen, ekg. \n  merkhilfe aeiou-tips:  alkohol, epilepsie/elektrolyte/enzephalopathie, insulin, opioide/overdose, urämie; trauma/temperatur, infektion, psychiatrie/poison, shock/stroke/sab. \n  naloxon diagnostisch  titriert bei opioid-toxidrom (kapitel 8). \n  gcs ≤ 8 ist kein automatismus für intubation , wenn atemwegsreflexe erhalten sind und die ursache rasch reversibel ist (intoxikation, postiktal, hypoglykämie). entscheidend sind atemweg, aspirationsgefahr und transportdauer. \n \n \n \n \n \n glasgow coma scale \n punkte \n \n \n \n \n  augen öffnen:  spontan / auf ansprache / auf schmerz / nicht \n 4 / 3 / 2 / 1 \n \n \n  verbal:  orientiert / verwirrt / inadäquate wörter / unverständliche laute / keine \n 5 / 4 / 3 / 2 / 1 \n \n \n  motorik:  befolgt aufforderungen / gezielte abwehr / ungezielte abwehr, rückzug / beugesynergismen / strecksynergismen / keine \n 6 / 5 / 4 / 3 / 2 / 1 \n \n \n  bewusstseinsstörung unklarer ursache"},"hypo":{"ch":7,"cht":"Stoffwechsel und Sepsis","t":"Hypoglykämie","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Behandlungsbedürftig<\/strong> bei BZ &lt; 70 mg/dl (3,9 mmol/l) mit Symptomen, immer bei &lt; 54 mg/dl (3,0 mmol/l).<\/li>\n<li><strong>Wach, schluckfähig:<\/strong> 15–20 g Glukose oral (Gel, Saft, Traubenzucker).<\/li>\n<li><strong>Bewusstseinsgestört:<\/strong> Glukose i.v., Kontrolle nach 10–15 min, Ziel BZ &gt; 100 mg/dl.<\/li>\n<li><strong>Kein Zugang:<\/strong> Glukagon 1 mg i.m. oder s.c. (Kinder &lt; 25 kg 0,5 mg) oder nasal 3 mg (ab 1 Jahr zugelassen).<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-neu\">\n<div class=\"box-label\">Evidenz &amp; Neu<\/div>\n<ul>\n<li><strong>Glukose 10 % statt 50 %<\/strong> (Moore, EMJ 2005): gleiche Zeit bis zum Erwachen (8 min), aber nur 10 statt 25 g Glukose und kein überschießender BZ. Titrieren in 5–10-g-Schritten ist ausreichend.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-dosis\">\n<div class=\"box-label\">Medikamente &amp; Dosis<\/div>\n<table>\n<thead>\n<tr>\n<th>Substanz<\/th>\n<th>Dosis<\/th>\n<th>Bemerkung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Glukose 10 %<\/td>\n<td>100–250 ml i.v. (10–25 g), in 100-ml-Schritten<\/td>\n<td>bevorzugt: weniger Überschießen, venenschonend<\/td>\n<\/tr>\n<tr>\n<td>Glukose 40 %<\/td>\n<td>20–40 ml (8–16 g)<\/td>\n<td>nur über sicher laufenden, großen Zugang, nachspülen<\/td>\n<\/tr>\n<tr>\n<td>Glukagon<\/td>\n<td>1 mg i.m./s.c., nasal 3 mg<\/td>\n<td>wirkungslos bei leeren Glykogenspeichern (Alkohol, Mangelernährung)<\/td>\n<\/tr>\n<tr>\n<td>Thiamin<\/td>\n<td>100 mg i.v.<\/td>\n<td>bei Alkoholabusus, Mangelernährung; Glukose nicht verzögern<\/td>\n<\/tr>\n<tr>\n<td>Kinder<\/td>\n<td>Glukose 10 % 2 ml/kg (0,2 g/kg)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Belassen vor Ort vertretbar, wenn alle Punkte erfüllt sind<\/div>\n<ul>\n<li>Typ-1- oder insulinbehandelter Typ-2-Diabetes, Ursache klar (Mahlzeit vergessen, Sport, Fehldosierung kurzwirksamen Insulins).<\/li>\n<li>Vollständig wach und orientiert, isst kohlenhydrathaltig nach, Begleitperson für die nächsten Stunden.<\/li>\n<li>Kein Sulfonylharnstoff, keine Überdosis langwirksamen Insulins, keine Absicht, keine Niereninsuffizienz, kein Alkohol, keine Wiederholung binnen 24 h.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Sulfonylharnstoffe<\/strong> (Glibenclamid, Glimepirid): rezidivierende Hypoglykämien über Tage, besonders bei Niereninsuffizienz. Immer Transport, Überwachung ≥ 24 h, in der Klinik Octreotid. Glukagon nur als Brücke (setzt zusätzlich Insulin frei).<\/li>\n<li><strong>Suizidale Insulin-Überdosis:<\/strong> massive, protrahierte Hypoglykämie, Kaliumabfall.<\/li>\n<li><strong>Hypoglykämie als Fehlalarm:<\/strong> Kapillär-BZ bei Zentralisation unzuverlässig; im Zweifel venös messen.<\/li>\n<li><strong>Neurologisches Defizit bei Hypoglykämie<\/strong> bildet sich oft erst nach 30–60 min zurück.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  behandlungsbedürftig  bei bz < 70 mg/dl (3,9 mmol/l) mit symptomen, immer bei < 54 mg/dl (3,0 mmol/l). \n  wach, schluckfähig:  15–20 g glukose oral (gel, saft, traubenzucker). \n  bewusstseinsgestört:  glukose i.v., kontrolle nach 10–15 min, ziel bz > 100 mg/dl. \n  kein zugang:  glukagon 1 mg i.m. oder s.c. (kinder < 25 kg 0,5 mg) oder nasal 3 mg (ab 1 jahr zugelassen). \n \n \n \n evidenz & neu \n \n  glukose 10 % statt 50 %  (moore, emj 2005): gleiche zeit bis zum erwachen (8 min), aber nur 10 statt 25 g glukose und kein überschießender bz. titrieren in 5–10-g-schritten ist ausreichend. \n \n \n \n medikamente & dosis \n \n \n \n substanz \n dosis \n bemerkung \n \n \n \n \n glukose 10 % \n 100–250 ml i.v. (10–25 g), in 100-ml-schritten \n bevorzugt: weniger überschießen, venenschonend \n \n \n glukose 40 % \n 20–40 ml (8–16 g) \n nur über sicher laufenden, großen zugang, nachspülen \n \n \n glukagon \n 1 mg i.m./s.c., nasal 3 mg \n wirkungslos bei leeren glykogenspeichern (alkohol, mangelernährung) \n \n \n thiamin \n 100 mg i.v. \n bei alkoholabusus, mangelernährung; glukose nicht verzögern \n \n \n kinder \n glukose 10 % 2 ml/kg (0,2 g/kg) \n  \n \n \n \n \n \n belassen vor ort vertretbar, wenn alle punkte erfüllt sind \n \n typ-1- oder insulinbehandelter typ-2-diabetes, ursache klar (mahlzeit vergessen, sport, fehldosierung kurzwirksamen insulins). \n vollständig wach und orientiert, isst kohlenhydrathaltig nach, begleitperson für die nächsten stunden. \n kein sulfonylharnstoff, keine überdosis langwirksamen insulins, keine absicht, keine niereninsuffizienz, kein alkohol, keine wiederholung binnen 24 h. \n \n \n \n pitfalls \n \n  sulfonylharnstoffe  (glibenclamid, glimepirid): rezidivierende hypoglykämien über tage, besonders bei niereninsuffizienz. immer transport, überwachung ≥ 24 h, in der klinik octreotid. glukagon nur als brücke (setzt zusätzlich insulin frei). \n  suizidale insulin-überdosis:  massive, protrahierte hypoglykämie, kaliumabfall. \n  hypoglykämie als fehlalarm:  kapillär-bz bei zentralisation unzuverlässig; im zweifel venös messen. \n  neurologisches defizit bei hypoglykämie  bildet sich oft erst nach 30–60 min zurück. \n \n  hypoglykämie"},"hyper":{"ch":7,"cht":"Stoffwechsel und Sepsis","t":"Hyperglykämische Entgleisung","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>DKA:<\/strong> Kussmaul-Atmung, Azetongeruch, Bauchschmerz (Pseudoperitonitis), Exsikkose. <strong>HHS:<\/strong> älterer Typ-2-Diabetiker, extreme Exsikkose, BZ oft &gt; 600 mg/dl, Bewusstseinsstörung.<\/li>\n<li><strong>Präklinisch:<\/strong> balancierte Vollelektrolytlösung 500–1000 ml/h beim Erwachsenen, bei Älteren, Herz- oder Niereninsuffizienz in 250-ml-Boli; Kinder 10–20 ml/kg über 20–30 min, im Schock 10–20 ml/kg rasch und nach Klinik wiederholen. <strong>Kein Insulin<\/strong> (erst ab K⁺ ≥ 3,5 mmol/l), kein Bikarbonat.<\/li>\n<li>EKG auf Hyper- oder Hypokaliämie ansehen.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Euglykäme DKA unter SGLT2-Hemmern<\/strong> (Gliflozine): BZ nur mäßig erhöht, schwere Azidose. Bei Kussmaul-Atmung trotz „gutem\" BZ daran denken.<\/li>\n<li><strong>Intubation bei DKA:<\/strong> hohes Atemminutenvolumen nach Intubation zwingend weiterführen (Kapitel 2).<\/li>\n<li><strong>Kinder mit DKA:<\/strong> Hirnödemgefahr. Volumen zurückhaltend, keine Bikarbonatgabe.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  dka:  kussmaul-atmung, azetongeruch, bauchschmerz (pseudoperitonitis), exsikkose.  hhs:  älterer typ-2-diabetiker, extreme exsikkose, bz oft > 600 mg/dl, bewusstseinsstörung. \n  präklinisch:  balancierte vollelektrolytlösung 500–1000 ml/h beim erwachsenen, bei älteren, herz- oder niereninsuffizienz in 250-ml-boli; kinder 10–20 ml/kg über 20–30 min, im schock 10–20 ml/kg rasch und nach klinik wiederholen.  kein insulin  (erst ab k⁺ ≥ 3,5 mmol/l), kein bikarbonat. \n ekg auf hyper- oder hypokaliämie ansehen. \n \n \n \n pitfalls \n \n  euglykäme dka unter sglt2-hemmern  (gliflozine): bz nur mäßig erhöht, schwere azidose. bei kussmaul-atmung trotz „gutem\" bz daran denken. \n  intubation bei dka:  hohes atemminutenvolumen nach intubation zwingend weiterführen (kapitel 2). \n  kinder mit dka:  hirnödemgefahr. volumen zurückhaltend, keine bikarbonatgabe. \n \n  hyperglykämische entgleisung"},"sepsis":{"ch":7,"cht":"Stoffwechsel und Sepsis","t":"Sepsis und septischer Schock","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Erkennen:<\/strong> Infektverdacht plus Organdysfunktion (Bewusstseinsänderung, Tachypnoe, Hypotonie, Oligurie, Hautmarmorierung, verlängerte Rekapillarisierung).<\/li>\n<li><strong>Screening:<\/strong> NEWS2 ≥ 5 ist ein Warnsignal, ≥ 7 hohes Risiko. qSOFA (AF ≥ 22/min, RR sys ≤ 100 mmHg, Bewusstseinsänderung; ≥ 2 Punkte = hohes Risiko) <strong>nicht als alleiniges Screening<\/strong> verwenden (zu wenig sensitiv).<\/li>\n<li><strong>Schockindex<\/strong> (HF/RR sys) &gt; 1 ist ein einfaches Warnzeichen.<\/li>\n<li><strong>Laktat<\/strong> (POCT, falls vorhanden): &gt; 2 mmol/l auffällig, ≥ 4 mmol/l hohes Risiko.<\/li>\n<li><strong>Volumen:<\/strong> balancierte Kristalloide, bei Hypotonie oder Laktat ≥ 4 mmol/l bis 30 ml/kg in den ersten 3 h; präklinisch 500–1000 ml als Bolus und neu bewerten.<\/li>\n<li><strong>Noradrenalin<\/strong> bei Hypotonie trotz Volumen, Ziel MAP ≥ 65 mmHg (SSC 2026: bei ≥ 65 J auch 60–65 mmHg). Peripher über gut laufenden Zugang erlaubt.<\/li>\n<li><strong>Zielklinik voranmelden<\/strong> („Sepsis-Verdacht\"), Fokus nennen.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Präklinische Antibiotikagabe<\/div>\n<ul>\n<li><strong>Ja, sofort:<\/strong> Verdacht auf <strong>Meningokokken-Sepsis oder bakterielle Meningitis<\/strong> (Fieber plus Petechien oder Purpura, Meningismus mit Bewusstseinsstörung).<\/li>\n<li><strong>Erwägen:<\/strong> septischer Schock und <strong>&gt; 60 min bis zur Klinikversorgung<\/strong> (SSC 2026, neue schwache Empfehlung), neutropenisches Fieber.<\/li>\n<li><strong>Vorher Blutkulturen<\/strong>, wenn ohne Verzögerung möglich: Nach präklinischer Antibiose sinkt die Rate positiver Kulturen etwa auf die Hälfte.<\/li>\n<li><strong>Sonst:<\/strong> Fokus der Klinik überlassen; die Zeitvorgabe von 1 h bei Schock gilt ab Erstkontakt, deshalb zügig transportieren.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-neu\">\n<div class=\"box-label\">Evidenz &amp; Neu<\/div>\n<ul>\n<li><strong>S3-Leitlinie Sepsis (AWMF 2025):<\/strong> Screening-Instrument nutzen (qSOFA, NEWS2, SIRS), Laktat und Rekapillarisierungszeit, balancierte Kristalloide, MAP 65 mmHg, Noradrenalin auch peripher. Zur Präklinik keine eigene Empfehlung.<\/li>\n<li><strong>Surviving Sepsis Campaign 2026:<\/strong> NEWS/NEWS2, MEWS oder SIRS statt qSOFA als alleinigem Screening; präklinische Antibiose nur bei Schock und langer Transportzeit; 30 ml/kg als Orientierung, balanciert statt NaCl 0,9 %.<\/li>\n<li><strong>PHANTASi (2018):<\/strong> Antibiose im Rettungswagen (Ceftriaxon 2 g, im Mittel 96 min früher) senkte die Mortalität nicht (8 vs. 8 %).<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-dosis\">\n<div class=\"box-label\">Medikamente &amp; Dosis<\/div>\n<table>\n<thead>\n<tr>\n<th>Situation<\/th>\n<th>Substanz<\/th>\n<th>Dosis<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Meningokokken, Meningitis<\/td>\n<td>Ceftriaxon<\/td>\n<td>2 g i.v. (Kinder 100 mg/kg, max. 4 g)<\/td>\n<\/tr>\n<tr>\n<td>Meningitis (adjuvant)<\/td>\n<td>Dexamethason<\/td>\n<td>10 mg i.v. vor oder mit der ersten Antibiose (Kinder 0,15 mg/kg)<\/td>\n<\/tr>\n<tr>\n<td>Septischer Schock<\/td>\n<td>Noradrenalin<\/td>\n<td>0,05–0,5 µg/kg/min, Ziel MAP ≥ 65 mmHg<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Ältere Patienten:<\/strong> afebril oder hypotherm, nur Verwirrtheit oder Sturz. Betablocker maskieren die Tachykardie.<\/li>\n<li><strong>Nekrotisierende Fasziitis:<\/strong> Schmerz außer Verhältnis zum Befund, rasche Progredienz. Direkt in eine Klinik mit chirurgischer Versorgung.<\/li>\n<li><strong>Meningokokken:<\/strong> Tröpfchenschutz (Maske). Chemoprophylaxie für Personal nur bei engem ungeschütztem Kontakt mit Atemwegssekret (Mund-zu-Mund, Intubation, Absaugen ohne Maske).<\/li>\n<li><strong>Volumen bei Dialysepatienten und Herzinsuffizienz<\/strong> in 250-ml-Schritten mit Re-Evaluation (Lungenauskultation, POCUS).<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  erkennen:  infektverdacht plus organdysfunktion (bewusstseinsänderung, tachypnoe, hypotonie, oligurie, hautmarmorierung, verlängerte rekapillarisierung). \n  screening:  news2 ≥ 5 ist ein warnsignal, ≥ 7 hohes risiko. qsofa (af ≥ 22/min, rr sys ≤ 100 mmhg, bewusstseinsänderung; ≥ 2 punkte = hohes risiko)  nicht als alleiniges screening  verwenden (zu wenig sensitiv). \n  schockindex  (hf/rr sys) > 1 ist ein einfaches warnzeichen. \n  laktat  (poct, falls vorhanden): > 2 mmol/l auffällig, ≥ 4 mmol/l hohes risiko. \n  volumen:  balancierte kristalloide, bei hypotonie oder laktat ≥ 4 mmol/l bis 30 ml/kg in den ersten 3 h; präklinisch 500–1000 ml als bolus und neu bewerten. \n  noradrenalin  bei hypotonie trotz volumen, ziel map ≥ 65 mmhg (ssc 2026: bei ≥ 65 j auch 60–65 mmhg). peripher über gut laufenden zugang erlaubt. \n  zielklinik voranmelden  („sepsis-verdacht\"), fokus nennen. \n \n \n \n präklinische antibiotikagabe \n \n  ja, sofort:  verdacht auf  meningokokken-sepsis oder bakterielle meningitis  (fieber plus petechien oder purpura, meningismus mit bewusstseinsstörung). \n  erwägen:  septischer schock und  > 60 min bis zur klinikversorgung  (ssc 2026, neue schwache empfehlung), neutropenisches fieber. \n  vorher blutkulturen , wenn ohne verzögerung möglich: nach präklinischer antibiose sinkt die rate positiver kulturen etwa auf die hälfte. \n  sonst:  fokus der klinik überlassen; die zeitvorgabe von 1 h bei schock gilt ab erstkontakt, deshalb zügig transportieren. \n \n \n \n evidenz & neu \n \n  s3-leitlinie sepsis (awmf 2025):  screening-instrument nutzen (qsofa, news2, sirs), laktat und rekapillarisierungszeit, balancierte kristalloide, map 65 mmhg, noradrenalin auch peripher. zur präklinik keine eigene empfehlung. \n  surviving sepsis campaign 2026:  news/news2, mews oder sirs statt qsofa als alleinigem screening; präklinische antibiose nur bei schock und langer transportzeit; 30 ml/kg als orientierung, balanciert statt nacl 0,9 %. \n  phantasi (2018):  antibiose im rettungswagen (ceftriaxon 2 g, im mittel 96 min früher) senkte die mortalität nicht (8 vs. 8 %). \n \n \n \n medikamente & dosis \n \n \n \n situation \n substanz \n dosis \n \n \n \n \n meningokokken, meningitis \n ceftriaxon \n 2 g i.v. (kinder 100 mg/kg, max. 4 g) \n \n \n meningitis (adjuvant) \n dexamethason \n 10 mg i.v. vor oder mit der ersten antibiose (kinder 0,15 mg/kg) \n \n \n septischer schock \n noradrenalin \n 0,05–0,5 µg/kg/min, ziel map ≥ 65 mmhg \n \n \n \n \n \n pitfalls \n \n  ältere patienten:  afebril oder hypotherm, nur verwirrtheit oder sturz. betablocker maskieren die tachykardie. \n  nekrotisierende fasziitis:  schmerz außer verhältnis zum befund, rasche progredienz. direkt in eine klinik mit chirurgischer versorgung. \n  meningokokken:  tröpfchenschutz (maske). chemoprophylaxie für personal nur bei engem ungeschütztem kontakt mit atemwegssekret (mund-zu-mund, intubation, absaugen ohne maske). \n  volumen bei dialysepatienten und herzinsuffizienz  in 250-ml-schritten mit re-evaluation (lungenauskultation, pocus). \n \n  sepsis und septischer schock"},"hyperk":{"ch":7,"cht":"Stoffwechsel und Sepsis","t":"Hyperkaliämie","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Verdacht:<\/strong> Dialysepatient (verpasste Dialyse), Niereninsuffizienz mit ACE-Hemmer, Sartan, Spironolacton, Rhabdomyolyse, Crush, Bradykardie unklarer Ursache.<\/li>\n<li><strong>EKG:<\/strong> hohe, spitze T-Wellen, PQ-Verlängerung, P-Verlust, QRS-Verbreiterung, Sinuswelle, Bradykardie, Asystolie.<\/li>\n<li><strong>Membranstabilisierung bei EKG-Veränderungen:<\/strong> Kalziumglukonat 10 % 30 ml oder Kalziumchlorid 10 % 10 ml i.v. über 5–10 min, wiederholbar.<\/li>\n<li><strong>Shift:<\/strong> Insulin 10 IE plus 25 g Glukose i.v. (z. B. 250 ml Glukose 10 % über 15 min), Salbutamol 10–20 mg vernebelt als Ergänzung, Natriumbikarbonat 50 mmol nur bei schwerer Azidose oder im Kreislaufstillstand.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Kalzium bei Digitalis-Intoxikation<\/strong> nur vorsichtig, langsam.<\/li>\n<li><strong>Hypoglykämie<\/strong> nach Insulin-Glukose-Gabe (bis 6 h): BZ kontrollieren, Glukose-Infusion weiterlaufen lassen.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  verdacht:  dialysepatient (verpasste dialyse), niereninsuffizienz mit ace-hemmer, sartan, spironolacton, rhabdomyolyse, crush, bradykardie unklarer ursache. \n  ekg:  hohe, spitze t-wellen, pq-verlängerung, p-verlust, qrs-verbreiterung, sinuswelle, bradykardie, asystolie. \n  membranstabilisierung bei ekg-veränderungen:  kalziumglukonat 10 % 30 ml oder kalziumchlorid 10 % 10 ml i.v. über 5–10 min, wiederholbar. \n  shift:  insulin 10 ie plus 25 g glukose i.v. (z. b. 250 ml glukose 10 % über 15 min), salbutamol 10–20 mg vernebelt als ergänzung, natriumbikarbonat 50 mmol nur bei schwerer azidose oder im kreislaufstillstand. \n \n \n \n pitfalls \n \n  kalzium bei digitalis-intoxikation  nur vorsichtig, langsam. \n  hypoglykämie  nach insulin-glukose-gabe (bis 6 h): bz kontrollieren, glukose-infusion weiterlaufen lassen. \n \n  hyperkaliämie"},"intox-grund":{"ch":8,"cht":"Intoxikationen","t":"Grundsätze","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Eigenschutz:<\/strong> CO, Kohlendioxid in Gärkellern, Schwefelwasserstoff, Reizgase, Suizid mit Chemikalien im Auto. CO-Warner am Notfallrucksack.<\/li>\n<li><strong>Asservieren:<\/strong> Packungen, Blister, Spritzen, Erbrochenes, Abschiedsbrief. Uhrzeit der Einnahme, Menge, Mischkonsum.<\/li>\n<li><strong>Giftinformationszentrum<\/strong> früh anrufen: für Rheinland-Pfalz, Hessen und Saarland <strong>GIZ Mainz, 06131 19240<\/strong>.<\/li>\n<li><strong>Basisdiagnostik:<\/strong> BZ, Temperatur, Pupillen, Haut (trocken/nass), Darmgeräusche, <strong>12-Kanal-EKG<\/strong> (QRS, QTc, Rhythmus).<\/li>\n<li><strong>Toxidrom erkennen<\/strong>, dann gezielt behandeln; meist reicht konsequente Basistherapie.<\/li>\n<\/ul>\n<\/div>\n<table>\n<thead>\n<tr>\n<th>Toxidrom<\/th>\n<th>Zeichen<\/th>\n<th>Typische Auslöser<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Opioid<\/td>\n<td>Miosis, Bradypnoe, Koma<\/td>\n<td>Heroin, Fentanyl, Nitazene, Methadon<\/td>\n<\/tr>\n<tr>\n<td>Sympathomimetisch<\/td>\n<td>Mydriasis, Tachykardie, Hypertonie, Hyperthermie, nass<\/td>\n<td>Kokain, Amphetamine, Cathinone, MDMA<\/td>\n<\/tr>\n<tr>\n<td>Anticholinerg<\/td>\n<td>Mydriasis, trocken, rot, heiß, Delir, Harnverhalt<\/td>\n<td>Antihistaminika, Trizyklika, Tollkirsche, Engelstrompete<\/td>\n<\/tr>\n<tr>\n<td>Cholinerg<\/td>\n<td>Miosis, Speichel, Bronchorrhö, Bradykardie, Faszikulationen<\/td>\n<td>Organophosphate, Carbamate<\/td>\n<\/tr>\n<tr>\n<td>Sedativ-hypnotisch<\/td>\n<td>Koma, Atemdepression, normale Pupillen<\/td>\n<td>Benzodiazepine, Z-Substanzen, GHB, Alkohol<\/td>\n<\/tr>\n<tr>\n<td>Serotonerg<\/td>\n<td>Klonus, Hyperreflexie, Hyperthermie, Agitation<\/td>\n<td>SSRI, MDMA, Tramadol, Linezolid, Kombinationen<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Mischintoxikation<\/strong> ist die Regel. Ein Antidot behandelt nur eine Komponente.<\/li>\n<li><strong>Verdeckte Verletzung:<\/strong> SHT beim Betrunkenen, Kompartmentsyndrom und Rhabdomyolyse nach langem Liegen, Hypothermie.<\/li>\n<li><strong>Primäre Giftentfernung<\/strong> präklinisch kaum noch: Aktivkohle (1 g/kg) nur innerhalb 1 h, bei adsorbierbarer, gefährlicher Substanz und geschütztem Atemweg; kein Erbrechen auslösen.<\/li>\n<li><strong>Kinder:<\/strong> Einzelne Tabletten können tödlich sein (Kalziumantagonisten, Sulfonylharnstoffe, Trizyklika, Opioide, Clonidin). Immer Klinik.<\/li>\n<li><strong>Knopfbatterie verschluckt:<\/strong> endoskopische Entfernung innerhalb von 2 h anstreben; Kinder &gt; 1 J bis zur Klinik Honig 10 ml alle 10 min (max. 6 Gaben), wenn die Einnahme &lt; 12 h zurückliegt.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  eigenschutz:  co, kohlendioxid in gärkellern, schwefelwasserstoff, reizgase, suizid mit chemikalien im auto. co-warner am notfallrucksack. \n  asservieren:  packungen, blister, spritzen, erbrochenes, abschiedsbrief. uhrzeit der einnahme, menge, mischkonsum. \n  giftinformationszentrum  früh anrufen: für rheinland-pfalz, hessen und saarland  giz mainz, 06131 19240 . \n  basisdiagnostik:  bz, temperatur, pupillen, haut (trocken/nass), darmgeräusche,  12-kanal-ekg  (qrs, qtc, rhythmus). \n  toxidrom erkennen , dann gezielt behandeln; meist reicht konsequente basistherapie. \n \n \n \n \n \n toxidrom \n zeichen \n typische auslöser \n \n \n \n \n opioid \n miosis, bradypnoe, koma \n heroin, fentanyl, nitazene, methadon \n \n \n sympathomimetisch \n mydriasis, tachykardie, hypertonie, hyperthermie, nass \n kokain, amphetamine, cathinone, mdma \n \n \n anticholinerg \n mydriasis, trocken, rot, heiß, delir, harnverhalt \n antihistaminika, trizyklika, tollkirsche, engelstrompete \n \n \n cholinerg \n miosis, speichel, bronchorrhö, bradykardie, faszikulationen \n organophosphate, carbamate \n \n \n sedativ-hypnotisch \n koma, atemdepression, normale pupillen \n benzodiazepine, z-substanzen, ghb, alkohol \n \n \n serotonerg \n klonus, hyperreflexie, hyperthermie, agitation \n ssri, mdma, tramadol, linezolid, kombinationen \n \n \n \n \n pitfalls \n \n  mischintoxikation  ist die regel. ein antidot behandelt nur eine komponente. \n  verdeckte verletzung:  sht beim betrunkenen, kompartmentsyndrom und rhabdomyolyse nach langem liegen, hypothermie. \n  primäre giftentfernung  präklinisch kaum noch: aktivkohle (1 g/kg) nur innerhalb 1 h, bei adsorbierbarer, gefährlicher substanz und geschütztem atemweg; kein erbrechen auslösen. \n  kinder:  einzelne tabletten können tödlich sein (kalziumantagonisten, sulfonylharnstoffe, trizyklika, opioide, clonidin). immer klinik. \n  knopfbatterie verschluckt:  endoskopische entfernung innerhalb von 2 h anstreben; kinder > 1 j bis zur klinik honig 10 ml alle 10 min (max. 6 gaben), wenn die einnahme < 12 h zurückliegt. \n \n  grundsätze"},"antidote":{"ch":8,"cht":"Intoxikationen","t":"Antidote","html":"<div class=\"box box-dosis\">\n<div class=\"box-label\">Medikamente &amp; Dosis<\/div>\n<table>\n<thead>\n<tr>\n<th>Gift<\/th>\n<th>Antidot<\/th>\n<th>Dosis<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Opioide<\/td>\n<td>Naloxon<\/td>\n<td>0,04–0,1 mg i.v. titriert bis zur ausreichenden Atmung (ohne Abhängigkeit 0,2–0,4 mg); i.m. 0,4 mg; i.n. 1,8 mg, nach 2–3 min im anderen Nasenloch wiederholen<\/td>\n<\/tr>\n<tr>\n<td>Benzodiazepine<\/td>\n<td>Flumazenil<\/td>\n<td>0,2 mg i.v., bis max. 1 mg; nur reine Benzodiazepin-Intoxikation mit Atemdepression<\/td>\n<\/tr>\n<tr>\n<td>Cyanid (Rauchgas)<\/td>\n<td>Hydroxocobalamin<\/td>\n<td>5 g i.v. über 15 min (Kinder 70 mg/kg), ggf. zweite Dosis 5 g, max. 10 g<\/td>\n<\/tr>\n<tr>\n<td>CO<\/td>\n<td>Sauerstoff<\/td>\n<td>FiO₂ 1,0 (Reservoirmaske 15 l/min oder CPAP mit 100 %)<\/td>\n<\/tr>\n<tr>\n<td>Trizyklika (QRS &gt; 100 ms)<\/td>\n<td>Natriumbikarbonat 8,4 %<\/td>\n<td>1–2 mmol/kg (1–2 ml/kg) als Bolus, alle 3–5 min bis QRS schmaler; Ziel-pH 7,45–7,55, max. 6 mmol/kg<\/td>\n<\/tr>\n<tr>\n<td>Anticholinerges Syndrom<\/td>\n<td>Physostigmin<\/td>\n<td>0,04 mg/kg langsam i.v. (etwa 1 mg/min), max. 2 mg je Gabe; nicht bei QRS &gt; 100 ms oder Trizyklika<\/td>\n<\/tr>\n<tr>\n<td>Organophosphate<\/td>\n<td>Atropin<\/td>\n<td>1–2 mg i.v., Dosis alle 5 min verdoppeln bis Bronchien trocken, HF &gt; 80/min; dann 10–20 % der Ladedosis pro Stunde<\/td>\n<\/tr>\n<tr>\n<td>Organophosphate<\/td>\n<td>Obidoxim (Toxogonin)<\/td>\n<td>250 mg i.v. (Kinder 4–8 mg/kg), dann 750 mg/24 h; früh, zusätzlich zu Atropin; vorher Dekontamination und Eigenschutz<\/td>\n<\/tr>\n<tr>\n<td>Betablocker<\/td>\n<td>Glukagon<\/td>\n<td>2–10 mg i.v. (mehrere 1-mg-Kits; Erbrechen!), dann 1–15 mg/h; zusätzlich Kalzium, Adrenalin<\/td>\n<\/tr>\n<tr>\n<td>Kalziumantagonisten<\/td>\n<td>Kalzium<\/td>\n<td>Kalziumchlorid 10 % 10–20 ml oder Kalziumglukonat 10 % 30–60 ml, wiederholbar<\/td>\n<\/tr>\n<tr>\n<td>Methämoglobinbildner<\/td>\n<td>Toluidinblau / Methylenblau<\/td>\n<td>2–4 mg/kg / 1–2 mg/kg i.v.; nicht bei G6PD-Mangel<\/td>\n<\/tr>\n<tr>\n<td>Frühdyskinesie (MCP, Haloperidol)<\/td>\n<td>Biperiden<\/td>\n<td>2,5–5 mg langsam i.v. (Kinder 0,04 mg/kg)<\/td>\n<\/tr>\n<tr>\n<td>Lokalanästhetika<\/td>\n<td>Lipidemulsion 20 %<\/td>\n<td>Kapitel 3<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>","text":" \n medikamente & dosis \n \n \n \n gift \n antidot \n dosis \n \n \n \n \n opioide \n naloxon \n 0,04–0,1 mg i.v. titriert bis zur ausreichenden atmung (ohne abhängigkeit 0,2–0,4 mg); i.m. 0,4 mg; i.n. 1,8 mg, nach 2–3 min im anderen nasenloch wiederholen \n \n \n benzodiazepine \n flumazenil \n 0,2 mg i.v., bis max. 1 mg; nur reine benzodiazepin-intoxikation mit atemdepression \n \n \n cyanid (rauchgas) \n hydroxocobalamin \n 5 g i.v. über 15 min (kinder 70 mg/kg), ggf. zweite dosis 5 g, max. 10 g \n \n \n co \n sauerstoff \n fio₂ 1,0 (reservoirmaske 15 l/min oder cpap mit 100 %) \n \n \n trizyklika (qrs > 100 ms) \n natriumbikarbonat 8,4 % \n 1–2 mmol/kg (1–2 ml/kg) als bolus, alle 3–5 min bis qrs schmaler; ziel-ph 7,45–7,55, max. 6 mmol/kg \n \n \n anticholinerges syndrom \n physostigmin \n 0,04 mg/kg langsam i.v. (etwa 1 mg/min), max. 2 mg je gabe; nicht bei qrs > 100 ms oder trizyklika \n \n \n organophosphate \n atropin \n 1–2 mg i.v., dosis alle 5 min verdoppeln bis bronchien trocken, hf > 80/min; dann 10–20 % der ladedosis pro stunde \n \n \n organophosphate \n obidoxim (toxogonin) \n 250 mg i.v. (kinder 4–8 mg/kg), dann 750 mg/24 h; früh, zusätzlich zu atropin; vorher dekontamination und eigenschutz \n \n \n betablocker \n glukagon \n 2–10 mg i.v. (mehrere 1-mg-kits; erbrechen!), dann 1–15 mg/h; zusätzlich kalzium, adrenalin \n \n \n kalziumantagonisten \n kalzium \n kalziumchlorid 10 % 10–20 ml oder kalziumglukonat 10 % 30–60 ml, wiederholbar \n \n \n methämoglobinbildner \n toluidinblau / methylenblau \n 2–4 mg/kg / 1–2 mg/kg i.v.; nicht bei g6pd-mangel \n \n \n frühdyskinesie (mcp, haloperidol) \n biperiden \n 2,5–5 mg langsam i.v. (kinder 0,04 mg/kg) \n \n \n lokalanästhetika \n lipidemulsion 20 % \n kapitel 3 \n \n \n \n  antidote"},"opioide":{"ch":8,"cht":"Intoxikationen","t":"Opioide","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Erst beatmen, dann Naloxon.<\/strong> Ziel ist ausreichende Spontanatmung, nicht ein wacher, entzügiger, aggressiver Patient.<\/li>\n<li><strong>Wirkdauer Naloxon 45–90 min<\/strong> ist kürzer als die vieler Opioide (Methadon, Retardpräparate, Fentanylpflaster, Nitazene). Nach Antagonisierung Transport empfehlen, Remorphinisierung möglich.<\/li>\n<li><strong>Hochpotente synthetische Opioide<\/strong> (Fentanyl-Analoga, Nitazene) brauchen oft höhere und wiederholte Naloxon-Dosen.<\/li>\n<li><strong>Buprenorphin<\/strong> wird durch Naloxon nur unvollständig antagonisiert: beatmen.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-neu\">\n<div class=\"box-label\">Evidenz &amp; Neu<\/div>\n<ul>\n<li><strong>Nitazene<\/strong> tauchen auch in Deutschland auf, oft in gefälschten Tabletten (z. B. als vermeintliches Oxycodon oder Benzodiazepin). Bei unerwartet tiefer Opioid-Wirkung nach „Tablette\" daran denken. Drogentote in Deutschland 2025: 2150.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Abrupte Antagonisierung:<\/strong> Entzug mit Erbrechen, Agitation, Lungenödem, selten Rhythmusstörungen.<\/li>\n<li><strong>Fentanylpflaster:<\/strong> entfernen, Haut abwaschen; Depot wirkt nach.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  erst beatmen, dann naloxon.  ziel ist ausreichende spontanatmung, nicht ein wacher, entzügiger, aggressiver patient. \n  wirkdauer naloxon 45–90 min  ist kürzer als die vieler opioide (methadon, retardpräparate, fentanylpflaster, nitazene). nach antagonisierung transport empfehlen, remorphinisierung möglich. \n  hochpotente synthetische opioide  (fentanyl-analoga, nitazene) brauchen oft höhere und wiederholte naloxon-dosen. \n  buprenorphin  wird durch naloxon nur unvollständig antagonisiert: beatmen. \n \n \n \n evidenz & neu \n \n  nitazene  tauchen auch in deutschland auf, oft in gefälschten tabletten (z. b. als vermeintliches oxycodon oder benzodiazepin). bei unerwartet tiefer opioid-wirkung nach „tablette\" daran denken. drogentote in deutschland 2025: 2150. \n \n \n \n pitfalls \n \n  abrupte antagonisierung:  entzug mit erbrechen, agitation, lungenödem, selten rhythmusstörungen. \n  fentanylpflaster:  entfernen, haut abwaschen; depot wirkt nach. \n \n  opioide"},"alkohol":{"ch":8,"cht":"Intoxikationen","t":"Alkohol, Sedativa, GHB","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Alkohol:<\/strong> Aspiration, Hypothermie, Hypoglykämie, SHT, Entzug. Ein „Betrunkener\" mit fokaler Neurologie oder ungewöhnlicher Vigilanz bei mäßigem Atemalkohol braucht eine Klinik.<\/li>\n<li><strong>GHB/GBL:<\/strong> plötzliches, tiefes Koma, oft mit Bradykardie, Erbrechen; Erwachen ebenso abrupt nach 1–3 h. Atemweg sichern, meist keine Intubation nötig, wenn Schutzreflexe und Atmung ausreichen.<\/li>\n<li><strong>Methanol, Ethylenglykol:<\/strong> Sehstörungen, schwere Azidose, Bewusstseinsstörung erst nach Latenz. Fomepizol in der Klinik; Hinweis an die Zielklinik.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  alkohol:  aspiration, hypothermie, hypoglykämie, sht, entzug. ein „betrunkener\" mit fokaler neurologie oder ungewöhnlicher vigilanz bei mäßigem atemalkohol braucht eine klinik. \n  ghb/gbl:  plötzliches, tiefes koma, oft mit bradykardie, erbrechen; erwachen ebenso abrupt nach 1–3 h. atemweg sichern, meist keine intubation nötig, wenn schutzreflexe und atmung ausreichen. \n  methanol, ethylenglykol:  sehstörungen, schwere azidose, bewusstseinsstörung erst nach latenz. fomepizol in der klinik; hinweis an die zielklinik. \n \n  alkohol, sedativa, ghb"},"stim":{"ch":8,"cht":"Intoxikationen","t":"Stimulanzien","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Kokain, Amphetamine, Cathinone, MDMA:<\/strong> Agitation, Hyperthermie, Hypertonie, Tachykardie, Krampfanfall, ACS, Aortendissektion, Schlaganfall.<\/li>\n<li><strong>Benzodiazepine sind die Basistherapie:<\/strong> Midazolam 2,5–5 mg i.v. titriert oder 5–10 mg i.m. Kühlen bei Hyperthermie.<\/li>\n<li><strong>MDMA:<\/strong> Hyponatriämie durch exzessives Trinken, Krampfanfall, Serotoninsyndrom.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Fixierung in Bauchlage<\/strong> und Druck auf den Thorax beim agitierten, hyperthermen Patienten: plötzlicher Kreislaufstillstand. Kapitel 9.<\/li>\n<li><strong>Hyperthermie &gt; 40 °C<\/strong> ist der wichtigste Mortalitätsprädiktor: aktiv kühlen, sedieren.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  kokain, amphetamine, cathinone, mdma:  agitation, hyperthermie, hypertonie, tachykardie, krampfanfall, acs, aortendissektion, schlaganfall. \n  benzodiazepine sind die basistherapie:  midazolam 2,5–5 mg i.v. titriert oder 5–10 mg i.m. kühlen bei hyperthermie. \n  mdma:  hyponatriämie durch exzessives trinken, krampfanfall, serotoninsyndrom. \n \n \n \n pitfalls \n \n  fixierung in bauchlage  und druck auf den thorax beim agitierten, hyperthermen patienten: plötzlicher kreislaufstillstand. kapitel 9. \n  hyperthermie > 40 °c  ist der wichtigste mortalitätsprädiktor: aktiv kühlen, sedieren. \n \n  stimulanzien"},"co":{"ch":8,"cht":"Intoxikationen","t":"CO und Rauchgas","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>SpO₂ ist bei CO falsch normal.<\/strong> CO-Hb über Mehrwellenlängen-Pulsoximetrie (SpCO) oder BGA mit Co-Oxymetrie; <strong>Blutprobe schon präklinisch abnehmen<\/strong> (CO-Hb fällt unter O₂ rasch).<\/li>\n<li><strong>Symptome unspezifisch:<\/strong> Kopfschmerz, Übelkeit, Schwindel, mehrere Betroffene im selben Haushalt, Haustiere betroffen. Die CO-Hb-Höhe korreliert schlecht mit der Klinik.<\/li>\n<li><strong>Therapie:<\/strong> FiO₂ 1,0 sofort, unabhängig von der SpO₂.<\/li>\n<li><strong>Hyperbare Oxygenierung erwägen<\/strong> (S2k 2021) bei anhaltender Bewusstseinsstörung, metabolischer Azidose, respiratorischer Insuffizienz, kardialer Ischämie, Schwangerschaft; Beginn möglichst innerhalb von 6 h. Die Indikation ist umstritten; Verfügbarkeit einer Druckkammer früh klären.<\/li>\n<li><strong>Rauchgas und Cyanid:<\/strong> geschlossener Raum, Ruß, Bewusstlosigkeit, Krampfanfall, Hypotonie oder Schock, Laktat ≥ 10 mmol/l bzw. pH &lt; 7,2 trotz O₂ → <strong>Hydroxocobalamin 5 g<\/strong>.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>4-DMAP bei Rauchgas<\/strong> ist kontraindiziert: Methämoglobin verschlechtert zusätzlich zum CO-Hb den O₂-Transport.<\/li>\n<li><strong>Hydroxocobalamin<\/strong> färbt Haut und Urin rot und stört kolorimetrische Labor- und Co-Oxymetrie-Werte. Vor der Gabe Blut abnehmen, Zielklinik informieren.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  spo₂ ist bei co falsch normal.  co-hb über mehrwellenlängen-pulsoximetrie (spco) oder bga mit co-oxymetrie;  blutprobe schon präklinisch abnehmen  (co-hb fällt unter o₂ rasch). \n  symptome unspezifisch:  kopfschmerz, übelkeit, schwindel, mehrere betroffene im selben haushalt, haustiere betroffen. die co-hb-höhe korreliert schlecht mit der klinik. \n  therapie:  fio₂ 1,0 sofort, unabhängig von der spo₂. \n  hyperbare oxygenierung erwägen  (s2k 2021) bei anhaltender bewusstseinsstörung, metabolischer azidose, respiratorischer insuffizienz, kardialer ischämie, schwangerschaft; beginn möglichst innerhalb von 6 h. die indikation ist umstritten; verfügbarkeit einer druckkammer früh klären. \n  rauchgas und cyanid:  geschlossener raum, ruß, bewusstlosigkeit, krampfanfall, hypotonie oder schock, laktat ≥ 10 mmol/l bzw. ph < 7,2 trotz o₂ →  hydroxocobalamin 5 g . \n \n \n \n pitfalls \n \n  4-dmap bei rauchgas  ist kontraindiziert: methämoglobin verschlechtert zusätzlich zum co-hb den o₂-transport. \n  hydroxocobalamin  färbt haut und urin rot und stört kolorimetrische labor- und co-oxymetrie-werte. vor der gabe blut abnehmen, zielklinik informieren. \n \n  co und rauchgas"},"kardiotox":{"ch":8,"cht":"Intoxikationen","t":"Kardiotoxische Substanzen","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Trizyklika:<\/strong> Anticholinerges Bild, Krampfanfälle, QRS-Verbreiterung, R in aVR &gt; 3 mm. Natriumbikarbonat bei QRS &gt; 100 ms, Ziel-pH 7,45–7,55. Krampfanfälle mit Benzodiazepinen.<\/li>\n<li><strong>Betablocker, Kalziumantagonisten:<\/strong> Bradykardie, Hypotonie; bei Kalziumantagonisten zusätzlich Hyperglykämie. Atropin, Kalzium, Glukagon, Adrenalin- bzw. Noradrenalin-Perfusor, Pacing; in der Klinik Hochdosis-Insulin (1 IE/kg Bolus, dann 1–10 IE/kg/h mit Glukose; AHA 2023 Klasse 1), frühe ECLS-Option.<\/li>\n<li><strong>Digitalis:<\/strong> Übelkeit, Gelbsehen, Bradykardie, Rhythmusstörungen aller Art; Antidot Digitalis-Antitoxin in der Klinik.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Physostigmin<\/strong> ist bei Trizyklika-Intoxikation mit QRS-Verbreiterung kontraindiziert (Asystolie).<\/li>\n<li><strong>Flumazenil<\/strong> bei Mischintoxikation mit Trizyklika oder bei Benzodiazepin-Abhängigkeit: Krampfanfälle.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  trizyklika:  anticholinerges bild, krampfanfälle, qrs-verbreiterung, r in avr > 3 mm. natriumbikarbonat bei qrs > 100 ms, ziel-ph 7,45–7,55. krampfanfälle mit benzodiazepinen. \n  betablocker, kalziumantagonisten:  bradykardie, hypotonie; bei kalziumantagonisten zusätzlich hyperglykämie. atropin, kalzium, glukagon, adrenalin- bzw. noradrenalin-perfusor, pacing; in der klinik hochdosis-insulin (1 ie/kg bolus, dann 1–10 ie/kg/h mit glukose; aha 2023 klasse 1), frühe ecls-option. \n  digitalis:  übelkeit, gelbsehen, bradykardie, rhythmusstörungen aller art; antidot digitalis-antitoxin in der klinik. \n \n \n \n pitfalls \n \n  physostigmin  ist bei trizyklika-intoxikation mit qrs-verbreiterung kontraindiziert (asystolie). \n  flumazenil  bei mischintoxikation mit trizyklika oder bei benzodiazepin-abhängigkeit: krampfanfälle. \n \n  kardiotoxische substanzen"},"agitation":{"ch":9,"cht":"Psychiatrische Notfälle","t":"Agitation und Erregungszustand","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Eigenschutz zuerst:<\/strong> Fluchtweg frei, nicht allein, Polizei früh, gefährliche Gegenstände entfernen.<\/li>\n<li><strong>Organische Ursache suchen<\/strong>, bevor „psychiatrisch\" etikettiert wird: Hypoglykämie, Hypoxie, Intoxikation, Entzug, SHT, Infekt und Delir, postiktaler Zustand, Hyperthyreose, Hyperthermie.<\/li>\n<li><strong>Deeskalation:<\/strong> eine Ansprechperson, ruhig, kurze Sätze, Abstand, Wahlmöglichkeiten anbieten, nicht drohen, keine Diskussion über Wahninhalte.<\/li>\n<li><strong>Medikation stufenweise:<\/strong> zuerst oral anbieten, dann i.m. oder i.v.; jede Sedierung mit Monitoring, Atemwegsmaterial und Kapnografie bereit.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-dosis\">\n<div class=\"box-label\">Medikamente &amp; Dosis<\/div>\n<table>\n<thead>\n<tr>\n<th>Lage<\/th>\n<th>Substanz<\/th>\n<th>Dosis<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>kooperativ<\/td>\n<td>Lorazepam p.o./s.l.<\/td>\n<td>1–2,5 mg (Schmelztablette)<\/td>\n<\/tr>\n<tr>\n<td>kooperativ, psychotisch<\/td>\n<td>Olanzapin p.o.<\/td>\n<td>10 mg (Schmelztablette)<\/td>\n<\/tr>\n<tr>\n<td>schwere Agitation<\/td>\n<td>Midazolam i.m./i.v.<\/td>\n<td>5 mg i.m. (Ältere 2,5 mg), i.v. 1–2 mg titriert<\/td>\n<\/tr>\n<tr>\n<td>schwere Agitation, psychotisch<\/td>\n<td>Haloperidol i.m.<\/td>\n<td>5 mg (Ältere 1–2 mg), kombiniert mit Midazolam oder Lorazepam<\/td>\n<\/tr>\n<tr>\n<td>extreme Agitation, Gefährdung<\/td>\n<td>Ketamin i.m.<\/td>\n<td>4–5 mg/kg i.m. oder 1–2 mg/kg i.v. (Esketamin halbe Dosis); Gewicht realistisch schätzen<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"box box-neu\">\n<div class=\"box-label\">Evidenz &amp; Neu<\/div>\n<ul>\n<li><strong>Midazolam 5 mg i.m.<\/strong> sedierte nach 15 min häufiger als Haloperidol, Olanzapin oder Ziprasidon (Klein 2018).<\/li>\n<li><strong>Droperidol<\/strong> (in Deutschland nur zur PONV zugelassen, für Agitation off-label) ist international gut untersucht und wirkt schnell. Lokale SOP beachten.<\/li>\n<li><strong>Ketamin<\/strong> sediert am schnellsten, führt aber präklinisch häufiger zu Atemwegsinterventionen und Intubationen als Haloperidol. Nach Ketamin-Sedierung Monitoring und Begleitung bis zur Übergabe.<\/li>\n<li><strong>Begriff:<\/strong> „Excited delirium\" ist international aufgegeben (ACEP 2023); verwendet wird „hyperaktives Delir mit schwerer Agitation\".<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Haloperidol:<\/strong> QT-Verlängerung, Frühdyskinesien (Biperiden), bei Demenz und besonders Lewy-Körperchen-Demenz und Parkinson gefährlich. Bei Älteren eher niedrig dosiertes Benzodiazepin oder gar nichts.<\/li>\n<li><strong>Benzodiazepin plus Alkohol oder Opioid:<\/strong> Atemdepression.<\/li>\n<li><strong>Hyperaktives Delir mit schwerer Agitation<\/strong> (früher „excited delirium\"; Stimulanzien, Psychose, Entzug): Hyperthermie, Azidose, Rhabdomyolyse, plötzlicher Kreislaufstillstand. Rasch und ausreichend sedieren, kühlen, Volumen, Monitoring.<\/li>\n<li><strong>Lagebedingte Asphyxie:<\/strong> Bauchlage, Knie auf Rücken oder Nacken, Fixierung „Hog-tie\". Nach Überwältigung sofort Seitenlage oder Rückenlage, kontinuierlich SpO₂ und etCO₂.<\/li>\n<li><strong>Olanzapin i.m.:<\/strong> keine parenteralen Benzodiazepine innerhalb von 1 h (Atem- und Kreislaufdepression).<\/li>\n<li><strong>Fixierung:<\/strong> Eine 5- oder 7-Punkt-Fixierung über etwa 30 min hinaus braucht eine richterliche Genehmigung (BVerfG 2018). Präklinisch so kurz wie möglich, nie ohne Überwachung.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  eigenschutz zuerst:  fluchtweg frei, nicht allein, polizei früh, gefährliche gegenstände entfernen. \n  organische ursache suchen , bevor „psychiatrisch\" etikettiert wird: hypoglykämie, hypoxie, intoxikation, entzug, sht, infekt und delir, postiktaler zustand, hyperthyreose, hyperthermie. \n  deeskalation:  eine ansprechperson, ruhig, kurze sätze, abstand, wahlmöglichkeiten anbieten, nicht drohen, keine diskussion über wahninhalte. \n  medikation stufenweise:  zuerst oral anbieten, dann i.m. oder i.v.; jede sedierung mit monitoring, atemwegsmaterial und kapnografie bereit. \n \n \n \n medikamente & dosis \n \n \n \n lage \n substanz \n dosis \n \n \n \n \n kooperativ \n lorazepam p.o./s.l. \n 1–2,5 mg (schmelztablette) \n \n \n kooperativ, psychotisch \n olanzapin p.o. \n 10 mg (schmelztablette) \n \n \n schwere agitation \n midazolam i.m./i.v. \n 5 mg i.m. (ältere 2,5 mg), i.v. 1–2 mg titriert \n \n \n schwere agitation, psychotisch \n haloperidol i.m. \n 5 mg (ältere 1–2 mg), kombiniert mit midazolam oder lorazepam \n \n \n extreme agitation, gefährdung \n ketamin i.m. \n 4–5 mg/kg i.m. oder 1–2 mg/kg i.v. (esketamin halbe dosis); gewicht realistisch schätzen \n \n \n \n \n \n evidenz & neu \n \n  midazolam 5 mg i.m.  sedierte nach 15 min häufiger als haloperidol, olanzapin oder ziprasidon (klein 2018). \n  droperidol  (in deutschland nur zur ponv zugelassen, für agitation off-label) ist international gut untersucht und wirkt schnell. lokale sop beachten. \n  ketamin  sediert am schnellsten, führt aber präklinisch häufiger zu atemwegsinterventionen und intubationen als haloperidol. nach ketamin-sedierung monitoring und begleitung bis zur übergabe. \n  begriff:  „excited delirium\" ist international aufgegeben (acep 2023); verwendet wird „hyperaktives delir mit schwerer agitation\". \n \n \n \n pitfalls \n \n  haloperidol:  qt-verlängerung, frühdyskinesien (biperiden), bei demenz und besonders lewy-körperchen-demenz und parkinson gefährlich. bei älteren eher niedrig dosiertes benzodiazepin oder gar nichts. \n  benzodiazepin plus alkohol oder opioid:  atemdepression. \n  hyperaktives delir mit schwerer agitation  (früher „excited delirium\"; stimulanzien, psychose, entzug): hyperthermie, azidose, rhabdomyolyse, plötzlicher kreislaufstillstand. rasch und ausreichend sedieren, kühlen, volumen, monitoring. \n  lagebedingte asphyxie:  bauchlage, knie auf rücken oder nacken, fixierung „hog-tie\". nach überwältigung sofort seitenlage oder rückenlage, kontinuierlich spo₂ und etco₂. \n  olanzapin i.m.:  keine parenteralen benzodiazepine innerhalb von 1 h (atem- und kreislaufdepression). \n  fixierung:  eine 5- oder 7-punkt-fixierung über etwa 30 min hinaus braucht eine richterliche genehmigung (bverfg 2018). präklinisch so kurz wie möglich, nie ohne überwachung. \n \n  agitation und erregungszustand"},"suizid":{"ch":9,"cht":"Psychiatrische Notfälle","t":"Suizidalität","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Direkt fragen.<\/strong> Nachfragen erhöht das Risiko nicht. Konkrete Pläne, Mittel, Vorbereitung, frühere Versuche, Abschiedsbrief.<\/li>\n<li><strong>Nicht allein lassen<\/strong>, gefährliche Mittel entfernen (Medikamente, Messer, Waffen).<\/li>\n<li><strong>Akute Suizidalität:<\/strong> Transport in psychiatrische Klinik. Bei Ablehnung und fehlender Einsichtsfähigkeit <strong>Unterbringung nach Landesrecht<\/strong> (in Rheinland-Pfalz PsychKG) über Ordnungsbehörde oder Polizei; ärztliches Zeugnis mit konkreter Gefahrenbeschreibung.<\/li>\n<li><strong>Bei unmittelbarer Gefahr<\/strong> rechtfertigt der Notstand das sofortige Handeln.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Ruhe nach Entschluss:<\/strong> Plötzlich gelassene Patienten nach Krise können einen Entschluss gefasst haben.<\/li>\n<li><strong>Intoxikation mit Suizidabsicht<\/strong> immer in die Klinik, auch wenn die Menge gering erscheint.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  direkt fragen.  nachfragen erhöht das risiko nicht. konkrete pläne, mittel, vorbereitung, frühere versuche, abschiedsbrief. \n  nicht allein lassen , gefährliche mittel entfernen (medikamente, messer, waffen). \n  akute suizidalität:  transport in psychiatrische klinik. bei ablehnung und fehlender einsichtsfähigkeit  unterbringung nach landesrecht  (in rheinland-pfalz psychkg) über ordnungsbehörde oder polizei; ärztliches zeugnis mit konkreter gefahrenbeschreibung. \n  bei unmittelbarer gefahr  rechtfertigt der notstand das sofortige handeln. \n \n \n \n pitfalls \n \n  ruhe nach entschluss:  plötzlich gelassene patienten nach krise können einen entschluss gefasst haben. \n  intoxikation mit suizidabsicht  immer in die klinik, auch wenn die menge gering erscheint. \n \n  suizidalität"},"entzug":{"ch":9,"cht":"Psychiatrische Notfälle","t":"Alkoholentzug und Delir","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Entzugssyndrom:<\/strong> Tremor, Schwitzen, Tachykardie, Hypertonie, Unruhe, Krampfanfälle (6–48 h), Delir (48–72 h) mit Halluzinationen und vegetativer Entgleisung.<\/li>\n<li><strong>Therapie:<\/strong> Benzodiazepin titriert (Diazepam 10 mg i.v. oder Lorazepam 1–2 mg i.v., wiederholt bis zur Beruhigung), Thiamin 100 mg i.v., Volumen, Elektrolyte, BZ.<\/li>\n<li><strong>Delir beim älteren Patienten<\/strong> ist ein medizinischer Notfall: Infekt, Exsikkose, Harnverhalt, Medikamente (Anticholinergika, Opioide, Benzodiazepine), Schmerz, Hypoglykämie.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  entzugssyndrom:  tremor, schwitzen, tachykardie, hypertonie, unruhe, krampfanfälle (6–48 h), delir (48–72 h) mit halluzinationen und vegetativer entgleisung. \n  therapie:  benzodiazepin titriert (diazepam 10 mg i.v. oder lorazepam 1–2 mg i.v., wiederholt bis zur beruhigung), thiamin 100 mg i.v., volumen, elektrolyte, bz. \n  delir beim älteren patienten  ist ein medizinischer notfall: infekt, exsikkose, harnverhalt, medikamente (anticholinergika, opioide, benzodiazepine), schmerz, hypoglykämie. \n \n  alkoholentzug und delir"},"panik":{"ch":9,"cht":"Psychiatrische Notfälle","t":"Panik und Hyperventilation","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Ausschlussdiagnose:<\/strong> ACS, LAE, Asthma, DKA (Kussmaul-Atmung), Hypoglykämie, Hyperthyreose, Intoxikation.<\/li>\n<li><strong>Reden, Atmung gemeinsam verlangsamen, Rückmeldung zum Befund geben.<\/strong> Kein Plastikbeutel (Hypoxiegefahr).<\/li>\n<li><strong>Bei Bedarf:<\/strong> Lorazepam 1 mg s.l.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  ausschlussdiagnose:  acs, lae, asthma, dka (kussmaul-atmung), hypoglykämie, hyperthyreose, intoxikation. \n  reden, atmung gemeinsam verlangsamen, rückmeldung zum befund geben.  kein plastikbeutel (hypoxiegefahr). \n  bei bedarf:  lorazepam 1 mg s.l. \n \n  panik und hyperventilation"},"poly-ablauf":{"ch":10,"cht":"Trauma","t":"Polytrauma: Ablauf","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>cABCDE:<\/strong> kritische Blutung vor allem anderen, dann Atemweg mit HWS-Bewegungseinschränkung, Atmung, Kreislauf, Neurologie, Exposition mit Wärmeerhalt.<\/li>\n<li><strong>Zeit am Einsatzort<\/strong> so kurz wie möglich. Am Einsatzort nur, was nicht warten kann: Blutstillung, Atemweg, Entlastung Spannungspneumothorax, Beckengurt, Wärme.<\/li>\n<li><strong>Zielklinik nach TraumaNetzwerk<\/strong> und Verletzungsmuster, Voranmeldung strukturiert (ATMIST). Penetrierendes Thorax- oder Abdominaltrauma: nächstes geeignetes Traumazentrum.<\/li>\n<li><strong>Hypothermie, Azidose, Koagulopathie, Hypokalzämie<\/strong> verstärken sich gegenseitig. Wärme ist Therapie.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  cabcde:  kritische blutung vor allem anderen, dann atemweg mit hws-bewegungseinschränkung, atmung, kreislauf, neurologie, exposition mit wärmeerhalt. \n  zeit am einsatzort  so kurz wie möglich. am einsatzort nur, was nicht warten kann: blutstillung, atemweg, entlastung spannungspneumothorax, beckengurt, wärme. \n  zielklinik nach traumanetzwerk  und verletzungsmuster, voranmeldung strukturiert (atmist). penetrierendes thorax- oder abdominaltrauma: nächstes geeignetes traumazentrum. \n  hypothermie, azidose, koagulopathie, hypokalzämie  verstärken sich gegenseitig. wärme ist therapie. \n \n  polytrauma: ablauf"},"blutung":{"ch":10,"cht":"Trauma","t":"Kritische Blutung","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Extremität stufenweise (S3):<\/strong> manuelle Kompression → Druckverband, ggf. mit Hämostyptikum → <strong>Tourniquet<\/strong>. Bei lebensbedrohlicher Blutung, die anders nicht rechtzeitig steht, sofort Tourniquet: 5–7 cm proximal der Wunde, nicht über Gelenken; bei unklarer Quelle oder Zeitnot „hoch und fest\". Anziehen, bis die Blutung steht und der distale Puls fehlt. Uhrzeit notieren. Zweites Tourniquet direkt proximal, wenn eines nicht reicht. Unter Zeitdruck angelegte Tourniquets nach der Rettung überprüfen.<\/li>\n<li><strong>Junktional (Leiste, Axilla, Hals) und Stichwunden:<\/strong> Wundpacking mit Hämostyptikum (Chitosan), mindestens 3 min Druck.<\/li>\n<li><strong>Becken:<\/strong> Beckengurt auf Höhe der Trochanteren bei Verdacht auf Beckenringverletzung und Kreislaufinstabilität. Kein Federn des Beckens.<\/li>\n<li><strong>Tranexamsäure<\/strong> 1 g i.v. über 10 min bei manifestem oder drohendem hämorrhagischem Schock, so früh wie möglich. Nach 3 h kein Nutzen mehr (in CRASH-2 dann eher Schaden).<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Kreislauf (S3 Polytrauma)<\/div>\n<ul>\n<li><strong>Unkontrollierte Blutung:<\/strong> Volumen reduziert, Ziel <strong>MAP etwa 65 mmHg bzw. RR sys etwa 80 mmHg<\/strong> bis zur Blutstillung; Radialispuls und Bewusstsein als grobe Orientierung.<\/li>\n<li><strong>SHT:<\/strong> keine permissive Hypotonie; S3: RR sys ≥ 90 mmHg als Untergrenze, BTF: ≥ 100 mmHg (50–69 J) bzw. ≥ 110 mmHg (15–49 J und &gt; 70 J).<\/li>\n<li><strong>Keine Hypovolämiezeichen → kein Volumen.<\/strong><\/li>\n<li><strong>Volumen:<\/strong> balancierte, gewärmte Kristalloide in 250-ml-Boli; kein NaCl 0,9 % in großen Mengen, keine Kolloide. Zugang i.v., bei Versagen i.o.<\/li>\n<li><strong>Vasopressor<\/strong> kann bei unzureichendem RR trotz Volumen erwogen werden; ersetzt keine Blutstillung.<\/li>\n<li><strong>Fibrinogen, Erythrozytenkonzentrat und Plasma<\/strong> präklinisch nur, wenn vorhanden und ohne Transportverzögerung (Empfehlungsgrad 0).<\/li>\n<\/ul>\n<\/div>\n<table>\n<thead>\n<tr>\n<th>Geschlossene Fraktur<\/th>\n<th>Möglicher Blutverlust<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Becken<\/td>\n<td>1–5 l<\/td>\n<\/tr>\n<tr>\n<td>Oberschenkel<\/td>\n<td>1–2 l<\/td>\n<\/tr>\n<tr>\n<td>Unterschenkel<\/td>\n<td>0,5–1 l<\/td>\n<\/tr>\n<tr>\n<td>Oberarm<\/td>\n<td>0,5–1 l<\/td>\n<\/tr>\n<tr>\n<td>Unterarm<\/td>\n<td>0,25–0,5 l<\/td>\n<\/tr>\n<tr>\n<td>Hämatothorax je Seite<\/td>\n<td>bis 3 l<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"box box-neu\">\n<div class=\"box-label\">Evidenz &amp; Neu<\/div>\n<ul>\n<li><strong>PATCH-Trauma (NEJM 2023, n = 1310):<\/strong> präklinische Tranexamsäure verbesserte das funktionelle Outcome nach 6 Monaten nicht (53,7 vs. 53,5 %), senkte aber die Mortalität nach 24 h (9,7 vs. 14,1 %) und 28 Tagen (17,3 vs. 21,8 %), ohne mehr Thrombosen. Gabe bleibt Standard, entscheidend ist der frühe Zeitpunkt.<\/li>\n<li><strong>CRASH-3 (Lancet 2019):<\/strong> Beim SHT senkt Tranexamsäure innerhalb von 3 h die kopfverletzungsbedingte Mortalität nur bei GCS 9–15, nicht bei GCS 3–8.<\/li>\n<li><strong>Präklinische Blutprodukte:<\/strong> PAMPer (2018): Plasma im Hubschrauber senkte die 30-Tage-Mortalität (23,2 vs. 33,0 %). RePHILL (2022): Erythrozytenkonzentrat plus Plasma vs. Kochsalz ohne Vorteil. <strong>SWiFT und TOWAR (NEJM 2026):<\/strong> Vollblut war gegenüber Komponenten (EK plus Plasma) nicht überlegen. In Deutschland führen nur wenige Luftrettungsstandorte Blutprodukte mit (z. B. DRF an 6 Stationen, Stand 08/2026).<\/li>\n<li><strong>PROCOAG (JAMA 2023):<\/strong> empirisches PPSB beim Trauma ohne Nutzen, mehr Thromboembolien.<\/li>\n<li><strong>REBOA:<\/strong> im UK-REBOA-Trial (2023) eher Schaden; präklinisch keine Rolle.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  extremität stufenweise (s3):  manuelle kompression → druckverband, ggf. mit hämostyptikum →  tourniquet . bei lebensbedrohlicher blutung, die anders nicht rechtzeitig steht, sofort tourniquet: 5–7 cm proximal der wunde, nicht über gelenken; bei unklarer quelle oder zeitnot „hoch und fest\". anziehen, bis die blutung steht und der distale puls fehlt. uhrzeit notieren. zweites tourniquet direkt proximal, wenn eines nicht reicht. unter zeitdruck angelegte tourniquets nach der rettung überprüfen. \n  junktional (leiste, axilla, hals) und stichwunden:  wundpacking mit hämostyptikum (chitosan), mindestens 3 min druck. \n  becken:  beckengurt auf höhe der trochanteren bei verdacht auf beckenringverletzung und kreislaufinstabilität. kein federn des beckens. \n  tranexamsäure  1 g i.v. über 10 min bei manifestem oder drohendem hämorrhagischem schock, so früh wie möglich. nach 3 h kein nutzen mehr (in crash-2 dann eher schaden). \n \n \n \n kreislauf (s3 polytrauma) \n \n  unkontrollierte blutung:  volumen reduziert, ziel  map etwa 65 mmhg bzw. rr sys etwa 80 mmhg  bis zur blutstillung; radialispuls und bewusstsein als grobe orientierung. \n  sht:  keine permissive hypotonie; s3: rr sys ≥ 90 mmhg als untergrenze, btf: ≥ 100 mmhg (50–69 j) bzw. ≥ 110 mmhg (15–49 j und > 70 j). \n  keine hypovolämiezeichen → kein volumen.  \n  volumen:  balancierte, gewärmte kristalloide in 250-ml-boli; kein nacl 0,9 % in großen mengen, keine kolloide. zugang i.v., bei versagen i.o. \n  vasopressor  kann bei unzureichendem rr trotz volumen erwogen werden; ersetzt keine blutstillung. \n  fibrinogen, erythrozytenkonzentrat und plasma  präklinisch nur, wenn vorhanden und ohne transportverzögerung (empfehlungsgrad 0). \n \n \n \n \n \n geschlossene fraktur \n möglicher blutverlust \n \n \n \n \n becken \n 1–5 l \n \n \n oberschenkel \n 1–2 l \n \n \n unterschenkel \n 0,5–1 l \n \n \n oberarm \n 0,5–1 l \n \n \n unterarm \n 0,25–0,5 l \n \n \n hämatothorax je seite \n bis 3 l \n \n \n \n \n evidenz & neu \n \n  patch-trauma (nejm 2023, n = 1310):  präklinische tranexamsäure verbesserte das funktionelle outcome nach 6 monaten nicht (53,7 vs. 53,5 %), senkte aber die mortalität nach 24 h (9,7 vs. 14,1 %) und 28 tagen (17,3 vs. 21,8 %), ohne mehr thrombosen. gabe bleibt standard, entscheidend ist der frühe zeitpunkt. \n  crash-3 (lancet 2019):  beim sht senkt tranexamsäure innerhalb von 3 h die kopfverletzungsbedingte mortalität nur bei gcs 9–15, nicht bei gcs 3–8. \n  präklinische blutprodukte:  pamper (2018): plasma im hubschrauber senkte die 30-tage-mortalität (23,2 vs. 33,0 %). rephill (2022): erythrozytenkonzentrat plus plasma vs. kochsalz ohne vorteil.  swift und towar (nejm 2026):  vollblut war gegenüber komponenten (ek plus plasma) nicht überlegen. in deutschland führen nur wenige luftrettungsstandorte blutprodukte mit (z. b. drf an 6 stationen, stand 08/2026). \n  procoag (jama 2023):  empirisches ppsb beim trauma ohne nutzen, mehr thromboembolien. \n  reboa:  im uk-reboa-trial (2023) eher schaden; präklinisch keine rolle. \n \n  kritische blutung"},"thorax":{"ch":10,"cht":"Trauma","t":"Thoraxtrauma","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Spannungspneumothorax:<\/strong> Hypotonie, Hypoxie, einseitig fehlendes Atemgeräusch, gestaute Halsvenen, steigende Beatmungsdrücke. Klinische Diagnose, kein Warten auf POCUS.<\/li>\n<li><strong>Sofort entlasten (S3):<\/strong> einmalige Nadeldekompression <strong>oder<\/strong> direkt Minithorakotomie, danach chirurgische Eröffnung der Pleura mit oder ohne Drainage. S3 legt sich auf keinen Punktionsort fest: 2. ICR Medioklavikularlinie oder 4./5. ICR zwischen vorderer und mittlerer Axillarlinie; ausreichend lange Kanüle (≥ 7–8 cm). Versagensrate der Nadel hoch.<\/li>\n<li><strong>Beatmeter Patient:<\/strong> einfache Thorakostomie (Minithorakotomie mit Finger), ggf. Drainage. Wird der Patient nicht beatmet, braucht die Thorakostomie eine Drainage oder ein Ventil. Drainage <strong>ohne Trokar<\/strong> einlegen.<\/li>\n<li><strong>Offener Pneumothorax:<\/strong> Ventilverband (Chest Seal mit Ventil).<\/li>\n<li><strong>Instabiler Thorax:<\/strong> Analgesie, NIV/CPAP, früh Intubation bei Erschöpfung.<\/li>\n<li><strong>Perikardtamponade:<\/strong> Beck-Trias, POCUS. Im traumatischen Kreislaufstillstand Thorakotomie (Kapitel 15).<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Nadel zu kurz oder zu medial:<\/strong> Bei kräftigen Patienten reicht eine normale Venenverweilkanüle nicht in den Pleuraraum; zu medial im 2. ICR droht die A. thoracica interna.<\/li>\n<li><strong>Nach Dekompression erneut instabil:<\/strong> Kanüle abgeknickt oder verlegt. Thorakostomie ist definitiv.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  spannungspneumothorax:  hypotonie, hypoxie, einseitig fehlendes atemgeräusch, gestaute halsvenen, steigende beatmungsdrücke. klinische diagnose, kein warten auf pocus. \n  sofort entlasten (s3):  einmalige nadeldekompression  oder  direkt minithorakotomie, danach chirurgische eröffnung der pleura mit oder ohne drainage. s3 legt sich auf keinen punktionsort fest: 2. icr medioklavikularlinie oder 4./5. icr zwischen vorderer und mittlerer axillarlinie; ausreichend lange kanüle (≥ 7–8 cm). versagensrate der nadel hoch. \n  beatmeter patient:  einfache thorakostomie (minithorakotomie mit finger), ggf. drainage. wird der patient nicht beatmet, braucht die thorakostomie eine drainage oder ein ventil. drainage  ohne trokar  einlegen. \n  offener pneumothorax:  ventilverband (chest seal mit ventil). \n  instabiler thorax:  analgesie, niv/cpap, früh intubation bei erschöpfung. \n  perikardtamponade:  beck-trias, pocus. im traumatischen kreislaufstillstand thorakotomie (kapitel 15). \n \n \n \n pitfalls \n \n  nadel zu kurz oder zu medial:  bei kräftigen patienten reicht eine normale venenverweilkanüle nicht in den pleuraraum; zu medial im 2. icr droht die a. thoracica interna. \n  nach dekompression erneut instabil:  kanüle abgeknickt oder verlegt. thorakostomie ist definitiv. \n \n  thoraxtrauma"},"sht":{"ch":10,"cht":"Trauma","t":"Schädel-Hirn-Trauma","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Sekundärschäden vermeiden:<\/strong> Hypoxie und Hypotonie verdoppeln jeweils die Mortalität. Schon eine einzelne Episode zählt.<\/li>\n<li><strong>Ziele:<\/strong> SpO₂ &gt; 90 % (besser ≥ 94 %), RR sys ≥ 100–110 mmHg (Untergrenze 90 mmHg), Normokapnie mit etCO₂ 35–40 mmHg (paCO₂ liegt im Schock deutlich darüber), Normoglykämie, Normothermie (36–37 °C). RR alle 5–10 min messen.<\/li>\n<li><strong>GCS und Pupillen<\/strong> vor Analgosedierung dokumentieren, Verlauf notieren.<\/li>\n<li><strong>Lagerung:<\/strong> 30° Oberkörper hoch bei stabilem Kreislauf, Kopf in Neutralstellung, HWS-Orthese nicht zu eng (venöser Abfluss).<\/li>\n<li><strong>Intubation<\/strong> bei GCS &lt; 9 bzw. fehlenden Schutzreflexen, aber Narkose so führen, dass weder Hypoxie noch Hypotonie entstehen.<\/li>\n<li><strong>Einklemmungszeichen<\/strong> (einseitig weite, lichtstarre Pupille, Strecksynergismen, Cushing): Osmotherapie (Mannitol 20 % 0,5–1 g/kg oder hypertone Kochsalzlösung nach SOP), kurzzeitig Hyperventilation auf etCO₂ 30–35 mmHg als Brücke.<\/li>\n<li><strong>Keine Kortikosteroide.<\/strong> Krampfanfall behandeln (Kapitel 6).<\/li>\n<li><strong>Tranexamsäure beim isolierten SHT<\/strong> präklinisch nicht generell (BTF Prehospital 2023); Nutzen nur bei GCS 9–15 innerhalb von 3 h (CRASH-3).<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Prophylaktische Hyperventilation<\/strong> schadet (zerebrale Vasokonstriktion, Ischämie).<\/li>\n<li><strong>Antikoagulierte und Ältere<\/strong> mit Bagatelltrauma: verzögerte Blutung; immer CT-fähige Klinik.<\/li>\n<li><strong>Betrunken oder SHT?<\/strong> Beides. Vigilanzminderung nicht dem Alkohol zuschreiben, ohne SHT auszuschließen.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  sekundärschäden vermeiden:  hypoxie und hypotonie verdoppeln jeweils die mortalität. schon eine einzelne episode zählt. \n  ziele:  spo₂ > 90 % (besser ≥ 94 %), rr sys ≥ 100–110 mmhg (untergrenze 90 mmhg), normokapnie mit etco₂ 35–40 mmhg (paco₂ liegt im schock deutlich darüber), normoglykämie, normothermie (36–37 °c). rr alle 5–10 min messen. \n  gcs und pupillen  vor analgosedierung dokumentieren, verlauf notieren. \n  lagerung:  30° oberkörper hoch bei stabilem kreislauf, kopf in neutralstellung, hws-orthese nicht zu eng (venöser abfluss). \n  intubation  bei gcs < 9 bzw. fehlenden schutzreflexen, aber narkose so führen, dass weder hypoxie noch hypotonie entstehen. \n  einklemmungszeichen  (einseitig weite, lichtstarre pupille, strecksynergismen, cushing): osmotherapie (mannitol 20 % 0,5–1 g/kg oder hypertone kochsalzlösung nach sop), kurzzeitig hyperventilation auf etco₂ 30–35 mmhg als brücke. \n  keine kortikosteroide.  krampfanfall behandeln (kapitel 6). \n  tranexamsäure beim isolierten sht  präklinisch nicht generell (btf prehospital 2023); nutzen nur bei gcs 9–15 innerhalb von 3 h (crash-3). \n \n \n \n pitfalls \n \n  prophylaktische hyperventilation  schadet (zerebrale vasokonstriktion, ischämie). \n  antikoagulierte und ältere  mit bagatelltrauma: verzögerte blutung; immer ct-fähige klinik. \n  betrunken oder sht?  beides. vigilanzminderung nicht dem alkohol zuschreiben, ohne sht auszuschließen. \n \n  schädel-hirn-trauma"},"ws":{"ch":10,"cht":"Trauma","t":"Wirbelsäule","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Bewusstlose<\/strong> gelten bis zum Beweis des Gegenteils als wirbelsäulenverletzt (S3). HWS vor technischer Rettung stabilisieren, außer bei Sofortrettung (Feuer, Explosionsgefahr).<\/li>\n<li><strong>Wache, kooperative Patienten:<\/strong> klinische Entscheidungsregeln (NEXUS, Canadian C-Spine Rule) erlauben den Verzicht auf Immobilisation. Bewegungseinschränkung bei passendem Mechanismus mit Schmerz, neurologischem Defizit, Intoxikation oder ablenkender Verletzung.<\/li>\n<li><strong>Mit neurologischem Defizit<\/strong> primär in ein geeignetes Traumazentrum (Wirbelsäulenchirurgie).<\/li>\n<li><strong>Hilfsmittel:<\/strong> Schaufeltrage zum Umlagern, Vakuummatratze zum Transport; Spineboard nur als Rettungsmittel. HWS-Orthese nicht reflexhaft bei jedem Patienten, sondern nach Indikation; manuelle Inline-Stabilisierung ist gleichwertig.<\/li>\n<li><strong>Neurogener Schock:<\/strong> Hypotonie mit Bradykardie und warmer Peripherie. Noradrenalin, Atropin bei Bradykardie.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Atemweg geht vor Immobilisation.<\/strong> Eine eng sitzende Orthese erschwert Intubation und Mundöffnung und erhöht den Hirndruck.<\/li>\n<li><strong>Penetrierendes Trauma<\/strong> ohne neurologisches Defizit: keine Immobilisation (verzögert Versorgung ohne Nutzen).<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  bewusstlose  gelten bis zum beweis des gegenteils als wirbelsäulenverletzt (s3). hws vor technischer rettung stabilisieren, außer bei sofortrettung (feuer, explosionsgefahr). \n  wache, kooperative patienten:  klinische entscheidungsregeln (nexus, canadian c-spine rule) erlauben den verzicht auf immobilisation. bewegungseinschränkung bei passendem mechanismus mit schmerz, neurologischem defizit, intoxikation oder ablenkender verletzung. \n  mit neurologischem defizit  primär in ein geeignetes traumazentrum (wirbelsäulenchirurgie). \n  hilfsmittel:  schaufeltrage zum umlagern, vakuummatratze zum transport; spineboard nur als rettungsmittel. hws-orthese nicht reflexhaft bei jedem patienten, sondern nach indikation; manuelle inline-stabilisierung ist gleichwertig. \n  neurogener schock:  hypotonie mit bradykardie und warmer peripherie. noradrenalin, atropin bei bradykardie. \n \n \n \n pitfalls \n \n  atemweg geht vor immobilisation.  eine eng sitzende orthese erschwert intubation und mundöffnung und erhöht den hirndruck. \n  penetrierendes trauma  ohne neurologisches defizit: keine immobilisation (verzögert versorgung ohne nutzen). \n \n  wirbelsäule"},"extrem":{"ch":10,"cht":"Trauma","t":"Extremitäten, Amputation, Crush","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Grobe Fehlstellung mit Durchblutungsstörung:<\/strong> unter Analgesie achsengerecht reponieren und schienen, pDMS vorher und nachher dokumentieren.<\/li>\n<li><strong>Offene Fraktur:<\/strong> Foto, steril abdecken, Schienung. Frühe Antibiose (z. B. Cefazolin 2 g) bei langer Transportzeit nach SOP.<\/li>\n<li><strong>Amputat:<\/strong> trocken-steril in Kompressen, in Plastikbeutel, dieser in einen zweiten Beutel mit Eiswasser. Kein direkter Eiskontakt.<\/li>\n<li><strong>Crush und Einklemmung &gt; 1 h:<\/strong> vor Befreiung Volumen (1–2 l Vollelektrolyt), nach Befreiung Hyperkaliämie und Rhythmusstörungen erwarten (Kapitel 7).<\/li>\n<li><strong>Pfählung:<\/strong> Fremdkörper belassen und fixieren.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  grobe fehlstellung mit durchblutungsstörung:  unter analgesie achsengerecht reponieren und schienen, pdms vorher und nachher dokumentieren. \n  offene fraktur:  foto, steril abdecken, schienung. frühe antibiose (z. b. cefazolin 2 g) bei langer transportzeit nach sop. \n  amputat:  trocken-steril in kompressen, in plastikbeutel, dieser in einen zweiten beutel mit eiswasser. kein direkter eiskontakt. \n  crush und einklemmung > 1 h:  vor befreiung volumen (1–2 l vollelektrolyt), nach befreiung hyperkaliämie und rhythmusstörungen erwarten (kapitel 7). \n  pfählung:  fremdkörper belassen und fixieren. \n \n  extremitäten, amputation, crush"},"bes-pat":{"ch":10,"cht":"Trauma","t":"Besondere Patienten","html":"<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Ältere:<\/strong> niedrige Energie reicht für schwere Verletzungen, Betablocker maskieren den Schock, normaler RR kann für sie Hypotonie bedeuten. Antikoagulation erfragen.<\/li>\n<li><strong>Kinder:<\/strong> kompensieren lange, dann abrupter Kreislaufeinbruch. Hypotonie ist ein Spätzeichen.<\/li>\n<li><strong>Schwangere:<\/strong> ab etwa 20. SSW Uterus nach links verlagern bzw. linksseitig kippen. Bis 30–35 % Blutverlust ohne Vitalzeichenänderung möglich; der Fetus leidet zuerst.<\/li>\n<\/ul>\n<\/div>","text":" \n pitfalls \n \n  ältere:  niedrige energie reicht für schwere verletzungen, betablocker maskieren den schock, normaler rr kann für sie hypotonie bedeuten. antikoagulation erfragen. \n  kinder:  kompensieren lange, dann abrupter kreislaufeinbruch. hypotonie ist ein spätzeichen. \n  schwangere:  ab etwa 20. ssw uterus nach links verlagern bzw. linksseitig kippen. bis 30–35 % blutverlust ohne vitalzeichenänderung möglich; der fetus leidet zuerst. \n \n  besondere patienten"},"schockraum":{"ch":10,"cht":"Trauma","t":"Schockraum-Kriterien (S3 2022)","html":"<table>\n<thead>\n<tr>\n<th>Kategorie<\/th>\n<th>Kriterien<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Vitalparameter (A)<\/td>\n<td>SpO₂ &lt; 90 %, AF &lt; 10 oder &gt; 29/min, RR sys &lt; 90 mmHg, HF &gt; 120/min, Schockindex &gt; 0,9, GCS ≤ 12, Kerntemperatur &lt; 35 °C, positiver eFAST, Atemwegssicherung nötig<\/td>\n<\/tr>\n<tr>\n<td>Präklinische Maßnahmen (A)<\/td>\n<td>Atemwegssicherung, Thoraxentlastung, Perikardpunktion, Katecholamine, Tourniquet<\/td>\n<\/tr>\n<tr>\n<td>Verletzungen (A)<\/td>\n<td>instabiler Thorax, mechanisch instabiles Becken, penetrierend Rumpf oder Hals, sensomotorisches Defizit nach Wirbelsäulenverletzung, Amputation proximal Hand oder Fuß<\/td>\n<\/tr>\n<tr>\n<td>Verletzungen (B)<\/td>\n<td>Fraktur von ≥ 2 großen Röhrenknochen, Verbrennung &gt; 20 % und Grad ≥ 2b<\/td>\n<\/tr>\n<tr>\n<td>Mechanismus (B)<\/td>\n<td>Sturz &gt; 3 m, Ejektion aus dem Fahrzeug, Verkehrsunfall mit Fraktur eines langen Röhrenknochens<\/td>\n<\/tr>\n<tr>\n<td>Geriatrisch (≥ 80 J oder ≥ 70 J mit Multimorbidität)<\/td>\n<td>RR sys &lt; 100 mmHg, SHT mit GCS ≤ 14, ≥ 2 verletzte Körperregionen<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Tod eines Insassen, Geschwindigkeitsänderung, Fußgänger- oder Zweiradkollision und Einklemmung sind 2022 als alleinige Kriterien entfallen. Regionale Aktivierungskriterien des TraumaNetzwerks und der Zielklinik haben Vorrang.<\/p>","text":" \n \n \n kategorie \n kriterien \n \n \n \n \n vitalparameter (a) \n spo₂ < 90 %, af < 10 oder > 29/min, rr sys < 90 mmhg, hf > 120/min, schockindex > 0,9, gcs ≤ 12, kerntemperatur < 35 °c, positiver efast, atemwegssicherung nötig \n \n \n präklinische maßnahmen (a) \n atemwegssicherung, thoraxentlastung, perikardpunktion, katecholamine, tourniquet \n \n \n verletzungen (a) \n instabiler thorax, mechanisch instabiles becken, penetrierend rumpf oder hals, sensomotorisches defizit nach wirbelsäulenverletzung, amputation proximal hand oder fuß \n \n \n verletzungen (b) \n fraktur von ≥ 2 großen röhrenknochen, verbrennung > 20 % und grad ≥ 2b \n \n \n mechanismus (b) \n sturz > 3 m, ejektion aus dem fahrzeug, verkehrsunfall mit fraktur eines langen röhrenknochens \n \n \n geriatrisch (≥ 80 j oder ≥ 70 j mit multimorbidität) \n rr sys < 100 mmhg, sht mit gcs ≤ 14, ≥ 2 verletzte körperregionen \n \n \n \n tod eines insassen, geschwindigkeitsänderung, fußgänger- oder zweiradkollision und einklemmung sind 2022 als alleinige kriterien entfallen. regionale aktivierungskriterien des traumanetzwerks und der zielklinik haben vorrang.  schockraum-kriterien (s3 2022)"},"verbrennung":{"ch":11,"cht":"Verbrennung, Kälte, Hitze, Strom, Wasser","t":"Verbrennung","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Eigenschutz, Brand stoppen<\/strong>, Kleidung und Schmuck entfernen (eingebrannte Kleidung belassen).<\/li>\n<li><strong>Kühlen<\/strong> nur kurz und nur bei kleinflächigen Verbrennungen mit handwarmem Wasser. <strong>Keine Kühlung bei &gt; 10 % KOF<\/strong> (S2k), ebenso nicht bei Bewusstlosigkeit und Narkose: <strong>Wärmeerhalt<\/strong> hat Vorrang, Ziel Körperkerntemperatur &gt; 36 °C.<\/li>\n<li><strong>Ausdehnung:<\/strong> Neunerregel (Erwachsene), Handfläche des Patienten inklusive Finger ≈ 1 % KOF. <strong>Erythem (I°) nicht mitzählen.<\/strong><\/li>\n<li><strong>Abdecken:<\/strong> trocken, steril, Metallinefolie, Rettungsdecke; keine Hausmittel, keine Salben.<\/li>\n<li><strong>Analgesie:<\/strong> Esketamin plus Opioid. Zwei großlumige Zugänge möglichst durch unverbrannte Haut, sonst früh i.o.<\/li>\n<li><strong>Zielklinik:<\/strong> Brandverletztenzentrum bei Erfüllung der Kriterien (unten); Bettenvermittlung über die <strong>Zentrale Anlaufstelle für Schwerbrandverletzte bei der Feuerwehr Hamburg, Tel. 040 42851-4950<\/strong>. Polytrauma geht vor: zuerst Traumazentrum.<\/li>\n<\/ul>\n<\/div>\n<table>\n<thead>\n<tr>\n<th>Neunerregel (Erwachsene)<\/th>\n<th>% KOF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kopf und Hals<\/td>\n<td>9<\/td>\n<\/tr>\n<tr>\n<td>Arm (je)<\/td>\n<td>9<\/td>\n<\/tr>\n<tr>\n<td>Rumpf vorn<\/td>\n<td>18<\/td>\n<\/tr>\n<tr>\n<td>Rumpf hinten<\/td>\n<td>18<\/td>\n<\/tr>\n<tr>\n<td>Bein (je)<\/td>\n<td>18<\/td>\n<\/tr>\n<tr>\n<td>Genitalregion<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td><strong>Kinder:<\/strong> Kopf größer (Säugling etwa 18 %), Beine kleiner (etwa 14 %); je Lebensjahr Kopf −1 %, Beine +0,5 %<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>Grad<\/th>\n<th>Befund<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>I°<\/td>\n<td>Rötung, schmerzhaft, keine Blasen; zählt nicht zur KOF<\/td>\n<\/tr>\n<tr>\n<td>IIa<\/td>\n<td>Blasen, feuchter rosa Grund, sehr schmerzhaft, Rekapillarisierung erhalten<\/td>\n<\/tr>\n<tr>\n<td>IIb<\/td>\n<td>Blasen, blasser Grund, weniger schmerzhaft, Rekapillarisierung verzögert<\/td>\n<\/tr>\n<tr>\n<td>III°<\/td>\n<td>weiß bis lederartig, trocken, schmerzlos<\/td>\n<\/tr>\n<tr>\n<td>IV°<\/td>\n<td>Verkohlung, Muskel und Knochen betroffen<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Kriterien für ein Brandverletztenzentrum (DGV)<\/div>\n<ul>\n<li>II° ≥ 10 % KOF, jede III°-Verbrennung, Gesicht, Hände, Füße, Genitalien, große Gelenke<\/li>\n<li>Inhalationstrauma (nach Explosionen annehmen), Strom- und Blitzunfall, Verätzung<\/li>\n<li>relevante Begleitverletzungen oder Vorerkrankungen, besondere psychische oder pflegerische Situation<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Inhalationstrauma und Atemweg<\/div>\n<ul>\n<li><strong>Hinweise:<\/strong> Brand in geschlossenem Raum, Ruß in Mund und Nase, versengte Nasenhaare, Heiserkeit, Stridor, Gesichtsverbrennung, rußiges Sputum.<\/li>\n<li><strong>Intubation<\/strong> bei inspiratorischem Stridor, zunehmender Heiserkeit, Schluckstörung, Verbrennungen in Mund oder Larynx, zirkulären Halsverbrennungen, Bewusstseinsstörung. Taktisch frühe Intubation (lange Transportzeit) kann erwogen werden. Tubus ≥ 7,5 (Bronchoskopie), sicher fixieren (Schwellung). Oberkörper 20–45° hoch.<\/li>\n<li><strong>Große Fläche allein ist keine Intubationsindikation<\/strong> (S2k). Keine prophylaktische Intubation ohne Kriterien: Unnötige Beatmungen sind häufig.<\/li>\n<li><strong>CO und Cyanid<\/strong> mitdenken (Kapitel 8).<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-dosis\">\n<div class=\"box-label\">Medikamente &amp; Dosis<\/div>\n<table>\n<thead>\n<tr>\n<th>Thema<\/th>\n<th>Orientierung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Volumen Erwachsene<\/td>\n<td>balancierte, gewärmte Vollelektrolytlösung, <strong>etwa 1000 ml in den ersten 2 h<\/strong> nach Trauma; keine Formelberechnung präklinisch (S2k)<\/td>\n<\/tr>\n<tr>\n<td>Volumen Kinder<\/td>\n<td>initial <strong>max. 10 ml/kg/h<\/strong> (S2k thermische Verletzungen im Kindesalter 2024)<\/td>\n<\/tr>\n<tr>\n<td>Kühlen bei Kindern<\/td>\n<td>nur Extremitäten, ≤ 10 min; nicht bei &gt; 15 % KOF, nicht bei Säuglingen und Neugeborenen, nicht beim intubierten Kind<\/td>\n<\/tr>\n<tr>\n<td>Hypotonie trotz Volumen<\/td>\n<td>Noradrenalin; an Blutung, CO, Cyanid denken<\/td>\n<\/tr>\n<tr>\n<td>Formel für die Klinik<\/td>\n<td>Parkland 4 ml × kg × % KOF in 24 h, Hälfte in den ersten 8 h (ab Unfallzeit)<\/td>\n<\/tr>\n<tr>\n<td>Succinylcholin<\/td>\n<td>in den ersten 24 h unproblematisch, danach kontraindiziert<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Überschätzung der Fläche<\/strong> (Erythem mitgezählt) führt zu Überinfusion: Ödeme, Kompartment, Atemweg.<\/li>\n<li><strong>Hypothermie<\/strong> bei Kühlung oder offener Lagerung, besonders bei Kindern.<\/li>\n<li><strong>Chemische Verbrennung:<\/strong> Pulver abbürsten, dann mindestens 30 min spülen (Diphoterine, wenn vorhanden). Flusssäure: Kalziumglukonat-Gel, Hypokalzämie mit Rhythmusstörungen.<\/li>\n<li><strong>Verbrühung bei Kleinkindern<\/strong> mit scharfen Grenzen, symmetrisch an Händen, Füßen oder Gesäß: an Kindesmisshandlung denken, dokumentie
