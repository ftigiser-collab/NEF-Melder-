ren, Klinik informieren.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  eigenschutz, brand stoppen , kleidung und schmuck entfernen (eingebrannte kleidung belassen). \n  kühlen  nur kurz und nur bei kleinflächigen verbrennungen mit handwarmem wasser.  keine kühlung bei > 10 % kof  (s2k), ebenso nicht bei bewusstlosigkeit und narkose:  wärmeerhalt  hat vorrang, ziel körperkerntemperatur > 36 °c. \n  ausdehnung:  neunerregel (erwachsene), handfläche des patienten inklusive finger ≈ 1 % kof.  erythem (i°) nicht mitzählen.  \n  abdecken:  trocken, steril, metallinefolie, rettungsdecke; keine hausmittel, keine salben. \n  analgesie:  esketamin plus opioid. zwei großlumige zugänge möglichst durch unverbrannte haut, sonst früh i.o. \n  zielklinik:  brandverletztenzentrum bei erfüllung der kriterien (unten); bettenvermittlung über die  zentrale anlaufstelle für schwerbrandverletzte bei der feuerwehr hamburg, tel. 040 42851-4950 . polytrauma geht vor: zuerst traumazentrum. \n \n \n \n \n \n neunerregel (erwachsene) \n % kof \n \n \n \n \n kopf und hals \n 9 \n \n \n arm (je) \n 9 \n \n \n rumpf vorn \n 18 \n \n \n rumpf hinten \n 18 \n \n \n bein (je) \n 18 \n \n \n genitalregion \n 1 \n \n \n  kinder:  kopf größer (säugling etwa 18 %), beine kleiner (etwa 14 %); je lebensjahr kopf −1 %, beine +0,5 % \n  \n \n \n \n \n \n \n grad \n befund \n \n \n \n \n i° \n rötung, schmerzhaft, keine blasen; zählt nicht zur kof \n \n \n iia \n blasen, feuchter rosa grund, sehr schmerzhaft, rekapillarisierung erhalten \n \n \n iib \n blasen, blasser grund, weniger schmerzhaft, rekapillarisierung verzögert \n \n \n iii° \n weiß bis lederartig, trocken, schmerzlos \n \n \n iv° \n verkohlung, muskel und knochen betroffen \n \n \n \n \n kriterien für ein brandverletztenzentrum (dgv) \n \n ii° ≥ 10 % kof, jede iii°-verbrennung, gesicht, hände, füße, genitalien, große gelenke \n inhalationstrauma (nach explosionen annehmen), strom- und blitzunfall, verätzung \n relevante begleitverletzungen oder vorerkrankungen, besondere psychische oder pflegerische situation \n \n \n \n inhalationstrauma und atemweg \n \n  hinweise:  brand in geschlossenem raum, ruß in mund und nase, versengte nasenhaare, heiserkeit, stridor, gesichtsverbrennung, rußiges sputum. \n  intubation  bei inspiratorischem stridor, zunehmender heiserkeit, schluckstörung, verbrennungen in mund oder larynx, zirkulären halsverbrennungen, bewusstseinsstörung. taktisch frühe intubation (lange transportzeit) kann erwogen werden. tubus ≥ 7,5 (bronchoskopie), sicher fixieren (schwellung). oberkörper 20–45° hoch. \n  große fläche allein ist keine intubationsindikation  (s2k). keine prophylaktische intubation ohne kriterien: unnötige beatmungen sind häufig. \n  co und cyanid  mitdenken (kapitel 8). \n \n \n \n medikamente & dosis \n \n \n \n thema \n orientierung \n \n \n \n \n volumen erwachsene \n balancierte, gewärmte vollelektrolytlösung,  etwa 1000 ml in den ersten 2 h  nach trauma; keine formelberechnung präklinisch (s2k) \n \n \n volumen kinder \n initial  max. 10 ml/kg/h  (s2k thermische verletzungen im kindesalter 2024) \n \n \n kühlen bei kindern \n nur extremitäten, ≤ 10 min; nicht bei > 15 % kof, nicht bei säuglingen und neugeborenen, nicht beim intubierten kind \n \n \n hypotonie trotz volumen \n noradrenalin; an blutung, co, cyanid denken \n \n \n formel für die klinik \n parkland 4 ml × kg × % kof in 24 h, hälfte in den ersten 8 h (ab unfallzeit) \n \n \n succinylcholin \n in den ersten 24 h unproblematisch, danach kontraindiziert \n \n \n \n \n \n pitfalls \n \n  überschätzung der fläche  (erythem mitgezählt) führt zu überinfusion: ödeme, kompartment, atemweg. \n  hypothermie  bei kühlung oder offener lagerung, besonders bei kindern. \n  chemische verbrennung:  pulver abbürsten, dann mindestens 30 min spülen (diphoterine, wenn vorhanden). flusssäure: kalziumglukonat-gel, hypokalzämie mit rhythmusstörungen. \n  verbrühung bei kleinkindern  mit scharfen grenzen, symmetrisch an händen, füßen oder gesäß: an kindesmisshandlung denken, dokumentieren, klinik informieren. \n \n  verbrennung"},"hypotherm":{"ch":11,"cht":"Verbrennung, Kälte, Hitze, Strom, Wasser","t":"Akzidentelle Hypothermie","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Messen:<\/strong> epitympanal mit Thermistor oder ösophageal beim Intubierten. Infrarot-Ohrthermometer sind unzuverlässig.<\/li>\n<li><strong>Schweizer Stadien:<\/strong> I wach (35–32 °C), II Bewusstsein getrübt (&lt; 32–28 °C), III bewusstlos mit Vitalzeichen (&lt; 28 °C), IV keine Vitalzeichen. Ohne Thermometer nach Bewusstsein einteilen; das Risiko für einen Kreislaufstillstand steigt mit der Bewusstseinsminderung.<\/li>\n<li><strong>Horizontal lagern, schonend bewegen<\/strong> (Bergungstod durch Kammerflimmern), nasse Kleidung aufschneiden, mehrlagige Isolation mit Dampfsperre, aktive Wärme am Rumpf (Wärmepacks, Wärmedecke).<\/li>\n<li><strong>Warme Infusionen<\/strong> (38–42 °C), BZ messen.<\/li>\n<li><strong>Instabil (ERC 2025):<\/strong> HF &lt; 45/min, RR sys &lt; 90 mmHg, ventrikuläre Rhythmusstörung oder Kerntemperatur &lt; 30 °C → Klinik mit ECLS-Option bzw. frühe Rücksprache mit dem ECLS-Zentrum.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Afterdrop:<\/strong> Abfall der Kerntemperatur nach Rettung durch Rückstrom kalten Blutes aus der Peripherie. Extremitäten nicht reiben, nicht aktiv bewegen lassen.<\/li>\n<li><strong>Hypothermie maskiert Verletzungen und Intoxikationen<\/strong> (und umgekehrt).<\/li>\n<li><strong>Bradykardie und Vorhofflimmern<\/strong> sind physiologisch, nicht behandeln.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  messen:  epitympanal mit thermistor oder ösophageal beim intubierten. infrarot-ohrthermometer sind unzuverlässig. \n  schweizer stadien:  i wach (35–32 °c), ii bewusstsein getrübt (< 32–28 °c), iii bewusstlos mit vitalzeichen (< 28 °c), iv keine vitalzeichen. ohne thermometer nach bewusstsein einteilen; das risiko für einen kreislaufstillstand steigt mit der bewusstseinsminderung. \n  horizontal lagern, schonend bewegen  (bergungstod durch kammerflimmern), nasse kleidung aufschneiden, mehrlagige isolation mit dampfsperre, aktive wärme am rumpf (wärmepacks, wärmedecke). \n  warme infusionen  (38–42 °c), bz messen. \n  instabil (erc 2025):  hf < 45/min, rr sys < 90 mmhg, ventrikuläre rhythmusstörung oder kerntemperatur < 30 °c → klinik mit ecls-option bzw. frühe rücksprache mit dem ecls-zentrum. \n \n \n \n pitfalls \n \n  afterdrop:  abfall der kerntemperatur nach rettung durch rückstrom kalten blutes aus der peripherie. extremitäten nicht reiben, nicht aktiv bewegen lassen. \n  hypothermie maskiert verletzungen und intoxikationen  (und umgekehrt). \n  bradykardie und vorhofflimmern  sind physiologisch, nicht behandeln. \n \n  akzidentelle hypothermie"},"hitze":{"ch":11,"cht":"Verbrennung, Kälte, Hitze, Strom, Wasser","t":"Hitzschlag","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Definition:<\/strong> Kerntemperatur &gt; 40 °C plus ZNS-Störung (Verwirrtheit, Krampfanfall, Koma). Klassisch bei Älteren in Hitzewellen, belastungsinduziert bei Sportlern und Arbeitern.<\/li>\n<li><strong>Erst kühlen, dann transportieren:<\/strong> Kalt- oder Eiswasserimmersion bis zum Hals ist am effektivsten (0,2–0,35 °C/min); alternativ Eiswasser-Tücher am ganzen Körper wechseln, Befeuchten plus Ventilator. <strong>Ziel &lt; 39 °C, idealerweise 38,0–38,5 °C innerhalb von etwa 30 min<\/strong>, dann stoppen (ERC 2025).<\/li>\n<li><strong>Benzodiazepine<\/strong> gegen Kältezittern und Agitation; Volumen; BZ.<\/li>\n<li><strong>Antipyretika wirken nicht.<\/strong><\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Differenzialdiagnosen:<\/strong> Sepsis, Stimulanzien, Serotoninsyndrom, anticholinerges Syndrom, malignes neuroleptisches Syndrom, Thyreotoxikose.<\/li>\n<li><strong>Kühlung verzögern, um zu transportieren<\/strong>, kostet Leben; jede Minute über 40 °C zählt.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  definition:  kerntemperatur > 40 °c plus zns-störung (verwirrtheit, krampfanfall, koma). klassisch bei älteren in hitzewellen, belastungsinduziert bei sportlern und arbeitern. \n  erst kühlen, dann transportieren:  kalt- oder eiswasserimmersion bis zum hals ist am effektivsten (0,2–0,35 °c/min); alternativ eiswasser-tücher am ganzen körper wechseln, befeuchten plus ventilator.  ziel < 39 °c, idealerweise 38,0–38,5 °c innerhalb von etwa 30 min , dann stoppen (erc 2025). \n  benzodiazepine  gegen kältezittern und agitation; volumen; bz. \n  antipyretika wirken nicht.  \n \n \n \n pitfalls \n \n  differenzialdiagnosen:  sepsis, stimulanzien, serotoninsyndrom, anticholinerges syndrom, malignes neuroleptisches syndrom, thyreotoxikose. \n  kühlung verzögern, um zu transportieren , kostet leben; jede minute über 40 °c zählt. \n \n  hitzschlag"},"strom":{"ch":11,"cht":"Verbrennung, Kälte, Hitze, Strom, Wasser","t":"Strom- und Blitzunfall","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Eigenschutz:<\/strong> Freischalten durch Fachpersonal, Hochspannung &gt; 1000 V Abstand mindestens 5 m bis zur Freigabe.<\/li>\n<li><strong>Niederspannung:<\/strong> EKG. Ohne Bewusstlosigkeit, ohne Rhythmusstörung, ohne relevante Verletzung und mit normalem EKG ist eine Entlassung vor Ort bzw. aus der Notaufnahme vertretbar.<\/li>\n<li><strong>Hochspannung und Blitz:<\/strong> innere Verbrennungen weit größer als die Strommarken, Rhabdomyolyse, Kompartment, Monitoring. Brandverletztenzentrum.<\/li>\n<li><strong>Blitzunfall mit mehreren Opfern:<\/strong> umgekehrte Triage, zuerst die scheinbar Toten reanimieren (Atemstillstand bei erhaltener Herzaktion möglich).<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  eigenschutz:  freischalten durch fachpersonal, hochspannung > 1000 v abstand mindestens 5 m bis zur freigabe. \n  niederspannung:  ekg. ohne bewusstlosigkeit, ohne rhythmusstörung, ohne relevante verletzung und mit normalem ekg ist eine entlassung vor ort bzw. aus der notaufnahme vertretbar. \n  hochspannung und blitz:  innere verbrennungen weit größer als die strommarken, rhabdomyolyse, kompartment, monitoring. brandverletztenzentrum. \n  blitzunfall mit mehreren opfern:  umgekehrte triage, zuerst die scheinbar toten reanimieren (atemstillstand bei erhaltener herzaktion möglich). \n \n  strom- und blitzunfall"},"ertrinken":{"ch":11,"cht":"Verbrennung, Kälte, Hitze, Strom, Wasser","t":"Ertrinkungsunfall","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Hypoxie ist das Problem.<\/strong> O₂ hoch dosiert, früh CPAP oder NIV bei Dyspnoe und Hypoxämie.<\/li>\n<li><strong>HWS-Immobilisation<\/strong> nur bei Sprung in flaches Wasser oder anderem passenden Mechanismus.<\/li>\n<li><strong>Jeder symptomatische Patient<\/strong> (Husten, Dyspnoe, Hypoxämie, Auskultationsbefund) in die Klinik: verzögertes Lungenödem bis 6–8 h.<\/li>\n<li><strong>Hypothermie<\/strong> mitbehandeln.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  hypoxie ist das problem.  o₂ hoch dosiert, früh cpap oder niv bei dyspnoe und hypoxämie. \n  hws-immobilisation  nur bei sprung in flaches wasser oder anderem passenden mechanismus. \n  jeder symptomatische patient  (husten, dyspnoe, hypoxämie, auskultationsbefund) in die klinik: verzögertes lungenödem bis 6–8 h. \n  hypothermie  mitbehandeln. \n \n  ertrinkungsunfall"},"tauch":{"ch":11,"cht":"Verbrennung, Kälte, Hitze, Strom, Wasser","t":"Tauchunfall","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Dekompressionsunfall oder arterielle Gasembolie:<\/strong> neurologische Ausfälle, Hautveränderungen, Gelenkschmerz, Atemnot nach dem Tauchgang.<\/li>\n<li><strong>100 % O₂ unabhängig von der SpO₂<\/strong> (Demand-Ventil oder Reservoirmaske 15 l/min), flach lagern, Flüssigkeit (oral 0,5–1 l/h, wenn wach, sonst Vollelektrolyt i.v.).<\/li>\n<li><strong>Druckkammer früh organisieren<\/strong>, Tauchcomputer und Tauchpartner mitnehmen, Taucherarzt-Hotline nutzen.<\/li>\n<li><strong>Hubschraubertransport<\/strong> in niedriger Flughöhe.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  dekompressionsunfall oder arterielle gasembolie:  neurologische ausfälle, hautveränderungen, gelenkschmerz, atemnot nach dem tauchgang. \n  100 % o₂ unabhängig von der spo₂  (demand-ventil oder reservoirmaske 15 l/min), flach lagern, flüssigkeit (oral 0,5–1 l/h, wenn wach, sonst vollelektrolyt i.v.). \n  druckkammer früh organisieren , tauchcomputer und tauchpartner mitnehmen, taucherarzt-hotline nutzen. \n  hubschraubertransport  in niedriger flughöhe. \n \n  tauchunfall"},"kind-grund":{"ch":12,"cht":"Kindernotfälle","t":"Grundlagen","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Gewicht:<\/strong> Angabe der Eltern oder Längenband (Notfalllineal), an den Körperbau angepasst; grobe Faustformel 1–10 J: (Alter + 4) × 2 kg.<\/li>\n<li><strong>Dosierfehler um den Faktor 10<\/strong> sind der klassische Kindernotfall-Fehler. Dosis laut ansagen, zweite Person rechnet gegen, Hilfsmittel (Lineal, App, Tabelle) nutzen.<\/li>\n<li><strong>Pädiatrisches Beurteilungsdreieck<\/strong> in den ersten Sekunden: Aussehen (Tonus, Interaktion, Blick, Sprache oder Schrei), Atemarbeit, Hautfarbe.<\/li>\n<li><strong>Eltern sind Ressource:<\/strong> Kind auf dem Arm oder Schoß untersuchen, Eltern beim Transport mitnehmen.<\/li>\n<li><strong>Hypotonie ist ein Spätzeichen.<\/strong> Tachykardie, verlängerte Rekapillarisierung (&gt; 2 s) und Bewusstseinsänderung kommen vorher.<\/li>\n<\/ul>\n<\/div>\n<table>\n<thead>\n<tr>\n<th>Alter<\/th>\n<th>HF/min<\/th>\n<th>AF/min<\/th>\n<th>RR sys min.<\/th>\n<th>Tubus ID (gecufft)<\/th>\n nkel, alle 5 min<\/td>\n<\/tr>\n<tr>\n<td>Salbutamol vernebelt<\/td>\n<td>&lt; 5 J 2,5 mg; ≥ 5 J 2,5–5 mg<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Prednisolon<\/td>\n<td>1–2 mg/kg i.v./p.o. (max. 40 mg)<\/td>\n<td>Asthma; alternativ Dexamethason 0,3–0,6 mg/kg (max. 16 mg)<\/td>\n<\/tr>\n<tr>\n<td>Magnesiumsulfat<\/td>\n<td>40 mg/kg über 20 min<\/td>\n<td>max. 2 g<\/td>\n<\/tr>\n<tr>\n<td>Dexamethason p.o.<\/td>\n<td>0,15 mg/kg<\/td>\n<td>Pseudokrupp<\/td>\n<\/tr>\n<tr>\n<td>Glukose 10 %<\/td>\n<td>2 ml/kg (0,2 g/kg)<\/td>\n<td>Hypoglykämie<\/td>\n<\/tr>\n<tr>\n<td>Glukagon<\/td>\n<td>0,03 mg/kg i.m. (&lt; 25 kg 0,5 mg, &gt; 25 kg 1 mg)<\/td>\n<td>nasal 3 mg<\/td>\n<\/tr>\n<tr>\n<td>Volumenbolus<\/td>\n<td>10 ml/kg Vollelektrolyt, kardiogener Schock 5 ml/kg<\/td>\n<td>nach 3–4 Boli Noradrenalin<\/td>\n<\/tr>\n<tr>\n<td>Tranexamsäure<\/td>\n<td>15 mg/kg<\/td>\n<td>max. 1 g<\/td>\n<\/tr>\n<tr>\n<td>Ceftriaxon<\/td>\n<td>100 mg/kg<\/td>\n<td>max. 4 g<\/td>\n<\/tr>\n<tr>\n<td>Naloxon<\/td>\n<td>0,01 mg/kg i.v., titriert<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Ondansetron<\/td>\n<td>0,1 mg/kg i.v.<\/td>\n<td>max. 4 mg<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>","text":" \n vorgehen \n \n  gewicht:  angabe der eltern oder längenband (notfalllineal), an den körperbau angepasst; grobe faustformel 1–10 j: (alter + 4) × 2 kg. \n  dosierfehler um den faktor 10  sind der klassische kindernotfall-fehler. dosis laut ansagen, zweite person rechnet gegen, hilfsmittel (lineal, app, tabelle) nutzen. \n  pädiatrisches beurteilungsdreieck  in den ersten sekunden: aussehen (tonus, interaktion, blick, sprache oder schrei), atemarbeit, hautfarbe. \n  eltern sind ressource:  kind auf dem arm oder schoß untersuchen, eltern beim transport mitnehmen. \n  hypotonie ist ein spätzeichen.  tachykardie, verlängerte rekapillarisierung (> 2 s) und bewusstseinsänderung kommen vorher. \n \n \n \n \n \n alter \n hf/min \n af/min \n rr sys min. \n tubus id (gecufft) \n \n \n \n \n neugeborenes \n 110–160 \n 40–60 \n 60 \n 3,0 \n \n \n 1 j \n 100–150 \n 30–40 \n 70 \n 3,5 \n \n \n 2–5 j \n 90–140 \n 20–30 \n 70 + 2 × alter \n alter/4 + 3,5 \n \n \n 6–12 j \n 70–120 \n 18–25 \n 70 + 2 × alter \n alter/4 + 3,5 \n \n \n > 12 j \n 60–100 \n 12–20 \n 90 \n 6,5–7,5 \n \n \n \n \n medikamente & dosis \n \n \n \n substanz \n dosis \n max. / hinweis \n \n \n \n \n fentanyl i.n. \n 1,5–2 µg/kg \n off-label; max. 50 µg je gabe initial, max. 1 ml je nasenloch \n \n \n esketamin i.n. \n 1–2 mg/kg \n analgetisch, off-label (s2k verbrennung kinder: 2 mg/kg) \n \n \n esketamin i.v. \n 0,25–0,5 mg/kg analgetisch; 1–2 mg/kg einleitung \n  \n \n \n paracetamol i.v. \n 15 mg/kg; ≤ 10 kg 7,5 mg/kg \n säuglinge nicht doppelt dosieren \n \n \n ibuprofen \n 10 mg/kg p.o. \n ab 6 monaten \n \n \n metamizol \n 10–15 mg/kg i.v. \n langsam; erst ab 3 monaten bzw. 5 kg \n \n \n midazolam bukkal \n 3–11 mon. 2,5 mg; 1–4 j 5 mg; 5–9 j 7,5 mg; ≥ 10 j 10 mg \n fertigspritze; 3–6 mon. nur in der klinik \n \n \n midazolam i.n. \n 0,2 mg/kg \n max. 10 mg, off-label \n \n \n levetiracetam \n 40–60 mg/kg über 5 min \n max. 4,5 g; bevorzugte zweite stufe (pls 2025) \n \n \n adrenalin i.m. (anaphylaxie) \n 0,01 mg/kg; 1–5 j 0,15 mg; 6–12 j 0,3 mg; > 12 j 0,5 mg \n oberschenkel, alle 5 min \n \n \n salbutamol vernebelt \n < 5 j 2,5 mg; ≥ 5 j 2,5–5 mg \n  \n \n \n prednisolon \n 1–2 mg/kg i.v./p.o. (max. 40 mg) \n asthma; alternativ dexamethason 0,3–0,6 mg/kg (max. 16 mg) \n \n \n magnesiumsulfat \n 40 mg/kg über 20 min \n max. 2 g \n \n \n dexamethason p.o. \n 0,15 mg/kg \n pseudokrupp \n \n \n glukose 10 % \n 2 ml/kg (0,2 g/kg) \n hypoglykämie \n \n \n glukagon \n 0,03 mg/kg i.m. (< 25 kg 0,5 mg, > 25 kg 1 mg) \n nasal 3 mg \n \n \n volumenbolus \n 10 ml/kg vollelektrolyt, kardiogener schock 5 ml/kg \n nach 3–4 boli noradrenalin \n \n \n tranexamsäure \n 15 mg/kg \n max. 1 g \n \n \n ceftriaxon \n 100 mg/kg \n max. 4 g \n \n \n naloxon \n 0,01 mg/kg i.v., titriert \n  \n \n \n ondansetron \n 0,1 mg/kg i.v. \n max. 4 mg \n \n \n \n  grundlagen"},"krupp":{"ch":12,"cht":"Kindernotfälle","t":"Pseudokrupp","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Klinik:<\/strong> bellender Husten, inspiratorischer Stridor, Heiserkeit, meist nachts, 6 Monate bis 6 Jahre, oft nach Infekt.<\/li>\n<li><strong>Kind beruhigen<\/strong>, auf dem Schoß der Eltern lassen, keine Racheninspektion mit Spatel erzwingen.<\/li>\n<li><strong>Steroid für jedes Kind mit Krupp:<\/strong> Dexamethason 0,15 mg/kg p.o. (InfectoDexaKrupp 2 mg/5 ml: 0,4 ml/kg) oder Prednison 100 mg rektal (Rectodelt; einmal wiederholbar, max. 200 mg).<\/li>\n<li><strong>Mittelschwer bis schwer<\/strong> (Stridor in Ruhe, Einziehungen, Unruhe): zusätzlich <strong>Adrenalin vernebelt<\/strong>, z. B. InfectoKrupp Inhal (4 mg/ml) 7–14 Hübe (≈ 4–8 mg) über den Vernebler ab 6 Monaten, alternativ Adrenalin 1 mg/ml unverdünnt 2–5 ml. Wirkung nach 10–30 min, hält etwa 2 h; danach Überwachung (Rebound).<\/li>\n<li>O₂ vorgewärmt-angefeuchtet, wenn toleriert. Kalte Luft hat keine belegte Wirkung, schadet aber nicht.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-rf\">\n<div class=\"box-label\">Red Flags<\/div>\n<ul>\n<li><strong>Epiglottitis und bakterielle Tracheitis:<\/strong> toxisch, hohes Fieber, Speichelfluss, kloßige Sprache, sitzende Haltung nach vorn, kaum Husten. Keine Manipulation, O₂ vorhalten, Transport in Begleitung, Klinik mit Anästhesie und HNO vorwarnen.<\/li>\n<li><strong>Fremdkörper:<\/strong> plötzlicher Beginn beim Spielen oder Essen ohne Infekt.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  klinik:  bellender husten, inspiratorischer stridor, heiserkeit, meist nachts, 6 monate bis 6 jahre, oft nach infekt. \n  kind beruhigen , auf dem schoß der eltern lassen, keine racheninspektion mit spatel erzwingen. \n  steroid für jedes kind mit krupp:  dexamethason 0,15 mg/kg p.o. (infectodexakrupp 2 mg/5 ml: 0,4 ml/kg) oder prednison 100 mg rektal (rectodelt; einmal wiederholbar, max. 200 mg). \n  mittelschwer bis schwer  (stridor in ruhe, einziehungen, unruhe): zusätzlich  adrenalin vernebelt , z. b. infectokrupp inhal (4 mg/ml) 7–14 hübe (≈ 4–8 mg) über den vernebler ab 6 monaten, alternativ adrenalin 1 mg/ml unverdünnt 2–5 ml. wirkung nach 10–30 min, hält etwa 2 h; danach überwachung (rebound). \n o₂ vorgewärmt-angefeuchtet, wenn toleriert. kalte luft hat keine belegte wirkung, schadet aber nicht. \n \n \n \n red flags \n \n  epiglottitis und bakterielle tracheitis:  toxisch, hohes fieber, speichelfluss, kloßige sprache, sitzende haltung nach vorn, kaum husten. keine manipulation, o₂ vorhalten, transport in begleitung, klinik mit anästhesie und hno vorwarnen. \n  fremdkörper:  plötzlicher beginn beim spielen oder essen ohne infekt. \n \n  pseudokrupp"},"fk-kind":{"ch":12,"cht":"Kindernotfälle","t":"Fremdkörperaspiration beim Kind","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Effektiver Husten:<\/strong> ermutigen, beobachten.<\/li>\n<li><strong>Ineffektiv, bei Bewusstsein:<\/strong> Säugling 5 Rückenschläge (Kopftieflage auf dem Unterarm), dann 5 Thoraxkompressionen; Kind &gt; 1 J 5 Rückenschläge, dann 5 Oberbauchkompressionen.<\/li>\n<li><strong>Bewusstlos:<\/strong> 5 Beatmungen, dann Reanimation; Laryngoskopie und Magill-Zange.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  effektiver husten:  ermutigen, beobachten. \n  ineffektiv, bei bewusstsein:  säugling 5 rückenschläge (kopftieflage auf dem unterarm), dann 5 thoraxkompressionen; kind > 1 j 5 rückenschläge, dann 5 oberbauchkompressionen. \n  bewusstlos:  5 beatmungen, dann reanimation; laryngoskopie und magill-zange. \n \n  fremdkörperaspiration beim kind"},"fieberkrampf":{"ch":12,"cht":"Kindernotfälle","t":"Fieberkrampf","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>6 Monate bis 5 Jahre<\/strong>, Fieber, generalisiert. <strong>Einfach:<\/strong> &lt; 15 min, einmal in 24 h, keine fokalen Zeichen. <strong>Komplex:<\/strong> länger, fokal oder wiederholt.<\/li>\n<li><strong>Krampft das Kind &gt; 5 min:<\/strong> Midazolam bukkal oder i.n. (Tabelle oben), nach 5–10 min einmal wiederholen; danach Levetiracetam 40–60 mg/kg. Narkose spätestens 40 min nach Beginn.<\/li>\n<li><strong>Febriler Status:<\/strong> Meningitis in bis zu 12–17 %; Klinik mit Lumbalpunktion.<\/li>\n<li><strong>Fiebersenkung<\/strong> verbessert das Wohlbefinden, verhindert aber keine Rezidive.<\/li>\n<li><strong>Erster Fieberkrampf, komplexer Anfall, Kind &lt; 12–18 Monate oder nicht vollständig erholt:<\/strong> Klinik. Meningitis-Zeichen (Nackensteife, Petechien, gespannte Fontanelle, Lethargie) aktiv suchen.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  6 monate bis 5 jahre , fieber, generalisiert.  einfach:  < 15 min, einmal in 24 h, keine fokalen zeichen.  komplex:  länger, fokal oder wiederholt. \n  krampft das kind > 5 min:  midazolam bukkal oder i.n. (tabelle oben), nach 5–10 min einmal wiederholen; danach levetiracetam 40–60 mg/kg. narkose spätestens 40 min nach beginn. \n  febriler status:  meningitis in bis zu 12–17 %; klinik mit lumbalpunktion. \n  fiebersenkung  verbessert das wohlbefinden, verhindert aber keine rezidive. \n  erster fieberkrampf, komplexer anfall, kind < 12–18 monate oder nicht vollständig erholt:  klinik. meningitis-zeichen (nackensteife, petechien, gespannte fontanelle, lethargie) aktiv suchen. \n \n  fieberkrampf"},"asthma-kind":{"ch":12,"cht":"Kindernotfälle","t":"Asthma und obstruktive Bronchitis beim Kind","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Salbutamol<\/strong> mit Spacer (2–10 Hübe) oder vernebelt, alle 20 min wiederholen; Ipratropium 0,25 mg dazu.<\/li>\n<li><strong>Prednisolon<\/strong> 1–2 mg/kg (max. 40 mg) i.v. oder p.o., alternativ Dexamethason 0,3–0,6 mg/kg oder Prednison 100 mg rektal beim Kleinkind.<\/li>\n<li><strong>Magnesium<\/strong> 40 mg/kg (max. 2 g) über 20 min bei schwerem Verlauf.<\/li>\n<li><strong>Bronchiolitis beim Säugling:<\/strong> O₂, Nase absaugen, Flüssigkeit; Salbutamol und Steroid helfen meist nicht.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  salbutamol  mit spacer (2–10 hübe) oder vernebelt, alle 20 min wiederholen; ipratropium 0,25 mg dazu. \n  prednisolon  1–2 mg/kg (max. 40 mg) i.v. oder p.o., alternativ dexamethason 0,3–0,6 mg/kg oder prednison 100 mg rektal beim kleinkind. \n  magnesium  40 mg/kg (max. 2 g) über 20 min bei schwerem verlauf. \n  bronchiolitis beim säugling:  o₂, nase absaugen, flüssigkeit; salbutamol und steroid helfen meist nicht. \n \n  asthma und obstruktive bronchitis beim kind"},"sepsis-kind":{"ch":12,"cht":"Kindernotfälle","t":"Sepsis, Meningokokken, Dehydratation","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Kind mit Fieber und Petechien oder Purpura:<\/strong> sofort Ceftriaxon 100 mg/kg, Volumenbolus 10 ml/kg, Transport in die Kinderklinik mit Voranmeldung.<\/li>\n<li><strong>Gastroenteritis mit Exsikkose:<\/strong> orale Rehydratation, wenn möglich; Ondansetron 0,1 mg/kg erleichtert das. Volumenbolus 10 ml/kg bei Schockzeichen.<\/li>\n<li><strong>BZ bei jedem kranken Kind<\/strong> messen.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  kind mit fieber und petechien oder purpura:  sofort ceftriaxon 100 mg/kg, volumenbolus 10 ml/kg, transport in die kinderklinik mit voranmeldung. \n  gastroenteritis mit exsikkose:  orale rehydratation, wenn möglich; ondansetron 0,1 mg/kg erleichtert das. volumenbolus 10 ml/kg bei schockzeichen. \n  bz bei jedem kranken kind  messen. \n \n  sepsis, meningokokken, dehydratation"},"kinderschutz":{"ch":12,"cht":"Kindernotfälle","t":"Kinderschutz","html":"<div class=\"box box-rf\">\n<div class=\"box-label\">Red Flags<\/div>\n<ul>\n<li><strong>Warnzeichen:<\/strong> Verletzungsmuster passt nicht zum Entwicklungsstand oder zum geschilderten Ablauf, wechselnde Angaben, verzögerte Hilfe, Hämatome beim noch nicht mobilen Säugling, geformte Hämatome, Verbrühungen mit scharfen Grenzen.<\/li>\n<li><strong>Vorgehen:<\/strong> behandeln, neutral und wörtlich dokumentieren, Kind in die Klinik bringen, Verdacht der Klinik mitteilen. Keine Konfrontation der Eltern am Einsatzort.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Weinendes, sich wehrendes Kind<\/strong> ist meist weniger krank als das stille, apathische.<\/li>\n<li><strong>Hypothermie<\/strong> beim Entkleiden und bei Infusionen: Raum heizen, Wärmedecke.<\/li>\n<li><strong>Atemweg:<\/strong> großer Hinterkopf beim Säugling → Schulterrolle für Neutralposition. Nicht überstrecken. Präklinisch ist ein supraglottischer Atemweg oft die bessere Wahl als die Intubation; maximal 2 Intubationsversuche, Atropin nicht mehr als Prämedikation (PLS 2025).<\/li>\n<li><strong>I.o.-Zugang<\/strong> früh bei kritisch krankem Kind, wenn i.v. nicht gelingt.<\/li>\n<\/ul>\n<\/div>","text":" \n red flags \n \n  warnzeichen:  verletzungsmuster passt nicht zum entwicklungsstand oder zum geschilderten ablauf, wechselnde angaben, verzögerte hilfe, hämatome beim noch nicht mobilen säugling, geformte hämatome, verbrühungen mit scharfen grenzen. \n  vorgehen:  behandeln, neutral und wörtlich dokumentieren, kind in die klinik bringen, verdacht der klinik mitteilen. keine konfrontation der eltern am einsatzort. \n \n \n \n pitfalls \n \n  weinendes, sich wehrendes kind  ist meist weniger krank als das stille, apathische. \n  hypothermie  beim entkleiden und bei infusionen: raum heizen, wärmedecke. \n  atemweg:  großer hinterkopf beim säugling → schulterrolle für neutralposition. nicht überstrecken. präklinisch ist ein supraglottischer atemweg oft die bessere wahl als die intubation; maximal 2 intubationsversuche, atropin nicht mehr als prämedikation (pls 2025). \n  i.o.-zugang  früh bei kritisch krankem kind, wenn i.v. nicht gelingt. \n \n  kinderschutz"},"wehen":{"ch":13,"cht":"Geburtshilfe und Neugeborenes","t":"Einschätzung bei Wehen","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Mutterpass:<\/strong> SSW, Parität, Mehrlinge, Lage, Plazentasitz, Risiken (Präeklampsie, Diabetes, Z. n. Sectio, GBS).<\/li>\n<li><strong>Fragen:<\/strong> Wehenabstand und -dauer, Blasensprung (Uhrzeit, Farbe: klar, grün, blutig), Blutung, Pressdrang.<\/li>\n<li><strong>Kopf in der Vulva sichtbar oder starker Pressdrang bei Mehrgebärender:<\/strong> Geburt vor Ort vorbereiten. Sonst Transport in Linksseitenlage.<\/li>\n<li><strong>Zielklinik bei Frühgeburt (G-BA QFR-RL):<\/strong> &lt; 29+0 SSW oder geschätzt &lt; 1250 g, Drillinge &lt; 33+0 SSW → Perinatalzentrum Level 1; 29+0 bis 31+6 SSW oder 1250–1499 g → mindestens Level 2; 32+0 bis 36+6 SSW → mindestens Perinataler Schwerpunkt. Klinik vorab informieren.<\/li>\n<li><strong>Ab ca. 20. SSW<\/strong> in Rückenlage Vena-cava-Kompression: Linksseitenlage oder Uterus manuell nach links verlagern.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  mutterpass:  ssw, parität, mehrlinge, lage, plazentasitz, risiken (präeklampsie, diabetes, z. n. sectio, gbs). \n  fragen:  wehenabstand und -dauer, blasensprung (uhrzeit, farbe: klar, grün, blutig), blutung, pressdrang. \n  kopf in der vulva sichtbar oder starker pressdrang bei mehrgebärender:  geburt vor ort vorbereiten. sonst transport in linksseitenlage. \n  zielklinik bei frühgeburt (g-ba qfr-rl):  < 29+0 ssw oder geschätzt < 1250 g, drillinge < 33+0 ssw → perinatalzentrum level 1; 29+0 bis 31+6 ssw oder 1250–1499 g → mindestens level 2; 32+0 bis 36+6 ssw → mindestens perinataler schwerpunkt. klinik vorab informieren. \n  ab ca. 20. ssw  in rückenlage vena-cava-kompression: linksseitenlage oder uterus manuell nach links verlagern. \n \n  einschätzung bei wehen"},"geburt":{"ch":13,"cht":"Geburtshilfe und Neugeborenes","t":"Präklinische Geburt","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Vorbereitung:<\/strong> warmer Raum, Tücher, Abnabelungsset, Absaugung, Beutel-Maske für Neugeborene, zweites Team für das Kind anfordern (Kindernotarzt, wenn verfügbar).<\/li>\n<li><strong>Kopfgeburt:<\/strong> Damm mit der Hand stützen, Kopf langsam kommen lassen, <strong>nicht ziehen<\/strong>. Nabelschnur um den Hals: über den Kopf streifen oder bei enger Umschlingung Kind durch die Schlinge gebären lassen.<\/li>\n<li><strong>Schultern:<\/strong> mit der nächsten Wehe; leichter Zug nach unten für die vordere Schulter, dann nach oben.<\/li>\n<li><strong>Nach der Geburt:<\/strong> abtrocknen, Haut-auf-Haut auf die Mutter, zudecken, Mütze. Abnabeln <strong>frühestens nach 60 s<\/strong>, wenn das Kind vital ist; zwei Klemmen, dazwischen schneiden. Braucht das Kind Reanimation, innerhalb von 30 s abnabeln (ERC 2025).<\/li>\n<li><strong>Plazenta:<\/strong> abwarten (bis 30 min), nicht an der Nabelschnur ziehen, Plazenta mitnehmen. <strong>Oxytocin 3–5 IE langsam i.v. oder 5–10 IE i.m.<\/strong> nach Geburt des Kindes, nachdem ein zweites Kind ausgeschlossen ist.<\/li>\n<li><strong>Uhrzeit der Geburt<\/strong> dokumentieren.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  vorbereitung:  warmer raum, tücher, abnabelungsset, absaugung, beutel-maske für neugeborene, zweites team für das kind anfordern (kindernotarzt, wenn verfügbar). \n  kopfgeburt:  damm mit der hand stützen, kopf langsam kommen lassen,  nicht ziehen . nabelschnur um den hals: über den kopf streifen oder bei enger umschlingung kind durch die schlinge gebären lassen. \n  schultern:  mit der nächsten wehe; leichter zug nach unten für die vordere schulter, dann nach oben. \n  nach der geburt:  abtrocknen, haut-auf-haut auf die mutter, zudecken, mütze. abnabeln  frühestens nach 60 s , wenn das kind vital ist; zwei klemmen, dazwischen schneiden. braucht das kind reanimation, innerhalb von 30 s abnabeln (erc 2025). \n  plazenta:  abwarten (bis 30 min), nicht an der nabelschnur ziehen, plazenta mitnehmen.  oxytocin 3–5 ie langsam i.v. oder 5–10 ie i.m.  nach geburt des kindes, nachdem ein zweites kind ausgeschlossen ist. \n  uhrzeit der geburt  dokumentieren. \n \n  präklinische geburt"},"geb-kompl":{"ch":13,"cht":"Geburtshilfe und Neugeborenes","t":"Komplikationen unter der Geburt","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Nabelschnurvorfall<\/div>\n<ul>\n<li>Vorangehenden Teil <strong>mit der Hand vaginal hochschieben<\/strong> und halten, Nabelschnur nicht zurückstopfen, feucht und warm halten.<\/li>\n<li><strong>Knie-Ellenbogen-Lage<\/strong> oder Kopftieflage mit Becken hoch, Wehen hemmen (Nitroglyzerin 0,4–0,8 mg s.l. oder Fenoterol nach SOP). Bei langem Transport Blase über Katheter mit 500–750 ml füllen (hebt den vorangehenden Teil an).<\/li>\n<li>Sofortiger Transport, Kreißsaal für Notsectio vorwarnen. Hand bleibt bis in den OP.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Schulterdystokie<\/div>\n<ul>\n<li>Kopf geboren, „Turtle-Zeichen\", Schultern folgen nicht. Hilfe holen, <strong>nicht ziehen, kein Druck auf den Fundus<\/strong>.<\/li>\n<li><strong>McRoberts:<\/strong> Beine der Mutter maximal an den Bauch beugen. Dazu <strong>suprapubischer Druck<\/strong> von der Seite des kindlichen Rückens.<\/li>\n<li>Weitere Manöver (Rotation, hinteren Arm entwickeln) nur mit Erfahrung.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Beckenendlage<\/div>\n<ul>\n<li><strong>Hände weg<\/strong>, bis der Steiß und der Rumpf bis zum Nabel geboren sind. Kind warm halten, nicht ziehen. Arme und Kopf kommen meist spontan; erst dann Manualhilfe nach Erfahrung.<\/li>\n<\/ul>\n<\/div>","text":" \n nabelschnurvorfall \n \n vorangehenden teil  mit der hand vaginal hochschieben  und halten, nabelschnur nicht zurückstopfen, feucht und warm halten. \n  knie-ellenbogen-lage  oder kopftieflage mit becken hoch, wehen hemmen (nitroglyzerin 0,4–0,8 mg s.l. oder fenoterol nach sop). bei langem transport blase über katheter mit 500–750 ml füllen (hebt den vorangehenden teil an). \n sofortiger transport, kreißsaal für notsectio vorwarnen. hand bleibt bis in den op. \n \n \n \n schulterdystokie \n \n kopf geboren, „turtle-zeichen\", schultern folgen nicht. hilfe holen,  nicht ziehen, kein druck auf den fundus . \n  mcroberts:  beine der mutter maximal an den bauch beugen. dazu  suprapubischer druck  von der seite des kindlichen rückens. \n weitere manöver (rotation, hinteren arm entwickeln) nur mit erfahrung. \n \n \n \n beckenendlage \n \n  hände weg , bis der steiß und der rumpf bis zum nabel geboren sind. kind warm halten, nicht ziehen. arme und kopf kommen meist spontan; erst dann manualhilfe nach erfahrung. \n \n  komplikationen unter der geburt"},"blutung-gyn":{"ch":13,"cht":"Geburtshilfe und Neugeborenes","t":"Blutungen","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Antepartal:<\/strong> schmerzlose hellrote Blutung → <strong>Placenta praevia<\/strong>: keine vaginale Untersuchung. Schmerzhafte Blutung, harter Uterus, Schock → <strong>vorzeitige Plazentalösung<\/strong> (Blutverlust oft größer als sichtbar, DIC).<\/li>\n<li><strong>Frühschwangerschaft mit Bauchschmerz und Schock:<\/strong> rupturierte Extrauteringravidität.<\/li>\n<li><strong>Postpartale Blutung (PPH):<\/strong> &gt; 500 ml nach vaginaler Geburt, schwer ab 1000 ml oder mit Schockzeichen. Ursachen nach den <strong>4 T<\/strong>: Tonus (etwa 70 %), Trauma, Tissue (Plazentareste), Thrombin.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-dosis\">\n<div class=\"box-label\">Medikamente &amp; Dosis<\/div>\n<table>\n<thead>\n<tr>\n<th>Maßnahme<\/th>\n<th>Dosis<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Uterusmassage, Blase entleeren (Katheter)<\/td>\n<td>sofort<\/td>\n<\/tr>\n<tr>\n<td>Oxytocin<\/td>\n<td>3–5 IE langsam i.v., dann 10–40 IE in 500 ml als Infusion<\/td>\n<\/tr>\n<tr>\n<td>Carbetocin (falls vorhanden)<\/td>\n<td>100 µg langsam i.v.<\/td>\n<\/tr>\n<tr>\n<td>Tranexamsäure<\/td>\n<td>1 g i.v. über 10 min innerhalb von 3 h, bei Fortbestehen nach 30 min erneut 1 g<\/td>\n<\/tr>\n<tr>\n<td>Bimanuelle Kompression<\/td>\n<td>bei Atonie trotz Uterotonika<\/td>\n<\/tr>\n<tr>\n<td>Aortenkompression<\/td>\n<td>Faust oberhalb des Nabels auf die Aorta als Überbrückung<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Blutverlust wird unterschätzt.<\/strong> Schockindex &gt; 1 bei einer jungen Gebärenden heißt schwere Blutung.<\/li>\n<li><strong>Oxytocin als schneller i.v.-Bolus:<\/strong> Hypotonie, Tachykardie, Ischämie. Langsam geben.<\/li>\n<li><strong>Ziehen an der Nabelschnur<\/strong> bei nicht gelöster Plazenta: Uterusinversion.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  antepartal:  schmerzlose hellrote blutung →  placenta praevia : keine vaginale untersuchung. schmerzhafte blutung, harter uterus, schock →  vorzeitige plazentalösung  (blutverlust oft größer als sichtbar, dic). \n  frühschwangerschaft mit bauchschmerz und schock:  rupturierte extrauteringravidität. \n  postpartale blutung (pph):  > 500 ml nach vaginaler geburt, schwer ab 1000 ml oder mit schockzeichen. ursachen nach den  4 t : tonus (etwa 70 %), trauma, tissue (plazentareste), thrombin. \n \n \n \n medikamente & dosis \n \n \n \n maßnahme \n dosis \n \n \n \n \n uterusmassage, blase entleeren (katheter) \n sofort \n \n \n oxytocin \n 3–5 ie langsam i.v., dann 10–40 ie in 500 ml als infusion \n \n \n carbetocin (falls vorhanden) \n 100 µg langsam i.v. \n \n \n tranexamsäure \n 1 g i.v. über 10 min innerhalb von 3 h, bei fortbestehen nach 30 min erneut 1 g \n \n \n bimanuelle kompression \n bei atonie trotz uterotonika \n \n \n aortenkompression \n faust oberhalb des nabels auf die aorta als überbrückung \n \n \n \n \n \n pitfalls \n \n  blutverlust wird unterschätzt.  schockindex > 1 bei einer jungen gebärenden heißt schwere blutung. \n  oxytocin als schneller i.v.-bolus:  hypotonie, tachykardie, ischämie. langsam geben. \n  ziehen an der nabelschnur  bei nicht gelöster plazenta: uterusinversion. \n \n  blutungen"},"eklampsie":{"ch":13,"cht":"Geburtshilfe und Neugeborenes","t":"Präeklampsie und Eklampsie","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Warnzeichen:<\/strong> RR ≥ 160/110 mmHg, Kopfschmerz, Augenflimmern, Oberbauchschmerz rechts, Hyperreflexie, Ödeme, Unruhe. Auch bis mehrere Tage <strong>postpartal<\/strong> möglich.<\/li>\n<li><strong>Eklamptischer Anfall:<\/strong> Magnesiumsulfat ist das Mittel der Wahl, Benzodiazepine nur, wenn Magnesium nicht verfügbar ist oder der Anfall anhält.<\/li>\n<li><strong>Blutdruck senken<\/strong> ab 160/110 mmHg auf etwa 140–150/90–100 mmHg, nicht tiefer (Plazentaperfusion).<\/li>\n<li><strong>Linksseitenlage<\/strong>, ruhiger Transport ohne Sondersignal-Stress, Zielklinik mit Geburtshilfe (Perinatalzentrum).<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-dosis\">\n<div class=\"box-label\">Medikamente &amp; Dosis<\/div>\n<table>\n<thead>\n<tr>\n<th>Substanz<\/th>\n<th>Dosis<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Magnesiumsulfat<\/td>\n<td>4–6 g i.v. über 15–20 min, dann 1–2 g/h<\/td>\n<\/tr>\n<tr>\n<td>Urapidil<\/td>\n<td>6,25–12,5 mg langsam i.v., dann 3–24 mg/h<\/td>\n<\/tr>\n<tr>\n<td>Nifedipin (unretardiert)<\/td>\n<td>10 mg p.o., nach 20 min wiederholbar; nicht sublingual<\/td>\n<\/tr>\n<tr>\n<td>Dihydralazin<\/td>\n<td>5 mg langsam i.v., alle 20 min wiederholbar<\/td>\n<\/tr>\n<tr>\n<td>Antidot bei Magnesium-Überdosis<\/td>\n<td>Kalziumglukonat 10 % 10 ml langsam i.v.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Magnesium-Überdosierung:<\/strong> Verlust der Patellarsehnenreflexe, Atemdepression, Bradykardie.<\/li>\n<li><strong>Zu rasche Blutdrucksenkung<\/strong> gefährdet den Fetus.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  warnzeichen:  rr ≥ 160/110 mmhg, kopfschmerz, augenflimmern, oberbauchschmerz rechts, hyperreflexie, ödeme, unruhe. auch bis mehrere tage  postpartal  möglich. \n  eklamptischer anfall:  magnesiumsulfat ist das mittel der wahl, benzodiazepine nur, wenn magnesium nicht verfügbar ist oder der anfall anhält. \n  blutdruck senken  ab 160/110 mmhg auf etwa 140–150/90–100 mmhg, nicht tiefer (plazentaperfusion). \n  linksseitenlage , ruhiger transport ohne sondersignal-stress, zielklinik mit geburtshilfe (perinatalzentrum). \n \n \n \n medikamente & dosis \n \n \n \n substanz \n dosis \n \n \n \n \n magnesiumsulfat \n 4–6 g i.v. über 15–20 min, dann 1–2 g/h \n \n \n urapidil \n 6,25–12,5 mg langsam i.v., dann 3–24 mg/h \n \n \n nifedipin (unretardiert) \n 10 mg p.o., nach 20 min wiederholbar; nicht sublingual \n \n \n dihydralazin \n 5 mg langsam i.v., alle 20 min wiederholbar \n \n \n antidot bei magnesium-überdosis \n kalziumglukonat 10 % 10 ml langsam i.v. \n \n \n \n \n \n pitfalls \n \n  magnesium-überdosierung:  verlust der patellarsehnenreflexe, atemdepression, bradykardie. \n  zu rasche blutdrucksenkung  gefährdet den fetus. \n \n  präeklampsie und eklampsie"},"nls":{"ch":13,"cht":"Geburtshilfe und Neugeborenes","t":"Neugeborenen-Erstversorgung","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Wärme zuerst:<\/strong> abtrocknen, nasse Tücher weg, Mütze, Haut-auf-Haut oder Wärmedecke. Frühgeborene &lt; 32 SSW ohne Abtrocknen in Plastikbeutel oder Folie bis zum Hals. Ziel 36,5–37,5 °C. Außerklinisch für gefährdete Kinder und Frühgeborene vorgewärmten Inkubator anfordern.<\/li>\n<li><strong>Beurteilen:<\/strong> Tonus, Atmung, Herzfrequenz (Stethoskop, EKG-Elektroden sind schneller und genauer als Pulsoxymetrie).<\/li>\n<li><strong>Apnoe oder Schnappatmung:<\/strong> Kopf in Neutralposition, <strong>5 Blähatmungen<\/strong> von je 2–3 s (<strong>≥ 32 SSW 30 cmH₂O, &lt; 32 SSW 25 cmH₂O<\/strong>), dann Beatmung 30/min mit PEEP 6 cmH₂O. Thoraxhebung ist das Erfolgskriterium.<\/li>\n<li><strong>HF &lt; 60/min nach 30 s effektiver Beatmung:<\/strong> Herzdruckmassage 3:1 (90 Kompressionen und 30 Beatmungen pro Minute), Zwei-Daumen-Technik, O₂ auf 100 %.<\/li>\n<li><strong>Adrenalin<\/strong> 20 µg/kg (Bereich 10–30 µg/kg) i.v., i.o. oder über Nabelvene, <strong>alle 4 min<\/strong> (ERC 2025); endotracheal 100 µg/kg. Volumen 10 ml/kg, Glukose 10 % 2 ml/kg nur bei Hypoglykämie. Natriumbikarbonat und Naloxon sind gestrichen.<\/li>\n<li><strong>Start-FiO₂ (ERC 2025):<\/strong> ≥ 32 SSW 0,21, &lt; 32 SSW 0,3; dann nach präduktaler SpO₂ (rechte Hand) titrieren.<\/li>\n<\/ul>\n<\/div>\n<table>\n<thead>\n<tr>\n<th>Minute nach Geburt<\/th>\n<th>Ziel-SpO₂ präduktal (ERC 2025)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>3<\/td>\n<td>70–75 %<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>80–85 %<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>85–95 %<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>APGAR (1, 5, 10 min)<\/th>\n<th>0<\/th>\n<th>1<\/th>\n<th>2<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hautfarbe<\/td>\n<td>blau oder blass<\/td>\n<td>Stamm rosig, Extremitäten blau<\/td>\n<td>rosig<\/td>\n<\/tr>\n<tr>\n<td>Puls<\/td>\n<td>keiner<\/td>\n<td>&lt; 100/min<\/td>\n<td>&gt; 100/min<\/td>\n<\/tr>\n<tr>\n<td>Grimassieren beim Absaugen<\/td>\n<td>keines<\/td>\n<td>Grimasse<\/td>\n<td>Schreien, Husten<\/td>\n<\/tr>\n<tr>\n<td>Muskeltonus<\/td>\n<td>schlaff<\/td>\n<td>träge Beugung<\/td>\n<td>aktive Bewegung<\/td>\n<\/tr>\n<tr>\n<td>Atmung<\/td>\n<td>keine<\/td>\n<td>langsam, unregelmäßig<\/td>\n<td>kräftig, schreiend<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Auskühlung<\/strong> ist präklinisch die häufigste vermeidbare Schädigung des Neugeborenen.<\/li>\n<li><strong>Beatmung ohne Thoraxhebung<\/strong> ist keine Beatmung: Maskensitz, Kopfposition, Zwei-Helfer-Technik, ggf. Guedel oder Larynxmaske.<\/li>\n<li><strong>Mekonium:<\/strong> kein routinemäßiges Absaugen der Trachea; bei Apnoe direkt beatmen.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  wärme zuerst:  abtrocknen, nasse tücher weg, mütze, haut-auf-haut oder wärmedecke. frühgeborene < 32 ssw ohne abtrocknen in plastikbeutel oder folie bis zum hals. ziel 36,5–37,5 °c. außerklinisch für gefährdete kinder und frühgeborene vorgewärmten inkubator anfordern. \n  beurteilen:  tonus, atmung, herzfrequenz (stethoskop, ekg-elektroden sind schneller und genauer als pulsoxymetrie). \n  apnoe oder schnappatmung:  kopf in neutralposition,  5 blähatmungen  von je 2–3 s ( ≥ 32 ssw 30 cmh₂o, < 32 ssw 25 cmh₂o ), dann beatmung 30/min mit peep 6 cmh₂o. thoraxhebung ist das erfolgskriterium. \n  hf < 60/min nach 30 s effektiver beatmung:  herzdruckmassage 3:1 (90 kompressionen und 30 beatmungen pro minute), zwei-daumen-technik, o₂ auf 100 %. \n  adrenalin  20 µg/kg (bereich 10–30 µg/kg) i.v., i.o. oder über nabelvene,  alle 4 min  (erc 2025); endotracheal 100 µg/kg. volumen 10 ml/kg, glukose 10 % 2 ml/kg nur bei hypoglykämie. natriumbikarbonat und naloxon sind gestrichen. \n  start-fio₂ (erc 2025):  ≥ 32 ssw 0,21, < 32 ssw 0,3; dann nach präduktaler spo₂ (rechte hand) titrieren. \n \n \n \n \n \n minute nach geburt \n ziel-spo₂ präduktal (erc 2025) \n \n \n \n \n 3 \n 70–75 % \n \n \n 5 \n 80–85 % \n \n \n 10 \n 85–95 % \n \n \n \n \n \n \n apgar (1, 5, 10 min) \n 0 \n 1 \n 2 \n \n \n \n \n hautfarbe \n blau oder blass \n stamm rosig, extremitäten blau \n rosig \n \n \n puls \n keiner \n < 100/min \n > 100/min \n \n \n grimassieren beim absaugen \n keines \n grimasse \n schreien, husten \n \n \n muskeltonus \n schlaff \n träge beugung \n aktive bewegung \n \n \n atmung \n keine \n langsam, unregelmäßig \n kräftig, schreiend \n \n \n \n \n pitfalls \n \n  auskühlung  ist präklinisch die häufigste vermeidbare schädigung des neugeborenen. \n  beatmung ohne thoraxhebung  ist keine beatmung: maskensitz, kopfposition, zwei-helfer-technik, ggf. guedel oder larynxmaske. \n  mekonium:  kein routinemäßiges absaugen der trachea; bei apnoe direkt beatmen. \n \n  neugeborenen-erstversorgung"},"abdomen":{"ch":14,"cht":"Abdomen und weitere Notfälle","t":"Akutes Abdomen","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Früh analgesieren.<\/strong> Opioide verschleiern die Diagnose nicht.<\/li>\n<li><strong>Gefährliche Ursachen aktiv suchen:<\/strong> rupturiertes Aortenaneurysma (&gt; 50 J, Rücken- oder Flankenschmerz, Schock, pulsierender Tumor, POCUS), Mesenterialischämie (Vorhofflimmern, Schmerz außer Verhältnis zum Befund), Extrauteringravidität, Perforation, Ileus, inferiorer Infarkt, DKA, Hodentorsion.<\/li>\n<li><strong>Nierenkolik:<\/strong> Metamizol 1–2,5 g als Kurzinfusion, NSAR (z. B. Ibuprofen 400–600 mg p.o.; Nierenfunktion beachten; Diclofenac i.v. ist in Deutschland off-label), Opioid bei Bedarf. Butylscopolamin bringt keinen zusätzlichen Nutzen.<\/li>\n<li><strong>Gallenkolik:<\/strong> Metamizol plus Opioid.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Älterer Patient mit „Nierenkolik\"<\/strong> und erstem Ereignis: Aortenaneurysma, bis das Gegenteil bewiesen ist.<\/li>\n<li><strong>Junger Mann mit akutem Hodenschmerz:<\/strong> Torsion, Urologie innerhalb weniger Stunden.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  früh analgesieren.  opioide verschleiern die diagnose nicht. \n  gefährliche ursachen aktiv suchen:  rupturiertes aortenaneurysma (> 50 j, rücken- oder flankenschmerz, schock, pulsierender tumor, pocus), mesenterialischämie (vorhofflimmern, schmerz außer verhältnis zum befund), extrauteringravidität, perforation, ileus, inferiorer infarkt, dka, hodentorsion. \n  nierenkolik:  metamizol 1–2,5 g als kurzinfusion, nsar (z. b. ibuprofen 400–600 mg p.o.; nierenfunktion beachten; diclofenac i.v. ist in deutschland off-label), opioid bei bedarf. butylscopolamin bringt keinen zusätzlichen nutzen. \n  gallenkolik:  metamizol plus opioid. \n \n \n \n pitfalls \n \n  älterer patient mit „nierenkolik\"  und erstem ereignis: aortenaneurysma, bis das gegenteil bewiesen ist. \n  junger mann mit akutem hodenschmerz:  torsion, urologie innerhalb weniger stunden. \n \n  akutes abdomen"},"gib":{"ch":14,"cht":"Abdomen und weitere Notfälle","t":"Gastrointestinale Blutung","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Obere GI-Blutung:<\/strong> Hämatemesis, Kaffeesatz, Teerstuhl. <strong>Untere:<\/strong> Hämatochezie (bei massiver oberer Blutung ebenfalls möglich).<\/li>\n<li><strong>Lagerung<\/strong>, Absaugung bereit, zwei großlumige Zugänge, Volumen bis zur ausreichenden Perfusion (keine Normotonie erzwingen).<\/li>\n<li><strong>Atemwegssicherung<\/strong> bei massiver Hämatemesis mit Bewusstseinsminderung; Absaugung doppelt bereithalten.<\/li>\n<li><strong>Varizenblutung<\/strong> bei Leberzirrhose: Terlipressin 1–2 mg i.v., wenn mitgeführt; Zielklinik mit Endoskopie rund um die Uhr.<\/li>\n<li><strong>Antikoagulation<\/strong> erfragen und an die Klinik melden.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-neu\">\n<div class=\"box-label\">Evidenz &amp; Neu<\/div>\n<ul>\n<li><strong>Tranexamsäure bei GI-Blutung nicht geben:<\/strong> HALT-IT (Lancet 2020) zeigte keinen Überlebensvorteil, aber mehr venöse Thromboembolien und Krampfanfälle.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  obere gi-blutung:  hämatemesis, kaffeesatz, teerstuhl.  untere:  hämatochezie (bei massiver oberer blutung ebenfalls möglich). \n  lagerung , absaugung bereit, zwei großlumige zugänge, volumen bis zur ausreichenden perfusion (keine normotonie erzwingen). \n  atemwegssicherung  bei massiver hämatemesis mit bewusstseinsminderung; absaugung doppelt bereithalten. \n  varizenblutung  bei leberzirrhose: terlipressin 1–2 mg i.v., wenn mitgeführt; zielklinik mit endoskopie rund um die uhr. \n  antikoagulation  erfragen und an die klinik melden. \n \n \n \n evidenz & neu \n \n  tranexamsäure bei gi-blutung nicht geben:  halt-it (lancet 2020) zeigte keinen überlebensvorteil, aber mehr venöse thromboembolien und krampfanfälle. \n \n  gastrointestinale blutung"},"epistaxis":{"ch":14,"cht":"Abdomen und weitere Notfälle","t":"Epistaxis","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Sitzend, Kopf nach vorn<\/strong>, Nasenflügel 10–20 min durchgehend fest komprimieren. Blut nicht schlucken lassen.<\/li>\n<li><strong>Anhaltend:<\/strong> abschwellende Tropfen, Tamponade (aufblasbar oder expandierend), Antikoagulation erfragen.<\/li>\n<li><strong>Posteriore Blutung<\/strong> (Blut im Rachen trotz anteriorer Kompression): Ballonkatheter, Klinik mit HNO.<\/li>\n<li><strong>Blutdruck:<\/strong> Hypertonie ist meist Folge von Stress und Schmerz; Senkung nur bei sehr hohen Werten.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-neu\">\n<div class=\"box-label\">Evidenz &amp; Neu<\/div>\n<ul>\n<li><strong>Topische Tranexamsäure<\/strong> zeigte in NoPAC (2021) gegenüber Placebo keinen Vorteil für die Notwendigkeit einer Tamponade. Kann versucht werden, ersetzt aber Kompression und Tamponade nicht.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  sitzend, kopf nach vorn , nasenflügel 10–20 min durchgehend fest komprimieren. blut nicht schlucken lassen. \n  anhaltend:  abschwellende tropfen, tamponade (aufblasbar oder expandierend), antikoagulation erfragen. \n  posteriore blutung  (blut im rachen trotz anteriorer kompression): ballonkatheter, klinik mit hno. \n  blutdruck:  hypertonie ist meist folge von stress und schmerz; senkung nur bei sehr hohen werten. \n \n \n \n evidenz & neu \n \n  topische tranexamsäure  zeigte in nopac (2021) gegenüber placebo keinen vorteil für die notwendigkeit einer tamponade. kann versucht werden, ersetzt aber kompression und tamponade nicht. \n \n  epistaxis"},"dialyse":{"ch":14,"cht":"Abdomen und weitere Notfälle","t":"Dialysepatient","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Shuntblutung:<\/strong> gezielter Druck mit dem Finger auf die Punktionsstelle, ausreichend lange; bei lebensbedrohlicher Blutung Tourniquet proximal.<\/li>\n<li><strong>Shuntarm schonen:<\/strong> keine Blutdruckmessung, keine Zugänge.<\/li>\n<li><strong>Verpasste Dialyse:<\/strong> Hyperkaliämie (Kapitel 7), Überwässerung mit Lungenödem (CPAP, Nitrat).<\/li>\n<li><strong>Volumen bei Hypotonie<\/strong> in 250-ml-Schritten.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  shuntblutung:  gezielter druck mit dem finger auf die punktionsstelle, ausreichend lange; bei lebensbedrohlicher blutung tourniquet proximal. \n  shuntarm schonen:  keine blutdruckmessung, keine zugänge. \n  verpasste dialyse:  hyperkaliämie (kapitel 7), überwässerung mit lungenödem (cpap, nitrat). \n  volumen bei hypotonie  in 250-ml-schritten. \n \n  dialysepatient"},"auge":{"ch":14,"cht":"Abdomen und weitere Notfälle","t":"Auge","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Verätzung:<\/strong> sofort und lange spülen (mindestens 15–30 min), Lidsperrer bzw. Ektropionieren, Augenklinik.<\/li>\n<li><strong>Akuter Winkelblock:<\/strong> rotes Auge, harter Bulbus, mittelweite lichtstarre Pupille, Kopfschmerz, Erbrechen. Acetazolamid 500 mg i.v., wenn vorhanden; Augenklinik.<\/li>\n<li><strong>Plötzlicher schmerzloser Visusverlust:<\/strong> Zentralarterienverschluss ist ein Schlaganfall des Auges; Zielklinik mit Stroke Unit und Augenheilkunde nach regionalem Konzept.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  verätzung:  sofort und lange spülen (mindestens 15–30 min), lidsperrer bzw. ektropionieren, augenklinik. \n  akuter winkelblock:  rotes auge, harter bulbus, mittelweite lichtstarre pupille, kopfschmerz, erbrechen. acetazolamid 500 mg i.v., wenn vorhanden; augenklinik. \n  plötzlicher schmerzloser visusverlust:  zentralarterienverschluss ist ein schlaganfall des auges; zielklinik mit stroke unit und augenheilkunde nach regionalem konzept. \n \n  auge"},"palliativ":{"ch":14,"cht":"Abdomen und weitere Notfälle","t":"Palliative Notfälle","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Therapieziel klären:<\/strong> Patientenverfügung, Notfallbogen, Gespräch mit Angehörigen und Pflegedienst. Verbleib zu Hause aktiv anbieten.<\/li>\n<li><strong>Atemnot:<\/strong> Morphin 2–5 mg i.v. oder s.c. titriert, bei vorbestehender Opioidtherapie 1/6 der Tagesdosis als Bedarfsdosis; Ventilator auf das Gesicht, Oberkörper hoch.<\/li>\n<li><strong>Angst und terminale Unruhe:<\/strong> Midazolam 1–2 mg i.v. oder 2,5–5 mg s.c. titriert.<\/li>\n<li><strong>Rasselatmung:<\/strong> Lagerung, Butylscopolamin 20 mg s.c.; Absaugen meist nicht hilfreich.<\/li>\n<li><strong>SAPV-Team<\/strong> und Hausarzt informieren.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  therapieziel klären:  patientenverfügung, notfallbogen, gespräch mit angehörigen und pflegedienst. verbleib zu hause aktiv anbieten. \n  atemnot:  morphin 2–5 mg i.v. oder s.c. titriert, bei vorbestehender opioidtherapie 1/6 der tagesdosis als bedarfsdosis; ventilator auf das gesicht, oberkörper hoch. \n  angst und terminale unruhe:  midazolam 1–2 mg i.v. oder 2,5–5 mg s.c. titriert. \n  rasselatmung:  lagerung, butylscopolamin 20 mg s.c.; absaugen meist nicht hilfreich. \n  sapv-team  und hausarzt informieren. \n \n  palliative notfälle"},"rea-hypo":{"ch":15,"cht":"Reanimation: Sonderfälle","t":"Hypothermie","html":"<p>Nur die Abweichungen vom Standard-ALS nach ERC 2025. Grundprinzip bleibt: hochwertige Thoraxkompressionen, früh defibrillieren, reversible Ursachen (4 H, HITS) gezielt behandeln.<\/p>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Kreislaufstillstand bestätigen:<\/strong> Lebenszeichen bis zu 1 min prüfen (klinisch, EKG, Ultraschall). Tiefe Bradykardie mit Minimalkreislauf nicht durch Kompressionen „wegdrücken\".<\/li>\n<li><strong>Reanimation beginnen<\/strong>, außer bei offensichtlich tödlicher Verletzung, durchgefrorenem Körper (Thorax nicht komprimierbar) oder Lawinenkriterien (unten).<\/li>\n<li><strong>&lt; 30 °C:<\/strong> bis zu 3 Defibrillationen; danach weitere erst bei &gt; 30 °C. <strong>Adrenalin 1 mg nur einmal<\/strong> (ERC 2025; 2021 hieß es noch „kein Adrenalin\"), außer wenn eine eCPR unmittelbar bevorsteht.<\/li>\n<li><strong>30–35 °C:<\/strong> Adrenalin-Intervall auf 6–10 min verlängern. Ab 35 °C Standard.<\/li>\n<li><strong>Mechanische Reanimationshilfe<\/strong> und Transport unter Reanimation in ein <strong>ECLS-Zentrum<\/strong>; Transfer lohnt sich, wenn das Zentrum innerhalb von 6 h erreichbar ist. Unbeobachteter Stillstand mit Asystolie ist keine Kontraindikation.<\/li>\n<li><strong>Unterbrochene Reanimation<\/strong>, wenn Kompressionen während der Rettung unmöglich sind (&lt; 28 °C): nach ERC 2021 abwechselnd 5 min CPR und ≤ 5 min Pause, &lt; 20 °C ≤ 10 min Pause.<\/li>\n<li><strong>Prognose in der Klinik:<\/strong> HOPE-Score; ersatzweise sprechen K⁺ &lt; 7 mmol/l plus Temperatur &lt; 30 °C für eine primäre Hypothermie mit Überlebenschance.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-merke\">\n<div class=\"box-label\">Merke<\/div>\n<p>„Niemand ist tot, bevor er nicht warm und tot ist\" gilt für die <strong>primäre<\/strong> Hypothermie. Ist zuerst der Kreislaufstillstand eingetreten und dann die Auskühlung (z. B. Asphyxie, Trauma), ist die Prognose schlecht.<\/p>\n<\/div>","text":" nur die abweichungen vom standard-als nach erc 2025. grundprinzip bleibt: hochwertige thoraxkompressionen, früh defibrillieren, reversible ursachen (4 h, hits) gezielt behandeln. \n \n vorgehen \n \n  kreislaufstillstand bestätigen:  lebenszeichen bis zu 1 min prüfen (klinisch, ekg, ultraschall). tiefe bradykardie mit minimalkreislauf nicht durch kompressionen „wegdrücken\". \n  reanimation beginnen , außer bei offensichtlich tödlicher verletzung, durchgefrorenem körper (thorax nicht komprimierbar) oder lawinenkriterien (unten). \n  < 30 °c:  bis zu 3 defibrillationen; danach weitere erst bei > 30 °c.  adrenalin 1 mg nur einmal  (erc 2025; 2021 hieß es noch „kein adrenalin\"), außer wenn eine ecpr unmittelbar bevorsteht. \n  30–35 °c:  adrenalin-intervall auf 6–10 min verlängern. ab 35 °c standard. \n  mechanische reanimationshilfe  und transport unter reanimation in ein  ecls-zentrum ; transfer lohnt sich, wenn das zentrum innerhalb von 6 h erreichbar ist. unbeobachteter stillstand mit asystolie ist keine kontraindikation. \n  unterbrochene reanimation , wenn kompressionen während der rettung unmöglich sind (< 28 °c): nach erc 2021 abwechselnd 5 min cpr und ≤ 5 min pause, < 20 °c ≤ 10 min pause. \n  prognose in der klinik:  hope-score; ersatzweise sprechen k⁺ < 7 mmol/l plus temperatur < 30 °c für eine primäre hypothermie mit überlebenschance. \n \n \n \n merke \n „niemand ist tot, bevor er nicht warm und tot ist\" gilt für die  primäre  hypothermie. ist zuerst der kreislaufstillstand eingetreten und dann die auskühlung (z. b. asphyxie, trauma), ist die prognose schlecht. \n  hypothermie"},"lawine":{"ch":15,"cht":"Reanimation: Sonderfälle","t":"Lawine","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Verschüttungsdauer &lt; 60 min:<\/strong> Standard-ALS mit 5 initialen Beatmungen; Asphyxie ist die Hauptursache.<\/li>\n<li><strong>Verschüttungsdauer ≥ 60 min:<\/strong> freier Atemweg (Atemhöhle: offene Atemwege plus jeder Raum vor Mund und Nase) und keine tödlichen Verletzungen → Reanimation und Transport ins ECLS-Zentrum.<\/li>\n<li><strong>Kein Reanimationsbeginn<\/strong> bei tödlichen Verletzungen; <strong>Abbruch erwägen<\/strong> bei ≥ 60 min Verschüttung plus vollständig verlegtem Atemweg (Mund und Nase mit Schnee gefüllt) plus Asystolie.<\/li>\n<li><strong>Mehrere Verschüttete, wenige Helfer<\/strong> (AvaLife): zuerst die flacher als 1,5 m Verschütteten ausgraben.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  verschüttungsdauer < 60 min:  standard-als mit 5 initialen beatmungen; asphyxie ist die hauptursache. \n  verschüttungsdauer ≥ 60 min:  freier atemweg (atemhöhle: offene atemwege plus jeder raum vor mund und nase) und keine tödlichen verletzungen → reanimation und transport ins ecls-zentrum. \n  kein reanimationsbeginn  bei tödlichen verletzungen;  abbruch erwägen  bei ≥ 60 min verschüttung plus vollständig verlegtem atemweg (mund und nase mit schnee gefüllt) plus asystolie. \n  mehrere verschüttete, wenige helfer  (avalife): zuerst die flacher als 1,5 m verschütteten ausgraben. \n \n  lawine"},"rea-ertrinken":{"ch":15,"cht":"Reanimation: Sonderfälle","t":"Ertrinken","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Hypoxie ist die Ursache:<\/strong> mit <strong>5 Beatmungen mit 100 % O₂<\/strong> beginnen, Beatmungsdruck langsam steigern (Mageninsufflation), früh Atemweg sichern.<\/li>\n<li><strong>Wirbelsäulenimmobilisation im Wasser<\/strong> darf die Rettung nicht verzögern.<\/li>\n<li><strong>Wasser nicht aus der Lunge „entfernen\"<\/strong>, kein Heimlich-Manöver.<\/li>\n<li><strong>Kaltwasser:<\/strong> lange reanimieren, Hypothermieregeln beachten, eCPR nach lokalem Protokoll.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  hypoxie ist die ursache:  mit  5 beatmungen mit 100 % o₂  beginnen, beatmungsdruck langsam steigern (mageninsufflation), früh atemweg sichern. \n  wirbelsäulenimmobilisation im wasser  darf die rettung nicht verzögern. \n  wasser nicht aus der lunge „entfernen\" , kein heimlich-manöver. \n  kaltwasser:  lange reanimieren, hypothermieregeln beachten, ecpr nach lokalem protokoll. \n \n  ertrinken"},"rea-trauma":{"ch":15,"cht":"Reanimation: Sonderfälle","t":"Traumatischer Kreislaufstillstand","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Zeitkritisch: reversible Ursachen haben Vorrang vor Thoraxkompressionen und Adrenalin.<\/strong> Simultan behandeln (<strong>HOTT<\/strong>):<ul>\n<li><strong>H<\/strong>ypovolämie: Blutstillung (Tourniquet, Beckengurt, Packing), Volumen bzw. Blut, Tranexamsäure.<\/li>\n<li><strong>O<\/strong>xygenierung: Atemweg sichern, beatmen.<\/li>\n<li><strong>T<\/strong>amponade: Notfall-Thorakotomie (Clamshell), wenn Stillstand kurz zurückliegt und Expertise vorhanden; sonst Perikardpunktion unter Ultraschall.<\/li>\n<li><strong>T<\/strong>ensionspneumothorax: bilaterale Thorakostomie.<\/li>\n<\/ul>\n<\/li>\n<li><strong>POCUS<\/strong> zur Ursachensuche (Tamponade, Pneumothorax, Volumenstatus).<\/li>\n<li><strong>REBOA<\/strong> nur in Studien (ERC 2025).<\/li>\n<li><strong>Abbruch<\/strong> erwägen, wenn nach Behandlung der reversiblen Ursachen kein ROSC eintritt bzw. bei mit dem Leben nicht vereinbaren Verletzungen.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Thoraxkompressionen bei leerem Herz<\/strong> erzeugen keinen Fluss. Ohne Volumen und Entlastung bleibt der Versuch erfolglos.<\/li>\n<li><strong>Medizinische Ursache des Unfalls<\/strong> (Infarkt, Hypoglykämie, Krampfanfall) bedenken: dann Standard-ALS.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  zeitkritisch: reversible ursachen haben vorrang vor thoraxkompressionen und adrenalin.  simultan behandeln ( hott ): \n  h ypovolämie: blutstillung (tourniquet, beckengurt, packing), volumen bzw. blut, tranexamsäure. \n  o xygenierung: atemweg sichern, beatmen. \n  t amponade: notfall-thorakotomie (clamshell), wenn stillstand kurz zurückliegt und expertise vorhanden; sonst perikardpunktion unter ultraschall. \n  t ensionspneumothorax: bilaterale thorakostomie. \n \n \n  pocus  zur ursachensuche (tamponade, pneumothorax, volumenstatus). \n  reboa  nur in studien (erc 2025). \n  abbruch  erwägen, wenn nach behandlung der reversiblen ursachen kein rosc eintritt bzw. bei mit dem leben nicht vereinbaren verletzungen. \n \n \n \n pitfalls \n \n  thoraxkompressionen bei leerem herz  erzeugen keinen fluss. ohne volumen und entlastung bleibt der versuch erfolglos. \n  medizinische ursache des unfalls  (infarkt, hypoglykämie, krampfanfall) bedenken: dann standard-als. \n \n  traumatischer kreislaufstillstand"},"rea-schwanger":{"ch":15,"cht":"Reanimation: Sonderfälle","t":"Schwangerschaft und Wochenbett","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Gilt bis 6 Wochen postpartal<\/strong> (ERC 2025).<\/li>\n<li><strong>Manuelle Uterusverlagerung nach links<\/strong> so früh wie möglich und durchgehend (Fundus auf Nabelhöhe oder höher, etwa ab 20. SSW); bevorzugt gegenüber Kippung.<\/li>\n<li><strong>Früh Atemweg sichern<\/strong> (Aspiration, schwieriger Atemweg), Zugang oberhalb des Zwerchfells.<\/li>\n<li><strong>Notfall-Hysterotomie<\/strong> (Perimortem-Sectio): früh vorbereiten und so bald wie möglich am Ort des Stillstands durch ein erfahrenes Team. Die starre 5-min-Regel wurde 2025 aufgegeben, das Prinzip „früh\" bleibt. Präklinisch nur mit Expertise; sonst sofort Transport und Klinik vorwarnen.<\/li>\n<li><strong>Ursachen:<\/strong> 4 H und HITS plus <strong>4 P<\/strong>: Präeklampsie/Eklampsie, Puerperalsepsis, Plazenta- bzw. Uterusursachen (Blutung, Fruchtwasserembolie), peripartale Kardiomyopathie. Dazu LAE, Magnesium-Überdosis (Kalzium), Aortendissektion, Anästhesiekomplikation.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  gilt bis 6 wochen postpartal  (erc 2025). \n  manuelle uterusverlagerung nach links  so früh wie möglich und durchgehend (fundus auf nabelhöhe oder höher, etwa ab 20. ssw); bevorzugt gegenüber kippung. \n  früh atemweg sichern  (aspiration, schwieriger atemweg), zugang oberhalb des zwerchfells. \n  notfall-hysterotomie  (perimortem-sectio): früh vorbereiten und so bald wie möglich am ort des stillstands durch ein erfahrenes team. die starre 5-min-regel wurde 2025 aufgegeben, das prinzip „früh\" bleibt. präklinisch nur mit expertise; sonst sofort transport und klinik vorwarnen. \n  ursachen:  4 h und hits plus  4 p : präeklampsie/eklampsie, puerperalsepsis, plazenta- bzw. uterusursachen (blutung, fruchtwasserembolie), peripartale kardiomyopathie. dazu lae, magnesium-überdosis (kalzium), aortendissektion, anästhesiekomplikation. \n \n  schwangerschaft und wochenbett"},"rea-lae":{"ch":15,"cht":"Reanimation: Sonderfälle","t":"Lungenarterienembolie","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Systemische Lyse<\/strong> bei vermuteter oder gesicherter LAE als Ursache: z. B. Alteplase 50 mg als Bolus, ggf. weitere 50 mg nach 30 min, oder Tenecteplase gewichtsadaptiert. Das optimale Schema ist nicht belegt.<\/li>\n<li><strong>Nach Lyse mindestens 60–90 min weiter reanimieren<\/strong>, mechanische Reanimationshilfe; ECLS-Option prüfen.<\/li>\n<li><strong>etCO₂ &lt; 13 mmHg<\/strong> trotz guter Kompressionen ist ein Hinweis, aber unspezifisch. Volumen höchstens 500 ml.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  systemische lyse  bei vermuteter oder gesicherter lae als ursache: z. b. alteplase 50 mg als bolus, ggf. weitere 50 mg nach 30 min, oder tenecteplase gewichtsadaptiert. das optimale schema ist nicht belegt. \n  nach lyse mindestens 60–90 min weiter reanimieren , mechanische reanimationshilfe; ecls-option prüfen. \n  etco₂ < 13 mmhg  trotz guter kompressionen ist ein hinweis, aber unspezifisch. volumen höchstens 500 ml. \n \n  lungenarterienembolie"},"rea-hyperk":{"ch":15,"cht":"Reanimation: Sonderfälle","t":"Hyperkaliämie","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Kalziumchlorid 10 % 10 ml<\/strong> plus <strong>Natriumbikarbonat 50 mmol<\/strong> über getrennte Zugänge, Insulin 10 IE plus 25 g Glukose; eCPR bzw. Dialyse erwägen.<\/li>\n<li><strong>Dialysepatient<\/strong> mit Stillstand an Hyperkaliämie denken.<\/li>\n<li><strong>Kinder (PLS 2025):<\/strong> im hyperkaliämischen Stillstand weder Kalzium noch Bikarbonat routinemäßig.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  kalziumchlorid 10 % 10 ml  plus  natriumbikarbonat 50 mmol  über getrennte zugänge, insulin 10 ie plus 25 g glukose; ecpr bzw. dialyse erwägen. \n  dialysepatient  mit stillstand an hyperkaliämie denken. \n  kinder (pls 2025):  im hyperkaliämischen stillstand weder kalzium noch bikarbonat routinemäßig. \n \n  hyperkaliämie"},"rea-intox":{"ch":15,"cht":"Reanimation: Sonderfälle","t":"Intoxikation","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Eigenschutz, früh Antidote<\/strong> (Kapitel 8), Giftinformationszentrum, <strong>lange reanimieren<\/strong>, früh eCPR erwägen.<\/li>\n<li><strong>Lokalanästhetika:<\/strong> Lipidemulsion (Kapitel 3). <strong>Trizyklika:<\/strong> Natriumbikarbonat. <strong>Kalziumantagonisten:<\/strong> Kalzium hoch dosiert. <strong>Opioide:<\/strong> Beatmung, Naloxon nachrangig.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  eigenschutz, früh antidote  (kapitel 8), giftinformationszentrum,  lange reanimieren , früh ecpr erwägen. \n  lokalanästhetika:  lipidemulsion (kapitel 3).  trizyklika:  natriumbikarbonat.  kalziumantagonisten:  kalzium hoch dosiert.  opioide:  beatmung, naloxon nachrangig. \n \n  intoxikation"},"rea-asthma":{"ch":15,"cht":"Reanimation: Sonderfälle","t":"Asthma und Anaphylaxie","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Asthma:<\/strong> 100 % O₂, niedrige Beatmungsfrequenz, bei hohen Drücken diskonnektieren und Thorax ausdrücken; Spannungspneumothorax beidseits ausschließen; eCPR erwägen.<\/li>\n<li><strong>Anaphylaxie:<\/strong> Adrenalin nach ALS, Volumen 10–20 ml/kg und mehr, Atemweg früh und von erfahrener Hand. Steroide routinemäßig nicht mehr empfohlen (ERC 2025).<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  asthma:  100 % o₂, niedrige beatmungsfrequenz, bei hohen drücken diskonnektieren und thorax ausdrücken; spannungspneumothorax beidseits ausschließen; ecpr erwägen. \n  anaphylaxie:  adrenalin nach als, volumen 10–20 ml/kg und mehr, atemweg früh und von erfahrener hand. steroide routinemäßig nicht mehr empfohlen (erc 2025). \n \n  asthma und anaphylaxie"},"rea-hitze":{"ch":15,"cht":"Reanimation: Sonderfälle","t":"Hitzschlag und Stromunfall","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Hitzschlag:<\/strong> Kühlen während der Reanimation fortsetzen.<\/li>\n<li><strong>Stromunfall und Blitz<\/strong> (ERC 2021): Kammerflimmern (Niederspannung) und Asystolie (Hochspannung, Blitz) möglich; prolongierte Reanimation lohnt sich oft. Beim Blitz zuerst die Atemstillstände beatmen.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  hitzschlag:  kühlen während der reanimation fortsetzen. \n  stromunfall und blitz  (erc 2021): kammerflimmern (niederspannung) und asystolie (hochspannung, blitz) möglich; prolongierte reanimation lohnt sich oft. beim blitz zuerst die atemstillstände beatmen. \n \n  hitzschlag und stromunfall"},"ecpr":{"ch":15,"cht":"Reanimation: Sonderfälle","t":"eCPR und Abbruch","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">eCPR erwägen bei<\/div>\n<ul>\n<li>ausgewählten Patienten, bei denen die konventionelle Reanimation versagt, wo ein System dafür besteht (ERC 2025: „may be considered\"),<\/li>\n<li>typischerweise beobachtetem Stillstand mit Laienreanimation, initial defibrillierbarem Rhythmus oder klar reversibler Ursache (Hypothermie, LAE, Intoxikation), biologisch jüngeren Patienten ohne schwere Komorbidität (Kriterien nach lokalem Protokoll),<\/li>\n<li>erreichbarem <strong>ECLS-Fluss innerhalb von 60 min<\/strong> nach Stillstand.<\/li>\n<li>Entscheidung <strong>früh<\/strong> (nach etwa 10–15 min erfolgloser ALS) treffen, mechanische Reanimationshilfe, Zentrum vorwarnen.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Abbruch erwägen<\/div>\n<ul>\n<li>Asystolie über <strong>20 min trotz ALS<\/strong> ohne reversible Ursache.<\/li>\n<li>Termination-of-Resuscitation-Regeln nur, wenn lokal validiert.<\/li>\n<li>Dokumentierter Wille des Patienten.<\/li>\n<li><strong>Keine alleinigen Kriterien:<\/strong> etCO₂ &lt; 10 mmHg nach 20 min (starker Hinweis, aber nicht allein), Ultraschall, Blutgase, Pupillen.<\/li>\n<\/ul>\n<\/div>","text":" \n ecpr erwägen bei \n \n ausgewählten patienten, bei denen die konventionelle reanimation versagt, wo ein system dafür besteht (erc 2025: „may be considered\"), \n typischerweise beobachtetem stillstand mit laienreanimation, initial defibrillierbarem rhythmus oder klar reversibler ursache (hypothermie, lae, intoxikation), biologisch jüngeren patienten ohne schwere komorbidität (kriterien nach lokalem protokoll), \n erreichbarem  ecls-fluss innerhalb von 60 min  nach stillstand. \n entscheidung  früh  (nach etwa 10–15 min erfolgloser als) treffen, mechanische reanimationshilfe, zentrum vorwarnen. \n \n \n \n abbruch erwägen \n \n asystolie über  20 min trotz als  ohne reversible ursache. \n termination-of-resuscitation-regeln nur, wenn lokal validiert. \n dokumentierter wille des patienten. \n  keine alleinigen kriterien:  etco₂ < 10 mmhg nach 20 min (starker hinweis, aber nicht allein), ultraschall, blutgase, pupillen. \n \n  ecpr und abbruch"},"post-rosc":{"ch":15,"cht":"Reanimation: Sonderfälle","t":"Nach ROSC","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>12-Kanal-EKG<\/strong>: STEMI oder hochgradiger Verdacht auf kardiale Ursache → Katheterlabor.<\/li>\n<li><strong>Ziele:<\/strong> SpO₂ 94–98 %, Normokapnie, MAP ≥ 65 mmHg (RR sys &gt; 100 mmHg), BZ im Normbereich, Fieber vermeiden.<\/li>\n<li><strong>Zielklinik:<\/strong> Cardiac Arrest Center, wenn verfügbar.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  12-kanal-ekg : stemi oder hochgradiger verdacht auf kardiale ursache → katheterlabor. \n  ziele:  spo₂ 94–98 %, normokapnie, map ≥ 65 mmhg (rr sys > 100 mmhg), bz im normbereich, fieber vermeiden. \n  zielklinik:  cardiac arrest center, wenn verfügbar. \n \n  nach rosc"},"abk":{"ch":0,"cht":"Abkürzungen","t":"Abkürzungen","html":"<table>\n<thead>\n<tr>\n<th>Abkürzung<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>cABCDE<\/td>\n<td>critical bleeding (kritische Blutung zuerst), Airway, Breathing, Circulation, Disability, Exposure<\/td>\n<\/tr>\n<tr>\n<td>ACS<\/td>\n<td>akutes Koronarsyndrom<\/td>\n<\/tr>\n<tr>\n<td>AECOPD<\/td>\n<td>akute Exazerbation der COPD<\/td>\n<\/tr>\n<tr>\n<td>AEIOU-TIPS<\/td>\n<td>Merkhilfe für Ursachen von Bewusstseinsstörungen<\/td>\n<\/tr>\n<tr>\n<td>AF<\/td>\n<td>Atemfrequenz<\/td>\n<\/tr>\n<tr>\n<td>ÄLRD<\/td>\n<td>Ärztlicher Leiter Rettungsdienst<\/td>\n<\/tr>\n<tr>\n<td>ALS<\/td>\n<td>Advanced Life Support<\/td>\n<\/tr>\n<tr>\n<td>ASS<\/td>\n<td>Acetylsalicylsäure<\/td>\n<\/tr>\n<tr>\n<td>ATMIST<\/td>\n<td>Alter, Zeit, Mechanismus, Befunde (Injuries), Vitalzeichen (Signs), Therapie<\/td>\n<\/tr>\n<tr>\n<td>AV-Block<\/td>\n<td>atrioventrikulärer Block<\/td>\n<\/tr>\n<tr>\n<td>AVNRT<\/td>\n<td>AV-Knoten-Reentry-Tachykardie<\/td>\n<\/tr>\n<tr>\n<td>AVRT<\/td>\n<td>atrioventrikuläre Reentry-Tachykardie (akzessorische Bahn)<\/td>\n<\/tr>\n<tr>\n<td>APGAR<\/td>\n<td>Hautfarbe (Appearance), Puls, Grimassieren, Muskeltonus (Activity), Atmung (Respiration)<\/td>\n<\/tr>\n<tr>\n<td>AWMF<\/td>\n<td>Arbeitsgemeinschaft der Wissenschaftlichen Medizinischen Fachgesellschaften<\/td>\n<\/tr>\n<tr>\n<td>BE-FAST<\/td>\n<td>Balance, Eyes, Face, Arm, Speech, Time<\/td>\n<\/tr>\n<tr>\n<td>BGA<\/td>\n<td>Blutgasanalyse<\/td>\n<\/tr>\n<tr>\n<td>BTF<\/td>\
