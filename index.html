falls \n \n  hintere schulterluxation  (nach krampfanfall oder stromunfall) wird oft übersehen: arm in innenrotation fixiert. \n  luxationsfraktur  nicht präklinisch reponieren. \n \n  lagebild: schulterluxation"},"haematom":{"ch":3,"cht":"Regionalanästhesie in der Präklinik","t":"Lagebild: Distale Radiusfraktur","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Verfahren<\/div>\n<ul>\n<li><strong>Hämatomblock:<\/strong> dorsal über dem Frakturspalt punktieren, <strong>Hämatom aspirieren<\/strong> (bestätigt die Lage), dann <strong>5–15 ml Lidocain 1 %<\/strong> (Maximaldosis beachten) langsam injizieren.<\/li>\n<li><strong>Wirkbeginn 5–10 min<\/strong>, dann Reposition unter Zug, Schienung, pDMS.<\/li>\n<li><strong>Evidenz:<\/strong> schwächer als die intravenöse Regionalanästhesie, aber vergleichbar mit Analgosedierung und präklinisch einfach. Streng aseptisch (die Fraktur wird punktiert).<\/li>\n<\/ul>\n<\/div>","text":" \n verfahren \n \n  hämatomblock:  dorsal über dem frakturspalt punktieren,  hämatom aspirieren  (bestätigt die lage), dann  5–15 ml lidocain 1 %  (maximaldosis beachten) langsam injizieren. \n  wirkbeginn 5–10 min , dann reposition unter zug, schienung, pdms. \n  evidenz:  schwächer als die intravenöse regionalanästhesie, aber vergleichbar mit analgosedierung und präklinisch einfach. streng aseptisch (die fraktur wird punktiert). \n \n  lagebild: distale radiusfraktur"},"finger":{"ch":3,"cht":"Regionalanästhesie in der Präklinik","t":"Lagebild: Finger","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Verfahren<\/div>\n<ul>\n<li><strong>Fingerblock (Oberst):<\/strong> dorsaler Zugang an der Fingerbasis beidseits, je <strong>2–3 ml<\/strong> Lidocain oder Prilocain 1 %, zuerst dorsal, dann Nadel nach palmar vorschieben.<\/li>\n<li>Danach Reposition einer Fingerluxation unter Längszug, Wundversorgung, Schienung.<\/li>\n<li>Adrenalin-Zusatz gilt heute als sicher, ist präklinisch aber nicht nötig.<\/li>\n<\/ul>\n<\/div>","text":" \n verfahren \n \n  fingerblock (oberst):  dorsaler zugang an der fingerbasis beidseits, je  2–3 ml  lidocain oder prilocain 1 %, zuerst dorsal, dann nadel nach palmar vorschieben. \n danach reposition einer fingerluxation unter längszug, wundversorgung, schienung. \n adrenalin-zusatz gilt heute als sicher, ist präklinisch aber nicht nötig. \n \n  lagebild: finger"},"rippen":{"ch":3,"cht":"Regionalanästhesie in der Präklinik","t":"Lagebild: Rippenserienfraktur","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Verfahren<\/div>\n<ul>\n<li><strong>Standard:<\/strong> systemische Analgesie (Opioid, Esketamin, Metamizol), Oberkörper hoch, NIV/CPAP bei Hypoxie.<\/li>\n<li><strong>Serratus-anterior- oder Erector-spinae-Block<\/strong> nur mit Ultraschall und Routine (20–30 ml, Maximaldosis beachten). Präklinische Daten fehlen; Pneumothorax vorher ausschließen bzw. mitbedenken.<\/li>\n<li>Unter Antikoagulation zurückhaltend.<\/li>\n<\/ul>\n<\/div>","text":" \n verfahren \n \n  standard:  systemische analgesie (opioid, esketamin, metamizol), oberkörper hoch, niv/cpap bei hypoxie. \n  serratus-anterior- oder erector-spinae-block  nur mit ultraschall und routine (20–30 ml, maximaldosis beachten). präklinische daten fehlen; pneumothorax vorher ausschließen bzw. mitbedenken. \n unter antikoagulation zurückhaltend. \n \n  lagebild: rippenserienfraktur"},"last":{"ch":3,"cht":"Regionalanästhesie in der Präklinik","t":"Lokalanästhetika-Intoxikation (LAST)","html":"<div class=\"box box-rf\">\n<div class=\"box-label\">Red Flags<\/div>\n<ul>\n<li><strong>ZNS:<\/strong> periorales Taubheitsgefühl, Metallgeschmack, Tinnitus, Sehstörungen, Unruhe, Verwirrtheit, Krampfanfall, Koma.<\/li>\n<li><strong>Herz:<\/strong> zunächst Tachykardie und Hypertonie, dann Bradykardie, QRS-Verbreiterung, VT/VF, Asystolie. Kardiale Symptome können ohne ZNS-Prodromi auftreten.<\/li>\n<li><strong>Zeitpunkt:<\/strong> meist innerhalb von Minuten, bei Faszienblöcken auch verzögert bis 30–60 min.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Sofortmaßnahmen<\/div>\n<ul>\n<li><strong>Injektion stoppen<\/strong>, Hilfe holen, Atemweg sichern, 100 % O₂; Hypoxie, Hyperkapnie und Azidose vermeiden.<\/li>\n<li><strong>Krampfanfall:<\/strong> Benzodiazepin (Midazolam 2–5 mg i.v.); bei stabilem Kreislauf auch kleine Propofol-Dosen.<\/li>\n<li><strong>Lipidemulsion 20 % früh<\/strong>, bei schweren Zeichen schon vor dem Kreislaufstillstand.<\/li>\n<li><strong>Reanimation:<\/strong> ALS; Adrenalin nach DGAI in Standarddosis, ASRA empfiehlt ≤ 1 µg/kg. <strong>Kein Vasopressin<\/strong>, keine Kalziumantagonisten, keine Betablocker, <strong>kein Lidocain<\/strong> als Antiarrhythmikum; bei VT Amiodaron. Lange reanimieren, früh eCPR erwägen.<\/li>\n<li><strong>Nach LAST<\/strong> in die Klinik: Überwachung bei ZNS-Symptomen ≥ 2 h, bei kardialen Symptomen 4–6 h.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-dosis\">\n<div class=\"box-label\">Lipidemulsion 20 %<\/div>\n<table>\n<thead>\n<tr>\n<th>Schritt<\/th>\n<th>Dosis<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bolus<\/td>\n<td>100 ml über 2–3 min (≥ 70 kg); &lt; 70 kg 1,5 ml/kg<\/td>\n<\/tr>\n<tr>\n<td>Infusion<\/td>\n<td>0,25 ml/kg/min (etwa 200–250 ml über 15–20 min)<\/td>\n<\/tr>\n<tr>\n<td>Bei Instabilität<\/td>\n<td>Bolus nach 5 min 1–2-mal wiederholen, Infusion verdoppeln<\/td>\n<\/tr>\n<tr>\n<td>Dauer<\/td>\n<td>bis mindestens 10 min nach Stabilisierung<\/td>\n<\/tr>\n<tr>\n<td>Maximum<\/td>\n<td>etwa 12 ml/kg (≈ 850–900 ml bei 70 kg)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"box box-merke\">\n<div class=\"box-label\">Merke<\/div>\n<p>Eine 500-ml-Flasche reicht bei 70 kg für Bolus, Infusion und einen Wiederholungsbolus (≈ 450 ml), nicht für die Maximaldosis. Propofol ist kein Ersatz für Lipid.<\/p>\n<\/div>","text":" \n red flags \n \n  zns:  periorales taubheitsgefühl, metallgeschmack, tinnitus, sehstörungen, unruhe, verwirrtheit, krampfanfall, koma. \n  herz:  zunächst tachykardie und hypertonie, dann bradykardie, qrs-verbreiterung, vt/vf, asystolie. kardiale symptome können ohne zns-prodromi auftreten. \n  zeitpunkt:  meist innerhalb von minuten, bei faszienblöcken auch verzögert bis 30–60 min. \n \n \n \n sofortmaßnahmen \n \n  injektion stoppen , hilfe holen, atemweg sichern, 100 % o₂; hypoxie, hyperkapnie und azidose vermeiden. \n  krampfanfall:  benzodiazepin (midazolam 2–5 mg i.v.); bei stabilem kreislauf auch kleine propofol-dosen. \n  lipidemulsion 20 % früh , bei schweren zeichen schon vor dem kreislaufstillstand. \n  reanimation:  als; adrenalin nach dgai in standarddosis, asra empfiehlt ≤ 1 µg/kg.  kein vasopressin , keine kalziumantagonisten, keine betablocker,  kein lidocain  als antiarrhythmikum; bei vt amiodaron. lange reanimieren, früh ecpr erwägen. \n  nach last  in die klinik: überwachung bei zns-symptomen ≥ 2 h, bei kardialen symptomen 4–6 h. \n \n \n \n lipidemulsion 20 % \n \n \n \n schritt \n dosis \n \n \n \n \n bolus \n 100 ml über 2–3 min (≥ 70 kg); < 70 kg 1,5 ml/kg \n \n \n infusion \n 0,25 ml/kg/min (etwa 200–250 ml über 15–20 min) \n \n \n bei instabilität \n bolus nach 5 min 1–2-mal wiederholen, infusion verdoppeln \n \n \n dauer \n bis mindestens 10 min nach stabilisierung \n \n \n maximum \n etwa 12 ml/kg (≈ 850–900 ml bei 70 kg) \n \n \n \n \n \n merke \n eine 500-ml-flasche reicht bei 70 kg für bolus, infusion und einen wiederholungsbolus (≈ 450 ml), nicht für die maximaldosis. propofol ist kein ersatz für lipid. \n  lokalanästhetika-intoxikation (last)"},"ra-uebergabe":{"ch":3,"cht":"Regionalanästhesie in der Präklinik","t":"Kompartmentsyndrom und Übergabe","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Kompartmentsyndrom:<\/strong> Regionalanästhesie ist nach britischem Konsens (2021) keine Kontraindikation, wenn niedrige Konzentrationen verwendet, dichte Blockaden vermieden und die Weiterbehandler informiert werden. Ischämieschmerz durchbricht meist den Block. Vorsicht bei Hochrisikoverletzungen (Unterschenkelschaft, Unterarm, junge Männer). Der FICB erfasst den Unterschenkel ohnehin nicht.<\/li>\n<li><strong>Dokumentation und Übergabe:<\/strong> Verfahren, Substanz, Konzentration, Volumen, Uhrzeit, Neurostatus vorher. Auf Pflaster oder Haut notieren, z. B. „FICB re 14:20, Prilocain 1 % 40 ml\". Die Klinik muss die bereits gegebene LA-Menge kennen, bevor sie erneut blockiert.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  kompartmentsyndrom:  regionalanästhesie ist nach britischem konsens (2021) keine kontraindikation, wenn niedrige konzentrationen verwendet, dichte blockaden vermieden und die weiterbehandler informiert werden. ischämieschmerz durchbricht meist den block. vorsicht bei hochrisikoverletzungen (unterschenkelschaft, unterarm, junge männer). der ficb erfasst den unterschenkel ohnehin nicht. \n  dokumentation und übergabe:  verfahren, substanz, konzentration, volumen, uhrzeit, neurostatus vorher. auf pflaster oder haut notieren, z. b. „ficb re 14:20, prilocain 1 % 40 ml\". die klinik muss die bereits gegebene la-menge kennen, bevor sie erneut blockiert. \n \n  kompartmentsyndrom und übergabe"},"acs":{"ch":4,"cht":"Herz und Kreislauf","t":"Akutes Koronarsyndrom","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>12-Kanal-EKG innerhalb von 10 min<\/strong> nach Erstkontakt, bei inferiorem Infarkt zusätzlich <strong>V4R<\/strong>, bei ST-Senkung V1–V3 zusätzlich <strong>V7–V9<\/strong>. EKG übertragen, Befund telefonisch mit dem Katheterlabor besprechen.<\/li>\n<li><strong>STEMI und STEMI-Äquivalente<\/strong> direkt ins 24/7-Katheterlabor, Notaufnahme umgehen. Primäre PCI, wenn sie <strong>innerhalb von 120 min ab Diagnose<\/strong> möglich ist (Ziel Diagnose bis Draht ≤ 90 min); sonst Lyse innerhalb von 10 min nach Diagnose.<\/li>\n<li><strong>NSTE-ACS mit sehr hohem Risiko<\/strong> (Instabilität, Schock, therapierefraktärer Schmerz, maligne Rhythmusstörung, akute Herzinsuffizienz, dynamische oder intermittierende ST-Hebung) wie STEMI behandeln: sofortige Koronarangiografie.<\/li>\n<li><strong>Sauerstoff nur bei SpO₂ &lt; 90 %.<\/strong><\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-dosis\">\n<div class=\"box-label\">Medikamente &amp; Dosis<\/div>\n<table>\n<thead>\n<tr>\n<th>Substanz<\/th>\n<th>Dosis<\/th>\n<th>Bemerkung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ASS<\/td>\n<td>150–300 mg p.o. oder 75–250 mg i.v.<\/td>\n<td>bei jedem ACS ohne Kontraindikation<\/td>\n<\/tr>\n<tr>\n<td>Heparin (UFH)<\/td>\n<td>70–100 IE/kg i.v. (meist 5000 IE)<\/td>\n<td>bei STEMI vor PCI; bei NSTE-ACS nach Diagnose<\/td>\n<\/tr>\n<tr>\n<td>P2Y12-Hemmer<\/td>\n<td>präklinisch nicht routinemäßig<\/td>\n<td>STEMI: „kann erwogen werden\" (IIb); NSTE-ACS mit Katheter &lt; 24 h: nicht empfohlen (III)<\/td>\n<\/tr>\n<tr>\n<td>Nitroglyzerin<\/td>\n<td>0,4–0,8 mg s.l., wiederholbar<\/td>\n<td>nur bei RR sys &gt; 90 mmHg<\/td>\n<\/tr>\n<tr>\n<td>Fentanyl / Morphin<\/td>\n<td>25–50 µg / 2–5 mg i.v. titriert<\/td>\n<td>Opioide verzögern die P2Y12-Wirkung<\/td>\n<\/tr>\n<tr>\n<td>Metoclopramid / Ondansetron<\/td>\n<td>10 mg / 4 mg i.v.<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Patient unter DOAK (DGK/DIVI-Konsens 2021)<\/div>\n<ul>\n<li><strong>ASS<\/strong> 150–325 mg wie üblich.<\/li>\n<li><strong>STEMI:<\/strong> UFH 60–70 IE/kg, <strong>max. 5000 IE<\/strong>, unabhängig von der letzten DOAK-Einnahme.<\/li>\n<li><strong>NSTE-ACS:<\/strong> Heparin nur, wenn die Einnahme unklar ist oder die letzte Dosis lange zurückliegt (&gt; 24 h bei 1× täglich, &gt; 12 h bei 2× täglich) bzw. bei hohem Risiko; sonst kein Heparin.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-neu\">\n<div class=\"box-label\">Evidenz &amp; Neu<\/div>\n<ul>\n<li><strong>5. Universelle MI-Definition (2026):<\/strong> Die Typen 1–5 werden ersetzt durch primären, sekundären und prozedurbezogenen Infarkt; geschlechtsspezifische Troponin-Grenzwerte. Präklinisch ändert sich nichts.<\/li>\n<li>Die nächste ESC-ACS-Leitlinie ist für 2027 angekündigt; bis dahin gilt ESC 2023.<\/li>\n<\/ul>\n<\/div>\n<h3 id=\"k400-stemi-kriterien-und-infarktlokalisation\">STEMI-Kriterien und Infarktlokalisation<\/h3>\n<div class=\"box box-kern\">\n<div class=\"box-label\">STEMI-Kriterien<\/div>\n<ul>\n<li>Neue ST-Hebung am J-Punkt in <strong>≥ 2 benachbarten Ableitungen<\/strong>: <strong>≥ 1 mm<\/strong> in allen Ableitungen außer V2–V3.<\/li>\n<li><strong>V2–V3:<\/strong> Männer ≥ 40 J ≥ 2 mm, Männer &lt; 40 J ≥ 2,5 mm, Frauen ≥ 1,5 mm.<\/li>\n<li><strong>V7–V9 und V3R/V4R:<\/strong> ≥ 0,5 mm.<\/li>\n<li><strong>Spiegelbildliche ST-Senkung<\/strong> in der Gegenregion stützt die Diagnose (inferior ↔ I, aVL).<\/li>\n<\/ul>\n<\/div>\n<table>\n<thead>\n<tr>\n<th>Hebung in<\/th>\n<th>Region<\/th>\n<th>Gefäß (meist)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>V1–V4<\/td>\n<td>anterior, anteroseptal<\/td>\n<td>RIVA<\/td>\n<\/tr>\n<tr>\n<td>I, aVL, V5–V6<\/td>\n<td>lateral (I, aVL: hochlateral)<\/td>\n<td>RCX oder Diagonalast<\/td>\n<\/tr>\n<tr>\n<td><strong>II, III, aVF<\/strong><\/td>\n<td><strong>inferior<\/strong><\/td>\n<td><strong>RCA (etwa 80 %)<\/strong>, sonst RCX<\/td>\n<\/tr>\n<tr>\n<td>V7–V9 (dazu Senkung V1–V3)<\/td>\n<td>posterior<\/td>\n<td>RCX oder RCA<\/td>\n<\/tr>\n<tr>\n<td>V4R, V3R<\/td>\n<td>rechtsventrikulär<\/td>\n<td>proximale RCA<\/td>\n<\/tr>\n<tr>\n<td>aVR (dazu Senkung in ≥ 6 Ableitungen)<\/td>\n<td>Hauptstamm oder Dreigefäß<\/td>\n<td>LCA-Hauptstamm<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"box box-merke\">\n<div class=\"box-label\">Merke<\/div>\n<p><strong>Inferior:<\/strong> III &gt; II und Senkung in I/aVL spricht für die RCA, dann immer V4R ableiten (RV-Beteiligung: kein Nitrat, Volumen). II ≥ III mit Hebung in I, aVL oder V5–V6 spricht für die RCX.<\/p>\n<\/div>\n<h3 id=\"k400-stemi-aequivalente-omi\">STEMI-Äquivalente (OMI)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Muster<\/th>\n<th>Hinweis<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Posteriorer Infarkt<\/td>\n<td>horizontale ST-Senkung V1–V3, hohe R-Zacken; V7–V9 ≥ 0,5 mm Hebung<\/td>\n<\/tr>\n<tr>\n<td>De-Winter-Muster<\/td>\n<td>aszendierende ST-Senkung V1–V6 mit hohen, symmetrischen T-Wellen (proximaler RIVA)<\/td>\n<\/tr>\n<tr>\n<td>LSB oder Schrittmacher<\/td>\n<td>Sgarbossa- bzw. Smith-modifizierte Kriterien; bei Instabilität wie STEMI<\/td>\n<\/tr>\n<tr>\n<td>ST-Hebung aVR + ST-Senkung in ≥ 6 Ableitungen<\/td>\n<td>Hauptstamm oder Mehrgefäß; mit Instabilität sofort invasiv<\/td>\n<\/tr>\n<tr>\n<td>Hyperakute T-Wellen<\/td>\n<td>breit, hoch, im Verlauf EKG wiederholen<\/td>\n<\/tr>\n<tr>\n<td>Wellens<\/td>\n<td>biphasische oder tiefe T-Negativierung V2–V3 im schmerzfreien Intervall: kritische RIVA-Stenose<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Aortendissektion als STEMI-Imitator<\/strong> (meist RCA, inferior): Rückenschmerz, Pulsdifferenz, neurologisches Defizit. ASS und Heparin können hier tödlich sein; im Zweifel POCUS (Perikarderguss, Aortenwurzel) und Rücksprache.<\/li>\n<li><strong>Rechtsventrikulärer Infarkt:<\/strong> Nitrat und Opioid können den Kreislauf kollabieren lassen; vorsichtig Volumen 250 ml-weise.<\/li>\n<li><strong>Nitrat nach PDE-5-Hemmer:<\/strong> Sildenafil 24 h, Tadalafil 48 h Abstand.<\/li>\n<li><strong>Normales EKG schließt nichts aus.<\/strong> Bei anhaltender Klinik nach 10–15 min wiederholen.<\/li>\n<li><strong>Kokain-Brustschmerz:<\/strong> zuerst Benzodiazepin und Nitrat.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  12-kanal-ekg innerhalb von 10 min  nach erstkontakt, bei inferiorem infarkt zusätzlich  v4r , bei st-senkung v1–v3 zusätzlich  v7–v9 . ekg übertragen, befund telefonisch mit dem katheterlabor besprechen. \n  stemi und stemi-äquivalente  direkt ins 24/7-katheterlabor, notaufnahme umgehen. primäre pci, wenn sie  innerhalb von 120 min ab diagnose  möglich ist (ziel diagnose bis draht ≤ 90 min); sonst lyse innerhalb von 10 min nach diagnose. \n  nste-acs mit sehr hohem risiko  (instabilität, schock, therapierefraktärer schmerz, maligne rhythmusstörung, akute herzinsuffizienz, dynamische oder intermittierende st-hebung) wie stemi behandeln: sofortige koronarangiografie. \n  sauerstoff nur bei spo₂ < 90 %.  \n \n \n \n medikamente & dosis \n \n \n \n substanz \n dosis \n bemerkung \n \n \n \n \n ass \n 150–300 mg p.o. oder 75–250 mg i.v. \n bei jedem acs ohne kontraindikation \n \n \n heparin (ufh) \n 70–100 ie/kg i.v. (meist 5000 ie) \n bei stemi vor pci; bei nste-acs nach diagnose \n \n \n p2y12-hemmer \n präklinisch nicht routinemäßig \n stemi: „kann erwogen werden\" (iib); nste-acs mit katheter < 24 h: nicht empfohlen (iii) \n \n \n nitroglyzerin \n 0,4–0,8 mg s.l., wiederholbar \n nur bei rr sys > 90 mmhg \n \n \n fentanyl / morphin \n 25–50 µg / 2–5 mg i.v. titriert \n opioide verzögern die p2y12-wirkung \n \n \n metoclopramid / ondansetron \n 10 mg / 4 mg i.v. \n  \n \n \n \n \n \n patient unter doak (dgk/divi-konsens 2021) \n \n  ass  150–325 mg wie üblich. \n  stemi:  ufh 60–70 ie/kg,  max. 5000 ie , unabhängig von der letzten doak-einnahme. \n  nste-acs:  heparin nur, wenn die einnahme unklar ist oder die letzte dosis lange zurückliegt (> 24 h bei 1× täglich, > 12 h bei 2× täglich) bzw. bei hohem risiko; sonst kein heparin. \n \n \n \n evidenz & neu \n \n  5. universelle mi-definition (2026):  die typen 1–5 werden ersetzt durch primären, sekundären und prozedurbezogenen infarkt; geschlechtsspezifische troponin-grenzwerte. präklinisch ändert sich nichts. \n die nächste esc-acs-leitlinie ist für 2027 angekündigt; bis dahin gilt esc 2023. \n \n \n stemi-kriterien und infarktlokalisation \n \n stemi-kriterien \n \n neue st-hebung am j-punkt in  ≥ 2 benachbarten ableitungen :  ≥ 1 mm  in allen ableitungen außer v2–v3. \n  v2–v3:  männer ≥ 40 j ≥ 2 mm, männer < 40 j ≥ 2,5 mm, frauen ≥ 1,5 mm. \n  v7–v9 und v3r/v4r:  ≥ 0,5 mm. \n  spiegelbildliche st-senkung  in der gegenregion stützt die diagnose (inferior ↔ i, avl). \n \n \n \n \n \n hebung in \n region \n gefäß (meist) \n \n \n \n \n v1–v4 \n anterior, anteroseptal \n riva \n \n \n i, avl, v5–v6 \n lateral (i, avl: hochlateral) \n rcx oder diagonalast \n \n \n  ii, iii, avf  \n  inferior  \n  rca (etwa 80 %) , sonst rcx \n \n \n v7–v9 (dazu senkung v1–v3) \n posterior \n rcx oder rca \n \n \n v4r, v3r \n rechtsventrikulär \n proximale rca \n \n \n avr (dazu senkung in ≥ 6 ableitungen) \n hauptstamm oder dreigefäß \n lca-hauptstamm \n \n \n \n \n merke \n  inferior:  iii > ii und senkung in i/avl spricht für die rca, dann immer v4r ableiten (rv-beteiligung: kein nitrat, volumen). ii ≥ iii mit hebung in i, avl oder v5–v6 spricht für die rcx. \n \n stemi-äquivalente (omi) \n \n \n \n muster \n hinweis \n \n \n \n \n posteriorer infarkt \n horizontale st-senkung v1–v3, hohe r-zacken; v7–v9 ≥ 0,5 mm hebung \n \n \n de-winter-muster \n aszendierende st-senkung v1–v6 mit hohen, symmetrischen t-wellen (proximaler riva) \n \n \n lsb oder schrittmacher \n sgarbossa- bzw. smith-modifizierte kriterien; bei instabilität wie stemi \n \n \n st-hebung avr + st-senkung in ≥ 6 ableitungen \n hauptstamm oder mehrgefäß; mit instabilität sofort invasiv \n \n \n hyperakute t-wellen \n breit, hoch, im verlauf ekg wiederholen \n \n \n wellens \n biphasische oder tiefe t-negativierung v2–v3 im schmerzfreien intervall: kritische riva-stenose \n \n \n \n \n pitfalls \n \n  aortendissektion als stemi-imitator  (meist rca, inferior): rückenschmerz, pulsdifferenz, neurologisches defizit. ass und heparin können hier tödlich sein; im zweifel pocus (perikarderguss, aortenwurzel) und rücksprache. \n  rechtsventrikulärer infarkt:  nitrat und opioid können den kreislauf kollabieren lassen; vorsichtig volumen 250 ml-weise. \n  nitrat nach pde-5-hemmer:  sildenafil 24 h, tadalafil 48 h abstand. \n  normales ekg schließt nichts aus.  bei anhaltender klinik nach 10–15 min wiederholen. \n  kokain-brustschmerz:  zuerst benzodiazepin und nitrat. \n \n  akutes koronarsyndrom"},"brady":{"ch":4,"cht":"Herz und Kreislauf","t":"Bradykarde Rhythmusstörungen","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Instabilitätszeichen:<\/strong> Schock, Synkope, Myokardischämie, Herzinsuffizienz. Fehlen sie, reicht meist Monitoring und Transport.<\/li>\n<li><strong>Atropin<\/strong> 0,5 mg i.v. alle 3–5 min, max. 3 mg (ERC 2025).<\/li>\n<li><strong>Adrenalin<\/strong> 2–10 µg/min als Perfusor (1 mg auf 50 ml = 20 µg/ml → 6–30 ml/h) oder 5–10 µg-Boli zur Überbrückung. Alternative Isoprenalin 5 µg/min.<\/li>\n<li><strong>Transkutane Stimulation<\/strong> als Brücke bei fehlendem Ansprechen: Demand-Modus, Frequenz 70/min, Stromstärke bis zum elektrischen und <strong>mechanischen<\/strong> Capture (Pulskontrolle femoral). Analgosedierung nicht vergessen. Ziel ist die frühe transvenöse Stimulation in der Klinik.<\/li>\n<li><strong>Theophyllin/Aminophyllin<\/strong> 100–200 mg langsam i.v. nach Herztransplantation und bei Rückenmarksverletzung.<\/li>\n<\/ul>\n<\/div>\n<table>\n<thead>\n<tr>\n<th>AV-Block<\/th>\n<th>EKG<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>I°<\/td>\n<td>PQ &gt; 200 ms, konstant<\/td>\n<td>meist harmlos<\/td>\n<\/tr>\n<tr>\n<td>II° Wenckebach (Mobitz I)<\/td>\n<td>PQ wird länger bis zum Ausfall eines QRS<\/td>\n<td>meist AV-Knoten, oft harmlos (inferiorer Infarkt, Vagus)<\/td>\n<\/tr>\n<tr>\n<td>II° Mobitz II<\/td>\n<td>PQ konstant, plötzlich ausfallendes QRS<\/td>\n<td>infranodal, Gefahr des III°<\/td>\n<\/tr>\n<tr>\n<td>III°<\/td>\n<td>P und QRS unabhängig voneinander<\/td>\n<td>schmaler Ersatzrhythmus (junktional) stabiler als breiter (ventrikulär)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Höhergradiger AV-Block mit breitem QRS:<\/strong> kein Atropin (ERC 2025: unwirksam, kann den Block verschlechtern); früh Adrenalin und Pacing.<\/li>\n<li><strong>Herztransplantierte:<\/strong> Atropin wirkungslos, paradoxe Reaktionen möglich.<\/li>\n<li><strong>Ursachen mitdenken:<\/strong> Hyperkaliämie (Kalzium), Betablocker- und Kalziumantagonisten-Intoxikation (Kalzium, Glukagon), Digitalis, inferiorer Infarkt, Hypothermie (nicht behandeln), Hirndruck (Cushing).<\/li>\n<li>Elektrisches Capture auf dem Monitor ohne tastbaren Puls ist <strong>kein<\/strong> Erfolg.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  instabilitätszeichen:  schock, synkope, myokardischämie, herzinsuffizienz. fehlen sie, reicht meist monitoring und transport. \n  atropin  0,5 mg i.v. alle 3–5 min, max. 3 mg (erc 2025). \n  adrenalin  2–10 µg/min als perfusor (1 mg auf 50 ml = 20 µg/ml → 6–30 ml/h) oder 5–10 µg-boli zur überbrückung. alternative isoprenalin 5 µg/min. \n  transkutane stimulation  als brücke bei fehlendem ansprechen: demand-modus, frequenz 70/min, stromstärke bis zum elektrischen und  mechanischen  capture (pulskontrolle femoral). analgosedierung nicht vergessen. ziel ist die frühe transvenöse stimulation in der klinik. \n  theophyllin/aminophyllin  100–200 mg langsam i.v. nach herztransplantation und bei rückenmarksverletzung. \n \n \n \n \n \n av-block \n ekg \n bedeutung \n \n \n \n \n i° \n pq > 200 ms, konstant \n meist harmlos \n \n \n ii° wenckebach (mobitz i) \n pq wird länger bis zum ausfall eines qrs \n meist av-knoten, oft harmlos (inferiorer infarkt, vagus) \n \n \n ii° mobitz ii \n pq konstant, plötzlich ausfallendes qrs \n infranodal, gefahr des iii° \n \n \n iii° \n p und qrs unabhängig voneinander \n schmaler ersatzrhythmus (junktional) stabiler als breiter (ventrikulär) \n \n \n \n \n pitfalls \n \n  höhergradiger av-block mit breitem qrs:  kein atropin (erc 2025: unwirksam, kann den block verschlechtern); früh adrenalin und pacing. \n  herztransplantierte:  atropin wirkungslos, paradoxe reaktionen möglich. \n  ursachen mitdenken:  hyperkaliämie (kalzium), betablocker- und kalziumantagonisten-intoxikation (kalzium, glukagon), digitalis, inferiorer infarkt, hypothermie (nicht behandeln), hirndruck (cushing). \n elektrisches capture auf dem monitor ohne tastbaren puls ist  kein  erfolg. \n \n  bradykarde rhythmusstörungen"},"tachy":{"ch":4,"cht":"Herz und Kreislauf","t":"Tachykarde Rhythmusstörungen","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Instabil<\/strong> (Schock, Synkope, Ischämie, Herzinsuffizienz): <strong>synchronisierte Kardioversion<\/strong> unter Sedierung, bis zu 3 Versuche. Danach Amiodaron 300 mg über 10–20 min und erneuter Versuch.<\/li>\n<li><strong>Stabil, schmal, regelmäßig:<\/strong> modifiziertes Valsalva-Manöver, dann <strong>Adenosin<\/strong> 6 mg schnell i.v. mit 20 ml-Spülbolus, dann 12 mg, dann 18 mg (ERC 2025). Rhythmusstreifen während der Gabe mitlaufen lassen.<\/li>\n<li><strong>Stabil, breit, regelmäßig:<\/strong> als VT behandeln. Amiodaron 300 mg über 10–60 min (in Deutschland alternativ Ajmalin 50 mg langsam über 5 min).<\/li>\n<li><strong>Vorhofflimmern stabil:<\/strong> präklinisch meist nur Frequenzkontrolle bei Symptomen: Metoprolol 2,5–5 mg i.v. (fraktioniert, max. 15 mg); bei eingeschränkter LV-Funktion Amiodaron. Keine präklinische Rhythmisierung bei stabilem Patienten.<\/li>\n<li><strong>Torsade de pointes:<\/strong> Magnesium 2 g (8 mmol) i.v. über 10 min, Elektrolyte, QT-verlängernde Medikamente stoppen.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-dosis\">\n<div class=\"box-label\">Energie bei synchronisierter Kardioversion (ERC 2025, biphasisch)<\/div>\n<table>\n<thead>\n<tr>\n<th>Rhythmus<\/th>\n<th>Erster Schock<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Vorhofflimmern<\/td>\n<td>maximale Geräteenergie<\/td>\n<\/tr>\n<tr>\n<td>Breitkomplex-Tachykardie (VT mit Puls)<\/td>\n<td>120–150 J, dann steigern<\/td>\n<\/tr>\n<tr>\n<td>Vorhofflattern, PSVT<\/td>\n<td>70–120 J, dann steigern<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<h3 id=\"k402-tachykardie-einordnen\">Tachykardie einordnen<\/h3>\n<table>\n<thead>\n<tr>\n<th>Bild<\/th>\n<th>Denken an<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Schmal, regelmäßig, Frequenz genau um 150/min<\/td>\n<td>Vorhofflattern 2:1 (Sägezahn in II, III, aVF)<\/td>\n<\/tr>\n<tr>\n<td>Schmal, regelmäßig, abrupter Beginn, keine P-Wellen sichtbar<\/td>\n<td>AVNRT (Pseudo-r' in V1) oder AVRT<\/td>\n<\/tr>\n<tr>\n<td>Schmal, regelmäßig, P vor jedem QRS, langsamer Anstieg<\/td>\n<td>Sinustachykardie: Ursache suchen<\/td>\n<\/tr>\n<tr>\n<td>Schmal, unregelmäßig<\/td>\n<td>Vorhofflimmern, multifokale atriale Tachykardie<\/td>\n<\/tr>\n<tr>\n<td>Breit, regelmäßig<\/td>\n<td>VT, bis das Gegenteil bewiesen ist<\/td>\n<\/tr>\n<tr>\n<td>Breit, unregelmäßig, wechselnde Breite<\/td>\n<td>präexzitiertes Vorhofflimmern (WPW)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Hinweise auf VT<\/div>\n<ul>\n<li>QRS sehr breit (&gt; 140 ms bei Rechtsschenkelblock-, &gt; 160 ms bei Linksschenkelblock-Bild), extreme Achse (positiv in aVR).<\/li>\n<li>AV-Dissoziation, Capture- und Fusionsschläge, Konkordanz in V1–V6.<\/li>\n<li>Alter &gt; 35 J, KHK, Herzinsuffizienz oder Infarkt in der Anamnese: VT viel wahrscheinlicher als SVT mit Schenkelblock.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-merke\">\n<div class=\"box-label\">Merke<\/div>\n<p><strong>Modifiziertes Valsalva (REVERT):<\/strong> 15 s halbsitzend gegen Widerstand pressen (10-ml-Spritze aufblasen, ca. 40 mmHg), dann sofort flach hinlegen und Beine 45° für 15 s anheben. Erfolgsrate etwa 43 % gegenüber 17 % beim klassischen Valsalva.<\/p>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Präexzitiertes Vorhofflimmern (WPW):<\/strong> breit, unregelmäßig, wechselnde QRS-Morphologie. <strong>Keine<\/strong> AV-Knoten-Blocker (Adenosin, Verapamil, Betablocker, Digitalis). Bei Instabilität kardiovertieren, sonst Ajmalin.<\/li>\n<li><strong>Verapamil bei VT<\/strong> kann zum Kreislaufstillstand führen. Breite Tachykardie im Zweifel immer als VT behandeln.<\/li>\n<li><strong>Sinustachykardie ist eine Antwort, keine Krankheit:<\/strong> Sepsis, Blutung, LAE, Hypovolämie, Schmerz. Nicht die Frequenz behandeln.<\/li>\n<li><strong>Adenosin:<\/strong> reduzierte Dosis (3 mg) nach Herztransplantation, unter Dipyridamol und über ZVK. Patienten vorher über das kurze Vernichtungsgefühl aufklären.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  instabil  (schock, synkope, ischämie, herzinsuffizienz):  synchronisierte kardioversion  unter sedierung, bis zu 3 versuche. danach amiodaron 300 mg über 10–20 min und erneuter versuch. \n  stabil, schmal, regelmäßig:  modifiziertes valsalva-manöver, dann  adenosin  6 mg schnell i.v. mit 20 ml-spülbolus, dann 12 mg, dann 18 mg (erc 2025). rhythmusstreifen während der gabe mitlaufen lassen. \n  stabil, breit, regelmäßig:  als vt behandeln. amiodaron 300 mg über 10–60 min (in deutschland alternativ ajmalin 50 mg langsam über 5 min). \n  vorhofflimmern stabil:  präklinisch meist nur frequenzkontrolle bei symptomen: metoprolol 2,5–5 mg i.v. (fraktioniert, max. 15 mg); bei eingeschränkter lv-funktion amiodaron. keine präklinische rhythmisierung bei stabilem patienten. \n  torsade de pointes:  magnesium 2 g (8 mmol) i.v. über 10 min, elektrolyte, qt-verlängernde medikamente stoppen. \n \n \n \n energie bei synchronisierter kardioversion (erc 2025, biphasisch) \n \n \n \n rhythmus \n erster schock \n \n \n \n \n vorhofflimmern \n maximale geräteenergie \n \n \n breitkomplex-tachykardie (vt mit puls) \n 120–150 j, dann steigern \n \n \n vorhofflattern, psvt \n 70–120 j, dann steigern \n \n \n \n \n tachykardie einordnen \n \n \n \n bild \n denken an \n \n \n \n \n schmal, regelmäßig, frequenz genau um 150/min \n vorhofflattern 2:1 (sägezahn in ii, iii, avf) \n \n \n schmal, regelmäßig, abrupter beginn, keine p-wellen sichtbar \n avnrt (pseudo-r' in v1) oder avrt \n \n \n schmal, regelmäßig, p vor jedem qrs, langsamer anstieg \n sinustachykardie: ursache suchen \n \n \n schmal, unregelmäßig \n vorhofflimmern, multifokale atriale tachykardie \n \n \n breit, regelmäßig \n vt, bis das gegenteil bewiesen ist \n \n \n breit, unregelmäßig, wechselnde breite \n präexzitiertes vorhofflimmern (wpw) \n \n \n \n \n hinweise auf vt \n \n qrs sehr breit (> 140 ms bei rechtsschenkelblock-, > 160 ms bei linksschenkelblock-bild), extreme achse (positiv in avr). \n av-dissoziation, capture- und fusionsschläge, konkordanz in v1–v6. \n alter > 35 j, khk, herzinsuffizienz oder infarkt in der anamnese: vt viel wahrscheinlicher als svt mit schenkelblock. \n \n \n \n merke \n  modifiziertes valsalva (revert):  15 s halbsitzend gegen widerstand pressen (10-ml-spritze aufblasen, ca. 40 mmhg), dann sofort flach hinlegen und beine 45° für 15 s anheben. erfolgsrate etwa 43 % gegenüber 17 % beim klassischen valsalva. \n \n \n pitfalls \n \n  präexzitiertes vorhofflimmern (wpw):  breit, unregelmäßig, wechselnde qrs-morphologie.  keine  av-knoten-blocker (adenosin, verapamil, betablocker, digitalis). bei instabilität kardiovertieren, sonst ajmalin. \n  verapamil bei vt  kann zum kreislaufstillstand führen. breite tachykardie im zweifel immer als vt behandeln. \n  sinustachykardie ist eine antwort, keine krankheit:  sepsis, blutung, lae, hypovolämie, schmerz. nicht die frequenz behandeln. \n  adenosin:  reduzierte dosis (3 mg) nach herztransplantation, unter dipyridamol und über zvk. patienten vorher über das kurze vernichtungsgefühl aufklären. \n \n  tachykarde rhythmusstörungen"},"ahf":{"ch":4,"cht":"Herz und Kreislauf","t":"Akute Herzinsuffizienz und Lungenödem","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Hypertensives Lungenödem<\/strong> (häufig, oft nicht hypervoläm): CPAP/NIV früh plus <strong>Nitrat hoch dosiert<\/strong>. Das ist die eigentliche Therapie.<\/li>\n<li><strong>CPAP/NIV:<\/strong> PEEP 5–10 cmH₂O, bei NIV Druckunterstützung 5–10 cmH₂O, Ziel-SpO₂ 94–98 %.<\/li>\n<li><strong>Nitroglyzerin:<\/strong> 0,4–0,8 mg s.l. alle 3–5 min bei RR sys &gt; 110 mmHg; bei sehr hohen Drücken auch 1–2 Hübe in kurzer Folge oder i.v. Boli nach SOP.<\/li>\n<li><strong>Furosemid<\/strong> 20–40 mg i.v. (bei Dauertherapie mindestens die orale Tagesdosis) nur bei klarer Hypervolämie; präklinisch nachrangig.<\/li>\n<li><strong>Kardiogener Schock:<\/strong> Noradrenalin als Vasopressor der ersten Wahl, Dobutamin bei Low Output, Transport in ein Zentrum mit Katheterlabor und mechanischer Kreislaufunterstützung.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-neu\">\n<div class=\"box-label\">Evidenz &amp; Neu<\/div>\n<ul>\n<li><strong>ESC-Herzinsuffizienz-Leitlinie 2026:<\/strong> „Akute\" heißt jetzt <strong>dekompensierte Herzinsuffizienz<\/strong>; nur noch HFrEF (&lt; 50 %) und HFpEF (≥ 50 %). Neu sind vor allem klinische Punkte (natriuresegesteuerte Diuretika, Acetazolamid-Zusatz, Shock-Team, keine IABP und kein unselektiertes MCS beim kardiogenen Schock).<\/li>\n<li><strong>Morphin nicht routinemäßig.<\/strong> In MIMO (2019) hatte Morphin gegenüber niedrig dosiertem Midazolam mehr schwere unerwünschte Ereignisse. Gegen Angst und Lufthunger eher Midazolam 0,5–1 mg titriert unter CPAP.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Aortenstenose:<\/strong> vorlastabhängig, Nitrat kann massiv hypotensiv machen. Leise Herztöne und Systolikum hören.<\/li>\n<li><strong>Rechtsherzversagen<\/strong> (LAE, pulmonale Hypertonie): Nitrat und hoher PEEP schaden.<\/li>\n<li><strong>Tachyarrhythmie als Auslöser:<\/strong> Kardioversion behebt das Ödem, Diuretika nicht.<\/li>\n<li><strong>COPD oder Lungenödem?<\/strong> POCUS (bilaterale B-Linien) und Anamnese helfen; im Zweifel CPAP hilft beiden.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  hypertensives lungenödem  (häufig, oft nicht hypervoläm): cpap/niv früh plus  nitrat hoch dosiert . das ist die eigentliche therapie. \n  cpap/niv:  peep 5–10 cmh₂o, bei niv druckunterstützung 5–10 cmh₂o, ziel-spo₂ 94–98 %. \n  nitroglyzerin:  0,4–0,8 mg s.l. alle 3–5 min bei rr sys > 110 mmhg; bei sehr hohen drücken auch 1–2 hübe in kurzer folge oder i.v. boli nach sop. \n  furosemid  20–40 mg i.v. (bei dauertherapie mindestens die orale tagesdosis) nur bei klarer hypervolämie; präklinisch nachrangig. \n  kardiogener schock:  noradrenalin als vasopressor der ersten wahl, dobutamin bei low output, transport in ein zentrum mit katheterlabor und mechanischer kreislaufunterstützung. \n \n \n \n evidenz & neu \n \n  esc-herzinsuffizienz-leitlinie 2026:  „akute\" heißt jetzt  dekompensierte herzinsuffizienz ; nur noch hfref (< 50 %) und hfpef (≥ 50 %). neu sind vor allem klinische punkte (natriuresegesteuerte diuretika, acetazolamid-zusatz, shock-team, keine iabp und kein unselektiertes mcs beim kardiogenen schock). \n  morphin nicht routinemäßig.  in mimo (2019) hatte morphin gegenüber niedrig dosiertem midazolam mehr schwere unerwünschte ereignisse. gegen angst und lufthunger eher midazolam 0,5–1 mg titriert unter cpap. \n \n \n \n pitfalls \n \n  aortenstenose:  vorlastabhängig, nitrat kann massiv hypotensiv machen. leise herztöne und systolikum hören. \n  rechtsherzversagen  (lae, pulmonale hypertonie): nitrat und hoher peep schaden. \n  tachyarrhythmie als auslöser:  kardioversion behebt das ödem, diuretika nicht. \n  copd oder lungenödem?  pocus (bilaterale b-linien) und anamnese helfen; im zweifel cpap hilft beiden. \n \n  akute herzinsuffizienz und lungenödem"},"hypertens":{"ch":4,"cht":"Herz und Kreislauf","t":"Hypertensiver Notfall","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Notfall<\/strong> = Blutdruckentgleisung <strong>plus akuter Organschaden<\/strong> (Enzephalopathie, ACS, Lungenödem, Dissektion, Eklampsie, Schlaganfall, akutes Nierenversagen). Ohne Organschaden kein präklinischer Notfall: beruhigen, Ursache klären, orale Dauermedikation, hausärztliche Kontrolle.<\/li>\n<li><strong>Ziel:<\/strong> MAP in der ersten Stunde um <strong>höchstens 20–25 %<\/strong> senken. Ausnahmen mit schnellerer, tieferer Senkung: Aortendissektion, Lungenödem, Eklampsie.<\/li>\n<li>Ab etwa 180/110 mmHg gezielt nach Organschaden suchen: Neurologie, Thoraxschmerz, Dyspnoe, Sehstörung, EKG.<\/li>\n<\/ul>\n<\/div>\n<table>\n<thead>\n<tr>\n<th>Situation<\/th>\n<th>Ziel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Enzephalopathie, maligne Hypertonie<\/td>\n<td>MAP −20–25 %<\/td>\n<\/tr>\n<tr>\n<td>ACS, Lungenödem<\/td>\n<td>RR sys &lt; 140 mmHg (Nitrat)<\/td>\n<\/tr>\n<tr>\n<td>Aortendissektion<\/td>\n<td>RR sys &lt; 120 mmHg und HF &lt; 60/min, sofort<\/td>\n<\/tr>\n<tr>\n<td>Präeklampsie, Eklampsie<\/td>\n<td>ab 160/110 mmHg auf etwa 140–150/90–100 mmHg, nicht tiefer; plus Magnesium (Kapitel 13)<\/td>\n<\/tr>\n<tr>\n<td>Ischämischer Schlaganfall<\/td>\n<td>nur &gt; 220/120 mmHg: MAP −15 % in 1 h<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"box box-dosis\">\n<div class=\"box-label\">Medikamente &amp; Dosis<\/div>\n<table>\n<thead>\n<tr>\n<th>Substanz<\/th>\n<th>Dosis<\/th>\n<th>Einsatz<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Urapidil<\/td>\n<td>5–10 mg i.v. fraktioniert, bis 25 mg<\/td>\n<td>Standard<\/td>\n<\/tr>\n<tr>\n<td>Nitroglyzerin<\/td>\n<td>0,4–0,8 mg s.l.<\/td>\n<td>Lungenödem, ACS<\/td>\n<\/tr>\n<tr>\n<td>Clonidin<\/td>\n<td>0,075 mg langsam i.v., wiederholbar<\/td>\n<td>sedierend, bradykard<\/td>\n<\/tr>\n<tr>\n<td>Metoprolol<\/td>\n<td>2,5–5 mg i.v.<\/td>\n<td>Dissektion, Tachykardie<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Nifedipin-Kapsel s.l.<\/strong> ist obsolet: unkontrollierter Abfall, Ischämie.<\/li>\n<li><strong>Ursachen statt Zahl behandeln:<\/strong> Schmerz, Angst, Harnverhalt, Entzug, Stimulanzien (Benzodiazepin zuerst).<\/li>\n<li><strong>Hirndruck mit Cushing-Reflex<\/strong> nicht antihypertensiv behandeln.<\/li>\n<li><strong>Ischämischer Schlaganfall:<\/strong> präklinisch nur bei &gt; 220/120 mmHg vorsichtig senken (Kapitel 6).<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  notfall  = blutdruckentgleisung  plus akuter organschaden  (enzephalopathie, acs, lungenödem, dissektion, eklampsie, schlaganfall, akutes nierenversagen). ohne organschaden kein präklinischer notfall: beruhigen, ursache klären, orale dauermedikation, hausärztliche kontrolle. \n  ziel:  map in der ersten stunde um  höchstens 20–25 %  senken. ausnahmen mit schnellerer, tieferer senkung: aortendissektion, lungenödem, eklampsie. \n ab etwa 180/110 mmhg gezielt nach organschaden suchen: neurologie, thoraxschmerz, dyspnoe, sehstörung, ekg. \n \n \n \n \n \n situation \n ziel \n \n \n \n \n enzephalopathie, maligne hypertonie \n map −20–25 % \n \n \n acs, lungenödem \n rr sys < 140 mmhg (nitrat) \n \n \n aortendissektion \n rr sys < 120 mmhg und hf < 60/min, sofort \n \n \n präeklampsie, eklampsie \n ab 160/110 mmhg auf etwa 140–150/90–100 mmhg, nicht tiefer; plus magnesium (kapitel 13) \n \n \n ischämischer schlaganfall \n nur > 220/120 mmhg: map −15 % in 1 h \n \n \n \n \n medikamente & dosis \n \n \n \n substanz \n dosis \n einsatz \n \n \n \n \n urapidil \n 5–10 mg i.v. fraktioniert, bis 25 mg \n standard \n \n \n nitroglyzerin \n 0,4–0,8 mg s.l. \n lungenödem, acs \n \n \n clonidin \n 0,075 mg langsam i.v., wiederholbar \n sedierend, bradykard \n \n \n metoprolol \n 2,5–5 mg i.v. \n dissektion, tachykardie \n \n \n \n \n \n pitfalls \n \n  nifedipin-kapsel s.l.  ist obsolet: unkontrollierter abfall, ischämie. \n  ursachen statt zahl behandeln:  schmerz, angst, harnverhalt, entzug, stimulanzien (benzodiazepin zuerst). \n  hirndruck mit cushing-reflex  nicht antihypertensiv behandeln. \n  ischämischer schlaganfall:  präklinisch nur bei > 220/120 mmhg vorsichtig senken (kapitel 6). \n \n  hypertensiver notfall"},"aorta":{"ch":4,"cht":"Herz und Kreislauf","t":"Akutes Aortensyndrom","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Klinik:<\/strong> abrupter, maximaler, reißender Schmerz Brust oder Rücken, wandernd; Pulsdefizit oder RR-Differenz &gt; 20 mmHg, neurologisches Defizit, Synkope, neues Diastolikum, Paraplegie.<\/li>\n<li><strong>Therapie:<\/strong> Opioid-Analgesie, <strong>erst Frequenz &lt; 60/min<\/strong> (Metoprolol oder Esmolol), <strong>dann RR sys 100–120 mmHg<\/strong> (Urapidil). Kein ASS, kein Heparin.<\/li>\n<li><strong>Ziel:<\/strong> Klinik mit CT und Herz- bzw. Gefäßchirurgie, Voranmeldung mit Verdachtsdiagnose.<\/li>\n<li><strong>Rupturiertes Bauchaortenaneurysma:<\/strong> permissive Hypotonie (wach, ansprechbar, RR sys etwa 70–90 mmHg), minimale Volumengabe, direkt ins Gefäßzentrum.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  klinik:  abrupter, maximaler, reißender schmerz brust oder rücken, wandernd; pulsdefizit oder rr-differenz > 20 mmhg, neurologisches defizit, synkope, neues diastolikum, paraplegie. \n  therapie:  opioid-analgesie,  erst frequenz < 60/min  (metoprolol oder esmolol),  dann rr sys 100–120 mmhg  (urapidil). kein ass, kein heparin. \n  ziel:  klinik mit ct und herz- bzw. gefäßchirurgie, voranmeldung mit verdachtsdiagnose. \n  rupturiertes bauchaortenaneurysma:  permissive hypotonie (wach, ansprechbar, rr sys etwa 70–90 mmhg), minimale volumengabe, direkt ins gefäßzentrum. \n \n  akutes aortensyndrom"},"lae":{"ch":4,"cht":"Herz und Kreislauf","t":"Lungenarterienembolie","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Hinweise:<\/strong> Dyspnoe, Tachykardie, Hypoxämie bei freier Lunge, Synkope, Thoraxschmerz, Beinschwellung. Risikofaktoren: Immobilisation, OP, Tumor, Schwangerschaft und Wochenbett, Östrogene.<\/li>\n<li><strong>EKG:<\/strong> Sinustachykardie, Rechtsschenkelblock, T-Negativierung V1–V4, S1Q3T3. <strong>POCUS:<\/strong> dilatierter RV (RV/LV &gt; 1), D-Sign, gestaute V. cava.<\/li>\n<li><strong>Hochgradiger Verdacht ohne Kontraindikation:<\/strong> UFH 80 IE/kg i.v. (meist 5000–10 000 IE).<\/li>\n<li><strong>Hochrisiko-LAE (Schock):<\/strong> systemische Lyse erwägen, Alteplase 100 mg über 2 h oder 0,6 mg/kg über 15 min (max. 50 mg). Im Kreislaufstillstand siehe Kapitel 15.<\/li>\n<li><strong>Kreislauf:<\/strong> Noradrenalin früh, Volumen maximal 500 ml.<\/li>\n<\/ul>\n<\/div>\n<table>\n<thead>\n<tr>\n<th>Wells-Score LAE<\/th>\n<th>Punkte<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Klinische Zeichen einer tiefen Venenthrombose<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>LAE wahrscheinlicher als andere Diagnosen<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>Herzfrequenz &gt; 100/min<\/td>\n<td>1,5<\/td>\n<\/tr>\n<tr>\n<td>Immobilisation ≥ 3 Tage oder OP in den letzten 4 Wochen<\/td>\n<td>1,5<\/td>\n<\/tr>\n<tr>\n<td>Frühere Thrombose oder LAE<\/td>\n<td>1,5<\/td>\n<\/tr>\n<tr>\n<td>Hämoptyse<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>Aktive Tumorerkrankung<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td><strong>&gt; 4 Punkte: LAE wahrscheinlich<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"box box-neu\">\n<div class=\"box-label\">Evidenz &amp; Neu<\/div>\n<ul>\n<li><strong>AHA/ACC-Leitlinie LAE 2026:<\/strong> neue Schweregrade A–E (E1 anhaltende Hypotonie oder Schock, E2 refraktärer Schock bzw. Reanimation). Für Kategorie E stehen systemische Lyse und kathetergestützte Verfahren nebeneinander; die genauen Empfehlungsgrade werden in Sekundärquellen unterschiedlich wiedergegeben. In Europa gilt bis zur angekündigten Neufassung 2027 die ESC-Leitlinie 2019. Präklinisch bleibt die Lyse dem Schock und dem Kreislaufstillstand vorbehalten.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Intubation bei RV-Versagen<\/strong> ist ein Hochrisikomanöver: Einleitung und Überdruckbeatmung können den Kreislaufstillstand auslösen. Wenn unvermeidbar: Vasopressor vorab, Ketamin niedrig dosiert, niedriger PEEP.<\/li>\n<li>Volumenbolus ohne Verstand dehnt den RV weiter und verschlechtert die Auswurfleistung.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  hinweise:  dyspnoe, tachykardie, hypoxämie bei freier lunge, synkope, thoraxschmerz, beinschwellung. risikofaktoren: immobilisation, op, tumor, schwangerschaft und wochenbett, östrogene. \n  ekg:  sinustachykardie, rechtsschenkelblock, t-negativierung v1–v4, s1q3t3.  pocus:  dilatierter rv (rv/lv > 1), d-sign, gestaute v. cava. \n  hochgradiger verdacht ohne kontraindikation:  ufh 80 ie/kg i.v. (meist 5000–10 000 ie). \n  hochrisiko-lae (schock):  systemische lyse erwägen, alteplase 100 mg über 2 h oder 0,6 mg/kg über 15 min (max. 50 mg). im kreislaufstillstand siehe kapitel 15. \n  kreislauf:  noradrenalin früh, volumen maximal 500 ml. \n \n \n \n \n \n wells-score lae \n punkte \n \n \n \n \n klinische zeichen einer tiefen venenthrombose \n 3 \n \n \n lae wahrscheinlicher als andere diagnosen \n 3 \n \n \n herzfrequenz > 100/min \n 1,5 \n \n \n immobilisation ≥ 3 tage oder op in den letzten 4 wochen \n 1,5 \n \n \n frühere thrombose oder lae \n 1,5 \n \n \n hämoptyse \n 1 \n \n \n aktive tumorerkrankung \n 1 \n \n \n  > 4 punkte: lae wahrscheinlich  \n  \n \n \n \n \n evidenz & neu \n \n  aha/acc-leitlinie lae 2026:  neue schweregrade a–e (e1 anhaltende hypotonie oder schock, e2 refraktärer schock bzw. reanimation). für kategorie e stehen systemische lyse und kathetergestützte verfahren nebeneinander; die genauen empfehlungsgrade werden in sekundärquellen unterschiedlich wiedergegeben. in europa gilt bis zur angekündigten neufassung 2027 die esc-leitlinie 2019. präklinisch bleibt die lyse dem schock und dem kreislaufstillstand vorbehalten. \n \n \n \n pitfalls \n \n  intubation bei rv-versagen  ist ein hochrisikomanöver: einleitung und überdruckbeatmung können den kreislaufstillstand auslösen. wenn unvermeidbar: vasopressor vorab, ketamin niedrig dosiert, niedriger peep. \n volumenbolus ohne verstand dehnt den rv weiter und verschlechtert die auswurfleistung. \n \n  lungenarterienembolie"},"synkope":{"ch":4,"cht":"Herz und Kreislauf","t":"Synkope","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>12-Kanal-EKG bei jeder Synkope.<\/strong> Zusätzlich BZ, Blutdruck an beiden Armen, Hb-Hinweise (Teerstuhl), Schwangerschaft bei jungen Frauen.<\/li>\n<li><strong>Hochrisikomerkmale<\/strong> (Klinik nötig): Synkope bei Belastung oder im Liegen, Palpitationen vorweg, fehlende Prodromi, neuer Thoraxschmerz, Dyspnoe, Kopfschmerz, Bauchschmerz, strukturelle Herzerkrankung, familiärer plötzlicher Herztod, RR sys &lt; 90 mmHg, Bradykardie &lt; 40/min.<\/li>\n<li><strong>EKG-Warnzeichen:<\/strong> AV-Block II° Mobitz II und III°, bifaszikulärer Block, Pausen &gt; 3 s, QTc &gt; 460 ms oder sehr kurz, Brugada Typ 1, Präexzitation, Epsilonwelle, Ischämiezeichen, ventrikuläre Salven.<\/li>\n<li><strong>Niedriges Risiko:<\/strong> typischer Auslöser (Stehen, Schmerz, Miktion), Prodromi, schnelle vollständige Erholung, unauffälliges EKG, keine Herzerkrankung. Belassen vor Ort ist nach Aufklärung vertretbar.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Kurze Myoklonien<\/strong> sind bei Synkopen häufig und kein Beweis für einen Krampfanfall. Für den Anfall sprechen lateraler Zungenbiss, längere Reorientierungsphase, Kopfwendung.<\/li>\n<li><strong>Hinter der Synkope stecken:<\/strong> LAE, Dissektion, GI-Blutung, Extrauteringravidität, Aortenstenose, Rhythmusstörung.<\/li>\n<li><strong>Sturz plus Antikoagulation<\/strong> ist auch nach harmloser Synkope ein Trauma-Thema (intrakranielle Blutung).<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  12-kanal-ekg bei jeder synkope.  zusätzlich bz, blutdruck an beiden armen, hb-hinweise (teerstuhl), schwangerschaft bei jungen frauen. \n  hochrisikomerkmale  (klinik nötig): synkope bei belastung oder im liegen, palpitationen vorweg, fehlende prodromi, neuer thoraxschmerz, dyspnoe, kopfschmerz, bauchschmerz, strukturelle herzerkrankung, familiärer plötzlicher herztod, rr sys < 90 mmhg, bradykardie < 40/min. \n  ekg-warnzeichen:  av-block ii° mobitz ii und iii°, bifaszikulärer block, pausen > 3 s, qtc > 460 ms oder sehr kurz, brugada typ 1, präexzitation, epsilonwelle, ischämiezeichen, ventrikuläre salven. \n  niedriges risiko:  typischer auslöser (stehen, schmerz, miktion), prodromi, schnelle vollständige erholung, unauffälliges ekg, keine herzerkrankung. belassen vor ort ist nach aufklärung vertretbar. \n \n \n \n pitfalls \n \n  kurze myoklonien  sind bei synkopen häufig und kein beweis für einen krampfanfall. für den anfall sprechen lateraler zungenbiss, längere reorientierungsphase, kopfwendung. \n  hinter der synkope stecken:  lae, dissektion, gi-blutung, extrauteringravidität, aortenstenose, rhythmusstörung. \n  sturz plus antikoagulation  ist auch nach harmloser synkope ein trauma-thema (intrakranielle blutung). \n \n  synkope"},"asthma":{"ch":5,"cht":"Atmung und Anaphylaxie","t":"Akutes Asthma","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Schwer:<\/strong> Sprechen nur in Satzteilen, AF ≥ 25/min, HF ≥ 110/min, PEF 33–50 %.<\/li>\n<li><strong>Lebensbedrohlich:<\/strong> SpO₂ &lt; 92 %, „Silent Chest\", Zyanose, Erschöpfung, Bewusstseinstrübung, Hypotonie, Rhythmusstörung, Bradykardie, normaler oder steigender paCO₂.<\/li>\n<li><strong>Lagerung sitzend<\/strong>, Lippenbremse, O₂ nur bei SpO₂ &lt; 92 %, Ziel 92–95 % (GINA 2026).<\/li>\n<li><strong>Stufenfolge:<\/strong> SABA plus SAMA inhalativ → systemisches Steroid → Magnesium i.v. → β₂-Mimetikum parenteral → Adrenalin → NIV-Versuch → Narkose mit Ketamin.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-dosis\">\n<div class=\"box-label\">Medikamente &amp; Dosis<\/div>\n<table>\n<thead>\n<tr>\n<th>Substanz<\/th>\n<th>Dosis<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Salbutamol<\/td>\n<td>2,5–5 mg vernebelt, alle 20 min wiederholen; oder 4–10 Hübe Dosieraerosol mit Spacer<\/td>\n<\/tr>\n<tr>\n<td>Ipratropium<\/td>\n<td>0,5 mg vernebelt (mit Salbutamol)<\/td>\n<\/tr>\n<tr>\n<td>Prednisolon<\/td>\n<td>40–50 mg p.o. oder i.v. (NVL: 50–100 mg i.v.)<\/td>\n<\/tr>\n<tr>\n<td>Magnesiumsulfat<\/td>\n<td>2 g i.v. über 20 min (vernebelt nicht mehr empfohlen)<\/td>\n<\/tr>\n<tr>\n<td>Reproterol<\/td>\n<td>0,09 mg langsam i.v. über ½–1 min, frühestens nach 10–15 min wiederholen; Perfusor 18–90 µg/h<\/td>\n<\/tr>\n<tr>\n<td>Terbutalin<\/td>\n<td>0,25–0,5 mg s.c., falls verfügbar<\/td>\n<\/tr>\n<tr>\n<td>Adrenalin<\/td>\n<td>0,5 mg i.m. bei Verdacht auf Anaphylaxie oder Periarrest<\/td>\n<\/tr>\n<tr>\n<td>Esketamin<\/td>\n<td>0,25–0,5 mg/kg i.v. als Bronchodilatator bzw. zur Narkoseeinleitung; zur NIV-Toleranz 5–10 mg<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"box box-neu\">\n<div class=\"box-label\">Evidenz &amp; Neu<\/div>\n<ul>\n<li><strong>GINA 2026:<\/strong> O₂-Ziel 92–95 %, Prednisolon 40–50 mg für 5–7 Tage, Magnesium nur noch i.v. Bei Anaphylaxie mit Bronchospasmus zuerst Adrenalin, dann Bronchodilatatoren. Die Evidenz für NIV beim Asthma bleibt schwach: Versuch ja, aber Intubation nicht hinauszögern.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Silent Chest ist kein Fortschritt<\/strong>, sondern drohende Erschöpfung.<\/li>\n<li><strong>Sedierung ohne Atemwegssicherung<\/strong> (Benzodiazepine gegen „Angst\") kann den Atemstillstand auslösen.<\/li>\n<li><strong>Beatmung nach Intubation:<\/strong> großer Tubus, AF 8–12/min, I:E 1:3–1:5, Tidalvolumen 6 ml/kg, PEEP 0–5 cmH₂O, Plateaudruck &lt; 30 cmH₂O, Hyperkapnie akzeptieren (pH &gt; 7,2). Bei Kreislaufeinbruch: <strong>diskonnektieren<\/strong>, Thorax ausdrücken (Auto-PEEP), Spannungspneumothorax ausschließen.<\/li>\n<li><strong>Anaphylaxie mit Bronchospasmus<\/strong> sieht aus wie Asthma: Auslöser erfragen, Haut ansehen.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  schwer:  sprechen nur in satzteilen, af ≥ 25/min, hf ≥ 110/min, pef 33–50 %. \n  lebensbedrohlich:  spo₂ < 92 %, „silent chest\", zyanose, erschöpfung, bewusstseinstrübung, hypotonie, rhythmusstörung, bradykardie, normaler oder steigender paco₂. \n  lagerung sitzend , lippenbremse, o₂ nur bei spo₂ < 92 %, ziel 92–95 % (gina 2026). \n  stufenfolge:  saba plus sama inhalativ → systemisches steroid → magnesium i.v. → β₂-mimetikum parenteral → adrenalin → niv-versuch → narkose mit ketamin. \n \n \n \n medikamente & dosis \n \n \n \n substanz \n dosis \n \n \n \n \n salbutamol \n 2,5–5 mg vernebelt, alle 20 min wiederholen; oder 4–10 hübe dosieraerosol mit spacer \n \n \n ipratropium \n 0,5 mg vernebelt (mit salbutamol) \n \n \n prednisolon \n 40–50 mg p.o. oder i.v. (nvl: 50–100 mg i.v.) \n \n \n magnesiumsulfat \n 2 g i.v. über 20 min (vernebelt nicht mehr empfohlen) \n \n \n reproterol \n 0,09 mg langsam i.v. über ½–1 min, frühestens nach 10–15 min wiederholen; perfusor 18–90 µg/h \n \n \n terbutalin \n 0,25–0,5 mg s.c., falls verfügbar \n \n \n adrenalin \n 0,5 mg i.m. bei verdacht auf anaphylaxie oder periarrest \n \n \n esketamin \n 0,25–0,5 mg/kg i.v. als bronchodilatator bzw. zur narkoseeinleitung; zur niv-toleranz 5–10 mg \n \n \n \n \n \n evidenz & neu \n \n  gina 2026:  o₂-ziel 92–95 %, prednisolon 40–50 mg für 5–7 tage, magnesium nur noch i.v. bei anaphylaxie mit bronchospasmus zuerst adrenalin, dann bronchodilatatoren. die evidenz für niv beim asthma bleibt schwach: versuch ja, aber intubation nicht hinauszögern. \n \n \n \n pitfalls \n \n  silent chest ist kein fortschritt , sondern drohende erschöpfung. \n  sedierung ohne atemwegssicherung  (benzodiazepine gegen „angst\") kann den atemstillstand auslösen. \n  beatmung nach intubation:  großer tubus, af 8–12/min, i:e 1:3–1:5, tidalvolumen 6 ml/kg, peep 0–5 cmh₂o, plateaudruck < 30 cmh₂o, hyperkapnie akzeptieren (ph > 7,2). bei kreislaufeinbruch:  diskonnektieren , thorax ausdrücken (auto-peep), spannungspneumothorax ausschließen. \n  anaphylaxie mit bronchospasmus  sieht aus wie asthma: auslöser erfragen, haut ansehen. \n \n  akutes asthma"},"copd":{"ch":5,"cht":"Atmung und Anaphylaxie","t":"AECOPD","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Ziel-SpO₂ 88–92 %<\/strong>, O₂ titriert (Venturi-Maske oder niedriger Flow), nicht nach Gefühl hochdrehen.<\/li>\n<li><strong>Inhalation:<\/strong> Salbutamol 2,5–5 mg plus Ipratropium 0,5 mg; mit Druckluft statt O₂ vernebeln, wenn der Patient hyperkapnisch wirkt, O₂ dann per Nasenbrille.<\/li>\n<li><strong>Prednisolon<\/strong> 40 mg i.v. oder p.o. (GOLD 2026: für bis zu 5 Tage). Theophyllin nicht empfohlen.<\/li>\n<li><strong>NIV<\/strong> bei respiratorischer Azidose (pH ≤ 7,35 und paCO₂ ≥ 45 mmHg; präklinisch: Tachypnoe, Atemhilfsmuskulatur, Somnolenz): IPAP 12–20, EPAP 4–6 cmH₂O, schrittweise steigern.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>CO₂-Narkose durch Hyperoxie:<\/strong> SpO₂ 99 % unter 15 l/min ist bei COPD ein Warnsignal.<\/li>\n<li><strong>Differenzialdiagnosen:<\/strong> Pneumothorax (Bullae), kardiale Dekompensation, LAE, Pneumonie.<\/li>\n<li><strong>Somnolenter COPD-Patient<\/strong> unter NIV: Aspirationsschutz und Kooperation prüfen; im Zweifel Narkose.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  ziel-spo₂ 88–92 % , o₂ titriert (venturi-maske oder niedriger flow), nicht nach gefühl hochdrehen. \n  inhalation:  salbutamol 2,5–5 mg plus ipratropium 0,5 mg; mit druckluft statt o₂ vernebeln, wenn der patient hyperkapnisch wirkt, o₂ dann per nasenbrille. \n  prednisolon  40 mg i.v. oder p.o. (gold 2026: für bis zu 5 tage). theophyllin nicht empfohlen. \n  niv  bei respiratorischer azidose (ph ≤ 7,35 und paco₂ ≥ 45 mmhg; präklinisch: tachypnoe, atemhilfsmuskulatur, somnolenz): ipap 12–20, epap 4–6 cmh₂o, schrittweise steigern. \n \n \n \n pitfalls \n \n  co₂-narkose durch hyperoxie:  spo₂ 99 % unter 15 l/min ist bei copd ein warnsignal. \n  differenzialdiagnosen:  pneumothorax (bullae), kardiale dekompensation, lae, pneumonie. \n  somnolenter copd-patient  unter niv: aspirationsschutz und kooperation prüfen; im zweifel narkose. \n \n  aecopd"},"anaph":{"ch":5,"cht":"Atmung und Anaphylaxie","t":"Anaphylaxie","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Diagnose klinisch:<\/strong> akuter Beginn nach Exposition mit Haut- oder Schleimhautbefall plus Atmung oder Kreislauf oder GI-Symptomen. Bei bekanntem Allergen reicht die Hypotonie allein. <strong>Hautzeichen fehlen in etwa 10–20 %.<\/strong><\/li>\n<li><strong>Adrenalin i.m. sofort:<\/strong> 0,01 mg/kg, Erwachsene <strong>0,5 mg<\/strong> in den anterolateralen Oberschenkel, <strong>nach 5 min wiederholen<\/strong>, wenn keine Besserung (ERC 2025).<\/li>\n<li><strong>Lagerung:<\/strong> flach mit angehobenen Beinen, bei Atemnot halbsitzend. <strong>Nicht aufstehen lassen<\/strong> (Gefahr des „leeren Herzens\").<\/li>\n<li><strong>O₂ hoch dosiert, Volumen:<\/strong> 500–1000 ml Vollelektrolyt als Bolus, bei Kindern 10 ml/kg je Bolus, wiederholt.<\/li>\n<li><strong>Refraktär<\/strong> (keine Besserung nach 2 korrekt dosierten i.m.-Gaben): Adrenalin-Perfusor 0,05–0,1 µg/kg/min, steigerbar bis 1 µg/kg/min (1 mg auf 50 ml = 20 µg/ml, für 70 kg etwa 10–20 ml/h als Start). Alternativ durch Erfahrene i.v.-Boli von 50 µg (Kinder 1 µg/kg) titriert.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-dosis\">\n<div class=\"box-label\">Medikamente &amp; Dosis<\/div>\n<table>\n<thead>\n<tr>\n<th>Substanz<\/th>\n<th>Dosis<\/th>\n<th>Rolle<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Adrenalin i.m.<\/td>\n<td>0,01 mg/kg; &gt; 12 J 0,5 mg; 6–12 J 0,3 mg; &lt; 6 J 0,15 mg<\/td>\n<td>erste Wahl, nie verzögern<\/td>\n<\/tr>\n<tr>\n<td>Adrenalin i.v.<\/td>\n<td>Perfusor 0,05–1 µg/kg/min; Boli 50 µg nur unter Monitoring<\/td>\n<td>refraktäre Anaphylaxie<\/td>\n<\/tr>\n<tr>\n<td>Adrenalin vernebelt<\/td>\n<td>3–5 ml (1 mg/ml)<\/td>\n<td>Larynxödem, Stridor (zusätzlich, nicht statt i.m.)<\/td>\n<\/tr>\n<tr>\n<td>Salbutamol<\/td>\n<td>2,5–5 mg vernebelt<\/td>\n<td>Bronchospasmus<\/td>\n<\/tr>\n<tr>\n<td>Volumen<\/td>\n<td>500–1000 ml, Kinder 10 ml/kg je Bolus, wiederholt<\/td>\n<td>früh<\/td>\n<\/tr>\n<tr>\n<td>Dimetinden<\/td>\n<td>0,1 mg/kg i.v. (meist 4–8 mg)<\/td>\n<td>nur Haut, Juckreiz; zweite Linie<\/td>\n<\/tr>\n<tr>\n<td>Prednisolon<\/td>\n<td>250 mg i.v. (Kinder 2 mg/kg)<\/td>\n<td>Spätwirkung, zweite Linie<\/td>\n<\/tr>\n<tr>\n<td>Glukagon<\/td>\n<td>1–2 mg i.v., wiederholbar (Kinder 20–30 µg/kg)<\/td>\n<td>refraktär unter Betablocker<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"box box-neu\">\n<div class=\"box-label\">Evidenz &amp; Neu<\/div>\n<ul>\n<li><strong>Antihistaminika und Steroide<\/strong> haben in der Akuttherapie keine belegte Rolle (US Practice Parameter 2023, ASCIA 2026). Sie bleiben in der deutschen S2k-Leitlinie (2021, weiterhin gültig) als zweite Linie, dürfen das Adrenalin aber nie verzögern.<\/li>\n<li><strong>Adrenalin-Nasenspray<\/strong> (EURneffy 2 mg, ab 30 kg) ist seit 2025 in Deutschland erhältlich. Patienten kommen zunehmend damit; zweite Dosis nach 10 min in dasselbe Nasenloch.<\/li>\n<li><strong>Überwachungsdauer (NICE 2026):<\/strong> 2 h nach gutem Ansprechen auf eine Dosis, ≥ 6 h nach zwei Dosen oder früherer biphasischer Reaktion, ≥ 12 h bei schwerer Reaktion oder mehr als zwei Dosen.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Antihistaminikum und Steroid statt Adrenalin<\/strong> ist der häufigste und gefährlichste Fehler.<\/li>\n<li><strong>Unverdünntes Adrenalin 1 mg i.v.<\/strong> beim Patienten mit Puls: Kammerflimmern, Myokardinfarkt.<\/li>\n<li><strong>Biphasische Reaktion<\/strong> in wenigen Prozent; deshalb nach jeder relevanten Reaktion Überwachung.<\/li>\n<li><strong>ACE-Hemmer- und hereditäres Angioödem<\/strong> (Bradykinin): keine Urtikaria, kein Juckreiz, Adrenalin und Steroid wirken kaum. Icatibant war in der Phase-3-Studie beim ACE-Hemmer-Angioödem wirkungslos. Entscheidend ist der Atemweg: früh sichern, wach-fiberoptisch, wenn verfügbar, Koniotomie bereitlegen.<\/li>\n<li><strong>Patient mit eigenem Autoinjektor:<\/strong> Rezept und Schulung erfragen, beim Belassen vor Ort nicht ohne Ersatz zurücklassen.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  diagnose klinisch:  akuter beginn nach exposition mit haut- oder schleimhautbefall plus atmung oder kreislauf oder gi-symptomen. bei bekanntem allergen reicht die hypotonie allein.  hautzeichen fehlen in etwa 10–20 %.  \n  adrenalin i.m. sofort:  0,01 mg/kg, erwachsene  0,5 mg  in den anterolateralen oberschenkel,  nach 5 min wiederholen , wenn keine besserung (erc 2025). \n  lagerung:  flach mit angehobenen beinen, bei atemnot halbsitzend.  nicht aufstehen lassen  (gefahr des „leeren herzens\"). \n  o₂ hoch dosiert, volumen:  500–1000 ml vollelektrolyt als bolus, bei kindern 10 ml/kg je bolus, wiederholt. \n  refraktär  (keine besserung nach 2 korrekt dosierten i.m.-gaben): adrenalin-perfusor 0,05–0,1 µg/kg/min, steigerbar bis 1 µg/kg/min (1 mg auf 50 ml = 20 µg/ml, für 70 kg etwa 10–20 ml/h als start). alternativ durch erfahrene i.v.-boli von 50 µg (kinder 1 µg/kg) titriert. \n \n \n \n medikamente & dosis \n \n \n \n substanz \n dosis \n rolle \n \n \n \n \n adrenalin i.m. \n 0,01 mg/kg; > 12 j 0,5 mg; 6–12 j 0,3 mg; < 6 j 0,15 mg \n erste wahl, nie verzögern \n \n \n adrenalin i.v. \n perfusor 0,05–1 µg/kg/min; boli 50 µg nur unter monitoring \n refraktäre anaphylaxie \n \n \n adrenalin vernebelt \n 3–5 ml (1 mg/ml) \n larynxödem, stridor (zusätzlich, nicht statt i.m.) \n \n \n salbutamol \n 2,5–5 mg vernebelt \n bronchospasmus \n \n \n volumen \n 500–1000 ml, kinder 10 ml/kg je bolus, wiederholt \n früh \n \n \n dimetinden \n 0,1 mg/kg i.v. (meist 4–8 mg) \n nur haut, juckreiz; zweite linie \n \n \n prednisolon \n 250 mg i.v. (kinder 2 mg/kg) \n spätwirkung, zweite linie \n \n \n glukagon \n 1–2 mg i.v., wiederholbar (kinder 20–30 µg/kg) \n refraktär unter betablocker \n \n \n \n \n \n evidenz & neu \n \n  antihistaminika und steroide  haben in der akuttherapie keine belegte rolle (us practice parameter 2023, ascia 2026). sie bleiben in der deutschen s2k-leitlinie (2021, weiterhin gültig) als zweite linie, dürfen das adrenalin aber nie verzögern. \n  adrenalin-nasenspray  (eurneffy 2 mg, ab 30 kg) ist seit 2025 in deutschland erhältlich. patienten kommen zunehmend damit; zweite dosis nach 10 min in dasselbe nasenloch. \n  überwachungsdauer (nice 2026):  2 h nach gutem ansprechen auf eine dosis, ≥ 6 h nach zwei dosen oder früherer biphasischer reaktion, ≥ 12 h bei schwerer reaktion oder mehr als zwei dosen. \n \n \n \n pitfalls \n \n  antihistaminikum und steroid statt adrenalin  ist der häufigste und gefährlichste fehler. \n  unverdünntes adrenalin 1 mg i.v.  beim patienten mit puls: kammerflimmern, myokardinfarkt. \n  biphasische reaktion  in wenigen prozent; deshalb nach jeder relevanten reaktion überwachung. \n  ace-hemmer- und hereditäres angioödem  (bradykinin): keine urtikaria, kein juckreiz, adrenalin und steroid wirken kaum. icatibant war in der phase-3-studie beim ace-hemmer-angioödem wirkungslos. entscheidend ist der atemweg: früh sichern, wach-fiberoptisch, wenn verfügbar, koniotomie bereitlegen. \n  patient mit eigenem autoinjektor:  rezept und schulung erfragen, beim belassen vor ort nicht ohne ersatz zurücklassen. \n \n  anaphylaxie"},"fk-erw":{"ch":5,"cht":"Atmung und Anaphylaxie","t":"Fremdkörperaspiration beim Erwachsenen","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Effektiver Husten:<\/strong> zum Husten ermutigen, nichts weiter.<\/li>\n<li><strong>Ineffektiver Husten, bei Bewusstsein:<\/strong> 5 Schläge zwischen die Schulterblätter, dann 5 Oberbauchkompressionen, im Wechsel.<\/li>\n<li><strong>Bewusstlos:<\/strong> Reanimation beginnen, Laryngoskopie und <strong>Magill-Zange<\/strong>. Fremdkörper unterhalb der Stimmbänder: intubieren und den Fremdkörper mit dem Tubus in einen Hauptbronchus vorschieben, einseitig beatmen.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  effektiver husten:  zum husten ermutigen, nichts weiter. \n  ineffektiver husten, bei bewusstsein:  5 schläge zwischen die schulterblätter, dann 5 oberbauchkompressionen, im wechsel. \n  bewusstlos:  reanimation beginnen, laryngoskopie und  magill-zange . fremdkörper unterhalb der stimmbänder: intubieren und den fremdkörper mit dem tubus in einen hauptbronchus vorschieben, einseitig beatmen. \n \n  fremdkörperaspiration beim erwachsenen"},"stroke":{"ch":6,"cht":"Neurologie","t":"Schlaganfall","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Screening:<\/strong> BE-FAST (Balance, Eyes, Face, Arm, Speech, Time). Bei positivem Befund Hinweise auf <strong>großen Gefäßverschluss (LVO)<\/strong> prüfen: Blickdeviation, Hemiplegie, Aphasie oder Neglect; Score nach regionalem Konzept (z. B. RACE ≥ 5, FAST-ED ≥ 4).<\/li>\n<li><strong>Zeitpunkt „zuletzt gesund gesehen\"<\/strong> exakt dokumentieren, nicht den Zeitpunkt des Auffindens.<\/li>\n<li><strong>Antikoagulation:<\/strong> Substanz, Dosis, letzte Einnahme. Schließt Thrombektomie nicht aus.<\/li>\n<li><strong>Telefonnummer<\/strong> eines Angehörigen oder Zeugen mitnehmen. Medikamentenplan mitnehmen.<\/li>\n<li><strong>BZ messen.<\/strong> Hypoglykämie ist der häufigste Stroke-Mimic.<\/li>\n<li><strong>Zielklinik nach regionalem Konzept:<\/strong> Stroke Unit; bei LVO-Verdacht direkt ins Thrombektomiezentrum, wenn der Zeitverlust vertretbar ist.<\/li>\n<li><strong>Voranmeldung<\/strong> mit Zeitfenster, Befund, Antikoagulation.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-kern\">\n<div class=\"box-label\">Allgemeinmaßnahmen<\/div>\n<ul>\n<li><strong>O₂ nur bei SpO₂ &lt; 95 %.<\/strong><\/li>\n<li><strong>Blutdruck präklinisch nicht senken<\/strong> (ESO 2025), außer bei ≥ 220 mmHg systolisch oder ≥ 120 mmHg diastolisch; dann vorsichtig titriert (z. B. Urapidil 5 mg), keine abrupten Abfälle. Hypotonie vermeiden und behandeln.<\/li>\n<li><strong>BZ:<\/strong> &lt; 60 mg/dl korrigieren, Zielbereich 70–200 mg/dl, kein Insulin präklinisch.<\/li>\n<li><strong>Oberkörper 30°<\/strong> bei Bewusstseinsstörung, Erbrechen oder Aspirationsgefahr, sonst flach erlaubt.<\/li>\n<li><strong>Nüchtern lassen<\/strong> (Schluckstörung). Zugang am nicht betroffenen Arm, keine i.m.-Injektionen.<\/li>\n<li><strong>Kein ASS, kein Heparin<\/strong> präklinisch (Blutung nicht ausgeschlossen).<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-neu\">\n<div class=\"box-label\">Evidenz &amp; Neu<\/div>\n<ul>\n<li><strong>INTERACT4 (NEJM 2024, n = 2404):<\/strong> Urapidil im Rettungswagen auf RR sys 130–140 mmHg bei Verdacht auf Schlaganfall brachte insgesamt keinen Nutzen. Beim ischämischen Schlaganfall war das Outcome <strong>schlechter<\/strong> (cOR 1,30), nur bei intrazerebraler Blutung besser (cOR 0,75). Da präklinisch nicht unterscheidbar: <strong>nicht senken.<\/strong> Die ESO-Blutdruckleitlinie 2025 rät ausdrücklich davon ab.<\/li>\n<li><strong>Tenecteplase<\/strong> (0,25 mg/kg, max. 25 mg als Einzelbolus) ist zur Lyse beim ischämischen Schlaganfall ≤ 4,5 h zugelassen und ersetzt vielerorts Alteplase. Präklinisch ändert sich nichts.<\/li>\n<li><strong>Transportmodell:<\/strong> Mothership (direkt ins Thrombektomiezentrum) und Drip-and-ship sind in Studien (RACECAT 2022) gleichwertig; bei intrazerebraler Blutung schnitt der Umweg ins Zentrum schlechter ab. Regionales Konzept befolgen.<\/li>\n<li><strong>Wake-up-Stroke und unklares Zeitfenster<\/strong> sind über Bildgebung (Mismatch) oft noch behandelbar. Transport nicht wegen „zu spät\" unterlassen; Thrombektomie bei LVO bis 24 h möglich.<\/li>\n<li><strong>Leitlinienstand:<\/strong> Die DGN-Leitlinie (2022) ist formal abgelaufen und in Überarbeitung; neu ist die AHA/ASA-Leitlinie 2026.<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Hintere Strombahn:<\/strong> Schwindel, Ataxie, Doppelbilder, Dysarthrie, fluktuierende Vigilanz. Die <strong>Basilaristhrombose<\/strong> ist ein Notfall mit erweitertem Zeitfenster und wird oft als Intoxikation oder „Schwindel\" verkannt.<\/li>\n<li><strong>Stroke-Mimics:<\/strong> Hypoglykämie, postiktale Parese (Todd), Migräne mit Aura, Intoxikation, Enzephalitis, funktionelle Störung. Im Zweifel als Schlaganfall behandeln.<\/li>\n<li><strong>Junge Patienten<\/strong> mit Nacken- oder Kopfschmerz: Dissektion der hirnversorgenden Arterien.<\/li>\n<li><strong>Krampfanfall zu Beginn<\/strong> schließt einen Schlaganfall nicht aus.<\/li>\n<\/ul>\n<\/div>\n<h3 id=\"k600-zeitfenster-der-akuttherapie\">Zeitfenster der Akuttherapie<\/h3>\n<table>\n<thead>\n<tr>\n<th>Therapie<\/th>\n<th>Zeitfenster<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Systemische Lyse<\/td>\n<td>≤ 4,5 h nach „zuletzt gesund gesehen\"; mit Mismatch-Bildgebung auch bis 9 h und beim Wake-up-Stroke<\/td>\n<\/tr>\n<tr>\n<td>Thrombektomie bei LVO<\/td>\n<td>≤ 6 h; mit Bildgebung bis 24 h<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":" \n vorgehen \n \n  screening:  be-fast (balance, eyes, face, arm, speech, time). bei positivem befund hinweise auf  großen gefäßverschluss (lvo)  prüfen: blickdeviation, hemiplegie, aphasie oder neglect; score nach regionalem konzept (z. b. race ≥ 5, fast-ed ≥ 4). \n  zeitpunkt „zuletzt gesund gesehen\"  exakt dokumentieren, nicht den zeitpunkt des auffindens. \n  antikoagulation:  substanz, dosis, letzte einnahme. schließt thrombektomie nicht aus. \n  telefonnummer  eines angehörigen oder zeugen mitnehmen. medikamentenplan mitnehmen. \n  bz messen.  hypoglykämie ist der häufigste stroke-mimic. \n  zielklinik nach regionalem konzept:  stroke unit; bei lvo-verdacht direkt ins thrombektomiezentrum, wenn der zeitverlust vertretbar ist. \n  voranmeldung  mit zeitfenster, befund, antikoagulation. \n \n \n \n allgemeinmaßnahmen \n \n  o₂ nur bei spo₂ < 95 %.  \n  blutdruck präklinisch nicht senken  (eso 2025), außer bei ≥ 220 mmhg systolisch oder ≥ 120 mmhg diastolisch; dann vorsichtig titriert (z. b. urapidil 5 mg), keine abrupten abfälle. hypotonie vermeiden und behandeln. \n  bz:  < 60 mg/dl korrigieren, zielbereich 70–200 mg/dl, kein insulin präklinisch. \n  oberkörper 30°  bei bewusstseinsstörung, erbrechen oder aspirationsgefahr, sonst flach erlaubt. \n  nüchtern lassen  (schluckstörung). zugang am nicht betroffenen arm, keine i.m.-injektionen. \n  kein ass, kein heparin  präklinisch (blutung nicht ausgeschlossen). \n \n \n \n evidenz & neu \n \n  interact4 (nejm 2024, n = 2404):  urapidil im rettungswagen auf rr sys 130–140 mmhg bei verdacht auf schlaganfall brachte insgesamt keinen nutzen. beim ischämischen schlaganfall war das outcome  schlechter  (cor 1,30), nur bei intrazerebraler blutung besser (cor 0,75). da präklinisch nicht unterscheidbar:  nicht senken.  die eso-blutdruckleitlinie 2025 rät ausdrücklich davon ab. \n  tenecteplase  (0,25 mg/kg, max. 25 mg als einzelbolus) ist zur lyse beim ischämischen schlaganfall ≤ 4,5 h zugelassen und ersetzt vielerorts alteplase. präklinisch ändert sich nichts. \n  transportmodell:  mothership (direkt ins thrombektomiezentrum) und drip-and-ship sind in studien (racecat 2022) gleichwertig; bei intrazerebraler blutung schnitt der umweg ins zentrum schlechter ab. regionales konzept befolgen. \n  wake-up-stroke und unklares zeitfenster  sind über bildgebung (mismatch) oft noch behandelbar. transport nicht wegen „zu spät\" unterlassen; thrombektomie bei lvo bis 24 h möglich. \n  leitlinienstand:  die dgn-leitlinie (2022) ist formal abgelaufen und in überarbeitung; neu ist die aha/asa-leitlinie 2026. \n \n \n \n pitfalls \n \n  hintere strombahn:  schwindel, ataxie, doppelbilder, dysarthrie, fluktuierende vigilanz. die  basilaristhrombose  ist ein notfall mit erweitertem zeitfenster und wird oft als intoxikation oder „schwindel\" verkannt. \n  stroke-mimics:  hypoglykämie, postiktale parese (todd), migräne mit aura, intoxikation, enzephalitis, funktionelle störung. im zweifel als schlaganfall behandeln. \n  junge patienten  mit nacken- oder kopfschmerz: dissektion der hirnversorgenden arterien. \n  krampfanfall zu beginn  schließt einen schlaganfall nicht aus. \n \n \n zeitfenster der akuttherapie \n \n \n \n therapie \n zeitfenster \n \n \n \n \n systemische lyse \n ≤ 4,5 h nach „zuletzt gesund gesehen\"; mit mismatch-bildgebung auch bis 9 h und beim wake-up-stroke \n \n \n thrombektomie bei lvo \n ≤ 6 h; mit bildgebung bis 24 h \n \n \n  schlaganfall"},"icb":{"ch":6,"cht":"Neurologie","t":"Intrazerebrale Blutung und Subarachnoidalblutung","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li>Präklinisch vom ischämischen Schlaganfall nicht sicher zu unterscheiden. Hinweise: Kopfschmerz, Erbrechen, rasche Vigilanzminderung, sehr hoher Blutdruck, Antikoagulation.<\/li>\n<li><strong>Antikoagulans und letzte Einnahme<\/strong> an die Klinik melden: Die Antagonisierung (PPSB, Idarucizumab, Andexanet) hängt davon ab. Blutdrucksenkung erst in der Klinik nach Bildgebung (Ziel dort RR sys um 140 mmHg, nicht &lt; 130).<\/li>\n<li><strong>SAB:<\/strong> Vernichtungskopfschmerz mit Maximum innerhalb von 1 min („thunderclap\"), Meningismus, Übelkeit. Analgesie (Opioid titriert, kein ASS), Antiemese, Blutdruck: Spitzen vermeiden, RR sys &lt; 160 mmHg als grobe Orientierung, Ziel neurochirurgisches Zentrum.<\/li>\n<li><strong>Atemweg:<\/strong> Bei GCS ≤ 8 oder fehlenden Schutzreflexen Narkose; Hypotonie und Hustenstoß vermeiden, Normokapnie.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n präklinisch vom ischämischen schlaganfall nicht sicher zu unterscheiden. hinweise: kopfschmerz, erbrechen, rasche vigilanzminderung, sehr hoher blutdruck, antikoagulation. \n  antikoagulans und letzte einnahme  an die klinik melden: die antagonisierung (ppsb, idarucizumab, andexanet) hängt davon ab. blutdrucksenkung erst in der klinik nach bildgebung (ziel dort rr sys um 140 mmhg, nicht < 130). \n  sab:  vernichtungskopfschmerz mit maximum innerhalb von 1 min („thunderclap\"), meningismus, übelkeit. analgesie (opioid titriert, kein ass), antiemese, blutdruck: spitzen vermeiden, rr sys < 160 mmhg als grobe orientierung, ziel neurochirurgisches zentrum. \n  atemweg:  bei gcs ≤ 8 oder fehlenden schutzreflexen narkose; hypotonie und hustenstoß vermeiden, normokapnie. \n \n  intrazerebrale blutung und subarachnoidalblutung"},"krampf":{"ch":6,"cht":"Neurologie","t":"Krampfanfall und Status epilepticus","html":"<div class=\"box box-kern\">\n<div class=\"box-label\">Vorgehen<\/div>\n<ul>\n<li><strong>Status epilepticus:<\/strong> konvulsiver Anfall ≥ 5 min oder Serie ohne zwischenzeitliches Wiedererlangen des Bewusstseins. Jetzt behandeln, nicht weiter abwarten.<\/li>\n<li><strong>Erste Stufe (5–10 min): Benzodiazepin in ausreichender Dosis<\/strong>, einmal wiederholbar nach 5 min.<\/li>\n<li><strong>Zweite Stufe (ab 10–20 min, falls mitgeführt):<\/strong> Levetiracetam, Valproat oder Phenytoin. In ESETT gleich wirksam (knapp die Hälfte Anfallsende); bei Kindern ConSEPT und EcLiPSE ebenso.<\/li>\n<li><strong>Dritte Stufe:<\/strong> Narkose (Propofol, Midazolam, Thiopental) mit Atemwegssicherung. Ketamin führt die DGN erst beim superrefraktären Status; Studiendaten zum frühen Einsatz (KESETT) stehen aus.<\/li>\n<li><strong>Parallel:<\/strong> BZ, Temperatur, Ursache suchen (Entzug, Hyponatriämie, Intoxikation, Trauma, Eklampsie, Infekt, Absetzen der Antikonvulsiva).<\/li>\n<\/ul>\n<\/div>\n<div class=\"box box-dosis\">\n<div class=\"box-label\">Medikamente &amp; Dosis<\/div>\n<table>\n<thead>\n<tr>\n<th>Stufe<\/th>\n<th>Substanz<\/th>\n<th>Dosis<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Midazolam i.m.<\/td>\n<td>10 mg (&gt; 40 kg), 5 mg (13–40 kg)<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>Midazolam bukkal / i.n.<\/td>\n<td>10 mg bukkal, i.n. 0,2 mg/kg (max. 10 mg)<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>Midazolam i.v.<\/td>\n<td>0,2 mg/kg (max. 10 mg je Gabe)<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>Lorazepam i.v.<\/td>\n<td>0,1 mg/kg (max. 4 mg je Gabe; Kühlpflicht, oft nicht an Bord)<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>Diazepam i.v.<\/td>\n<td>0,15–0,2 mg/kg (max. 10 mg je Gabe)<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>Clonazepam i.v.<\/td>\n<td>0,015 mg/kg (max. 1 mg je Gabe)<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Levetiracetam<\/td>\n<td>60 mg/kg i.v. über 10 min (max. 4500 mg)<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Valproat<\/td>\n<td>40 mg/kg i.v. über 10 min (max. 3000 mg)<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Phenytoin<\/td>\n<td>20 mg/kg i.v., max. 50 mg/min, mit Monitor<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"box box-pitfall\">\n<div class=\"box-label\">Pitfalls<\/div>\n<ul>\n<li><strong>Unterdosierung der Benzodiazepine<\/strong> ist der häufigste Fehler; in einer großen US-Rettungsdienst-Serie erhielt kaum jemand die vollen 10 mg Midazolam, und höhere Dosen bedeuteten weniger Folgetherapie. Mehr als zwei Benzodiazepin-Gaben erhöhen vor allem die Atemdepression, nicht die Wirkung; dann zweite Stufe.<\/li>\n<li><strong>Midazolam i.m.<\/strong> ist bei fehlendem Zugang schneller wirksam als der Versuch, einen Zugang beim krampfenden Patienten zu legen (RAMPART).<\/li>\n<li><strong>Valproat<\/strong> nicht bei Schwangerschaft, Leberschaden, Mitochondriopathie, Kindern &lt; 2 J.<\/li>\n<li><strong>Nicht wach nach Anfallsende<\/strong> (&gt; 20–30 min): nicht-konvulsiver Status, Intoxikation, SHT, Blutung bedenken.<\/li>\n<li><strong>Psychogener nicht-epileptischer Anfall:<\/strong> geschlossene Augen mit Widerstand, Seit-zu-Seit-Kopfbewegung, Beckenbewegungen, wechselnder Verlauf, lange Dauer. Keine Eskalation bis zur Narkose ohne klares Bild.<\/li>\n<li><strong>Anfall in der Schwangerschaft ab 20. SSW oder im Wochenbett<\/strong> ist eine Eklampsie, bis das Gegenteil bewiesen ist: Magnesium (Kapitel 13).<\/li>\n<li><strong>Alkoholiker:<\/strong> Thiamin 100 mg i.v., Glukose nicht verzögern.<\/li>\n<\/ul>\n<\/div>","text":" \n vorgehen \n \n  status epilepticus:  konvulsiver anfall ≥ 5 min oder serie ohne zwischenzeitliches wiedererlangen des bewusstseins. jetzt behandeln, nicht weiter abwarten. \n  erste stufe (5–10 min): benzodiazepin in ausreichender dosis , einmal wiederholbar nach 5 min. \n  zweite stufe (ab 10–20 min, falls mitgeführt):  levetiracetam, valproat oder phenytoin. in esett gleich wirksam (knapp die hälfte anfallsende); bei kindern consept und eclipse ebenso. \n  dritte stufe:  narkose (propofol, midazolam, thiopental) mit atemwegssicherung. ketamin führt die dgn erst beim superrefraktären status; studiendaten zum frühen einsatz (kesett) stehen aus. \n  parallel:  bz, temperatur, ursache suchen (entzug, hyponatriämie, intoxikation, trauma, eklampsie, infekt, absetzen der antikonvulsiva). \n \n \n \n medikamente & dosis \n \n \n \n stufe \n substanz \n dosis \n \n \n \n \n 1 \n midazolam i.m. \n 10 mg (> 40 kg), 5 mg (13–40 kg) \n \n \n 1 \n midazolam bukkal / i.n. \n 10 mg bukkal, i.n. 0,2 mg/kg (max. 10 mg) \n \n \n 1 \n midazolam i.v. \n 0,2 mg/kg (max. 10 mg je gabe) \n \n \n 1 \n lorazepam i.v. \n 0,1 mg/kg (max. 4 mg je gabe; kühlpflicht, oft nicht an bord) \n \n \n 1 \n diazepam i.v. \n 0,15–0,2 mg/kg (max. 10 mg je gabe) \n \n \n 1 \n clonazepam i.v. \n 0,015 mg/kg (max. 1 mg je gabe) \n \n \n 2 \n levetiracetam \n 60 mg/kg i.v. über 10 min (max. 4500 mg) \n \n \n 2 \n valproat \n 40 mg/kg i.v. über 10 min (max. 3000 mg) \n \n \n 2 \n phen
