<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const CONTENT = window.CONTENT;
const SECTIONS = CONTENT.sections;
const CODES = window.CODES;
const CODEMAP = Object.fromEntries(CODES.map((c) => [c.c, c]));
const GROUPS = window.CODE_GROUPS;
const PROBLEMS = window.PROBLEMS;
const SYSTEMS = window.SYSTEMS;
const QUICK = window.QUICK || {};
const QLABEL = { E: "Erkennen", S: "Tun", D: "Dosis", Z: "Ziel", A: "Achtung" };
const RA_KEYS = ["ra", "ficb", "femur-schaft", "patella", "osg", "schulter", "haematom", "finger", "rippen", "ra-vor", "la", "last"];

const AGES = [
  ["erw", "Erw."],
  ["jug", "> 12 J"],
  ["k2", "7–12 J"],
  ["k1", "1–6 J"],
  ["k0", "< 1 J"],
];
const AGE_LABEL = { erw: "Erwachsen", jug: "> 12 J", k2: "7–12 J", k1: "1–6 J", k0: "< 1 J" };
const AGE_INFO = {
  k0: "Säugling, etwa 3–10 kg. Dosis nach Gewicht, Längenband nutzen.",
  k1: "Etwa 10–22 kg; grobe Faustformel (Alter + 4) × 2.",
  k2: "Etwa 22–40 kg; (Alter + 4) × 2 bis 10 J, danach eher mehr.",
  jug: "Meist ab 40 kg; Erwachsenendosen in der Regel ab etwa 50 kg.",
};
const FALLBACK = {
  erw: ["erw"],
  jug: ["jug", "erw"],
  k2: ["k2", "k1", "jug"],
  k1: ["k1", "k2", "k0"],
  k0: ["k0", "k1"],
};
const SYS_CHAPTERS = {
  neuro: [6], atmung: [5, 12], kreislauf: [4, 15], abdomen: [14], stoff: [7],
  tox: [8, 5], psych: [9], trauma: [10, 3, 2], umwelt: [11, 15], gyn: [13],
  hno: [14], lage: [1],
};

const store = {
  get(k, d) {
    try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; }
  },
  set(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ohne Speicher weiter */ }
  },
};

function parseItem(s) {
  const crit = s.startsWith("!");
  const parts = (crit ? s.slice(1) : s).split("|");
  let hint = parts[1] || "";
  let link = parts[2] || "";
  if (parts.length === 2 && (SECTIONS[hint] || PROBLEMS[hint])) { link = hint; hint = ""; }
  return { crit, name: parts[0], hint, link };
}

function ddFor(pkey, age) {
  const p = PROBLEMS[pkey];
  if (!p) return { list: [], used: age };
  for (const band of FALLBACK[age]) {
    if (p[band]) return { list: p[band].map(parseItem), used: band };
  }
  return { list: (p.erw || []).map(parseItem), used: "erw" };
}

function uniq(arr) { return [...new Set(arr.filter(Boolean))]; }

/* ---------- Bausteine ---------- */

function Quick({ k }) {
  const q = QUICK[k];
  if (!q) return null;
  return (
    <ul className="quick">
      {q.map((line, i) => {
        const [t, ...rest] = line.split("|");
        return (
          <li key={i} className={"q q" + t}>
            <span className="qt">{QLABEL[t] || t}</span>
            <span className="qx">{rest.join("|")}</span>
          </li>
        );
      })}
    </ul>
  );
}

function ReminderCard({ k, onOpen }) {
  const s = SECTIONS[k];
  if (!s || !QUICK[k]) return null;
  return (
    <section className="pcard rem">
      <header className="phead">
        <h3>{s.t}</h3>
        <span className="agechip">Reminder</span>
      </header>
      <Quick k={k} />
      <button className="minibtn more" onClick={() => onOpen(k)}>Ausführlich: Kapitel {s.ch} ›</button>
    </section>
  );
}

function SectionButton({ k, onOpen }) {
  const s = SECTIONS[k];
  if (!s) return null;
  return (
    <button className="secbtn" onClick={() => onOpen(k)}>
      <span className="secnum">{s.ch}</span>
      <span className="sectxt">
        <span className="sect">{s.t}</span>
        <span className="secc">{s.cht}</span>
      </span>
      <span className="chev" aria-hidden="true">›</span>
    </button>
  );
}

function DDItem({ it, onOpen, onProblem }) {
  const target = it.link && (SECTIONS[it.link] ? "s" : PROBLEMS[it.link] ? "p" : "");
  const click = target === "s" ? () => onOpen(it.link) : target === "p" ? () => onProblem(it.link) : null;
  const Tag = click ? "button" : "div";
  return (
    <Tag className={"dd" + (it.crit ? " crit" : "") + (click ? " link" : "")} onClick={click || undefined}>
      <span className="ddn">{it.name}</span>
      {it.hint && <span className="ddh">{it.hint}</span>}
      {click && <span className="ddgo" aria-hidden="true">{target === "s" ? "Kapitel ›" : "DD ›"}</span>}
    </Tag>
  );
}

function ProblemCard({ pkey, age, onOpen, onProblem, compact }) {
  const p = PROBLEMS[pkey];
  if (!p) return null;
  const { list, used } = ddFor(pkey, age);
  const crit = list.filter((i) => i.crit);
  const rest = list.filter((i) => !i.crit);
  const fellBack = used !== age;
  return (
    <section className="pcard">
      <header className="phead">
        <h3>{p.t}</h3>
        <span className={"agechip" + (used === "erw" ? "" : " kid")}>{AGE_LABEL[used]}</span>
      </header>
      {fellBack && age !== "erw" && (
        <p className="fallback">
          {used === "erw"
            ? "Keine eigene Liste für diese Altersgruppe: Erwachsenen-DD, Dosierung nach Kapitel 12."
            : `Liste der Gruppe ${AGE_LABEL[used]} (nächstliegende Altersgruppe).`}
        </p>
      )}
      {p.n && <p className="pnote">{p.n}</p>}
      {crit.length > 0 && (
        <div className="ddgroup">
          <div className="ddlabel crit">Nicht verpassen</div>
          {crit.map((it, i) => <DDItem key={i} it={it} onOpen={onOpen} onProblem={onProblem} />)}
        </div>
      )}
      {rest.length > 0 && (
        <div className="ddgroup">
          <div className="ddlabel">Weitere Differenzialdiagnosen</div>
          {rest.map((it, i) => <DDItem key={i} it={it} onOpen={onOpen} onProblem={onProblem} />)}
        </div>
      )}
      {!compact && p.s && p.s.length > 0 && (
        <div className="seclist">
          {p.s.map((k) => <SectionButton key={k} k={k} onOpen={onOpen} />)}
        </div>
      )}
    </section>
  );
}

function AgeBar({ age, setAge, auto }) {
  return (
    <div className="agebar" role="group" aria-label="Altersgruppe">
      {AGES.map(([k, l]) => (
        <button
          key={k}
          className={"agebtn" + (age === k ? " on" : "") + (k !== "erw" ? " kid" : "")}
          aria-pressed={age === k}
          aria-label={AGE_LABEL[k]}
          onClick={() => setAge(k)}
        >
          {l}
        </button>
      ))}
      {auto && <span className="autoage">Altersgruppe aus Melder übernommen</span>}
    </div>
  );
}

function KidInfo({ age, onOpen }) {
  if (age === "erw") return null;
  return (
    <div className="kidinfo">
      <div>
        <strong>{AGE_LABEL[age]}:</strong> {AGE_INFO[age]}
      </div>
      <div className="kidlinks">
        <button className="minibtn" onClick={() => onOpen("kind-grund")}>Kinderdosen</button>
        {age === "k0" && <button className="minibtn" onClick={() => onOpen("nls")}>Neugeborenes</button>}
        <button className="minibtn" onClick={() => onOpen("kinderschutz")}>Kinderschutz</button>
      </div>
    </div>
  );
}

/* ---------- Melder ---------- */

function Keypad({ onDigit, onBack, onList }) {
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9"];
  return (
    <div className="keypad">
      {keys.map((k) => (
        <button key={k} className="key" onClick={() => onDigit(k)}>{k}</button>
      ))}
      <button className="key fn" onClick={onBack} aria-label="Ziffer löschen">⌫</button>
      <button className="key" onClick={() => onDigit("0")}>0</button>
      <button className="key fn" onClick={onList}>Liste</button>
    </div>
  );
}

function CodeList({ onPick, onClose, selected }) {
  const [q, setQ] = useState("");
  const ql = q.trim().toLowerCase();
  const filtered = CODES.filter((c) => !ql || c.c.startsWith(ql) || c.t.toLowerCase().includes(ql));
  return (
    <div className="overlay" role="dialog" aria-label="Codeliste">
      <div className="ovhead">
        <button className="back" onClick={onClose}>‹ Zurück</button>
        <input
          id="codesearch"
          className="search"
          placeholder="Code oder Stichwort"
          value={q}
          autoFocus
          onChange={(e) => setQ(e.target.value)}
        />
      </div>
      <div className="ovbody">
        {GROUPS.map(([g, gl]) => {
          const items = filtered.filter((c) => c.g === g);
          if (!items.length) return null;
          return (
            <div key={g} className="cgroup">
              <div className="cglabel">{gl}</div>
              {items.map((c) => (
                <button
                  key={c.c}
                  className={"crow" + (selected.includes(c.c) ? " on" : "") + (c.org ? " org" : "")}
                  onClick={() => onPick(c.c)}
                >
                  <span className="ccode">{c.c}</span>
                  <span className="ctitle">{c.t}</span>
                  {selected.includes(c.c) && <span className="ccheck">✓</span>}
                </button>
              ))}
            </div>
          );
        })}
        {!filtered.length && <p className="empty">Kein Code passt zu „{q}“.</p>}
      </div>
    </div>
  );
}

function Results({ codes, age, onOpen, onProblem }) {
  const cs = codes.map((c) => CODEMAP[c]).filter(Boolean);
  const notes = cs.filter((c) => c.n);
  const probs = uniq(cs.flatMap((c) => c.p || []));
  const secs = uniq([
    ...cs.flatMap((c) => c.s || []),
    ...probs.flatMap((p) => (PROBLEMS[p] && PROBLEMS[p].s) || []),
    ...(age !== "erw" && probs.length ? ["kind-grund"] : []),
  ]);
  const onlyOrg = cs.length > 0 && cs.every((c) => c.org || c.z) && probs.length === 0;
  const remKeys = uniq([
    ...cs.filter((c) => !c.z).flatMap((c) => c.s || []),
    ...probs.map((p) => PROBLEMS[p] && PROBLEMS[p].s && PROBLEMS[p].s[0]),
  ]).filter((k) => QUICK[k]).slice(0, 3);
  if (!cs.length) {
    return (
      <div className="hint">
        <p>Codes vom Melder eintippen, z. B. <b className="mono">022</b> und <b className="mono">908</b>.</p>
        <p>Die Differenzialdiagnosen passen sich der Altersgruppe an; jede Zeile mit Pfeil öffnet das passende Kapitel.</p>
      </div>
    );
  }
  return (
    <div className="results">
      {notes.length > 0 && (
        <div className="notes">
          <div className="noteslabel">Auf der Anfahrt</div>
          {notes.map((c) => (
            <p key={c.c} className="note"><span className="mono">{c.c}</span> {c.n}</p>
          ))}
        </div>
      )}
      {onlyOrg && <p className="hint">Organisatorischer Code ohne medizinische Differenzialdiagnose.</p>}
      {remKeys.map((k) => <ReminderCard key={k} k={k} onOpen={onOpen} />)}
      {probs.map((p) => (
        <ProblemCard key={p} pkey={p} age={age} onOpen={onOpen} onProblem={onProblem} compact />
      ))}
      {secs.length > 0 && (
        <section className="pcard">
          <header className="phead"><h3>Kapitel zum Einsatz</h3></header>
          <div className="seclist">
            {secs.map((k) => <SectionButton key={k} k={k} onOpen={onOpen} />)}
          </div>
        </section>
      )}
    </div>
  );
}

function MelderView({ codes, setCodes, age, onOpen, onProblem }) {
  const [buf, setBuf] = useState("");
  const [list, setList] = useState(false);
  const [pad, setPad] = useState(true);
  const preview = buf.length ? CODES.filter((c) => c.c.startsWith(buf)) : [];

  function addCode(c) {
    if (!CODEMAP[c]) return;
    setCodes((cur) => (cur.includes(c) ? cur : [...cur, c]));
  }
  function digit(d) {
    const nb = (buf + d).slice(0, 3);
    if (nb.length === 3) {
      if (CODEMAP[nb]) { addCode(nb); setBuf(""); } else { setBuf(nb); }
    } else setBuf(nb);
  }
  const unknown = buf.length === 3 && !CODEMAP[buf];

  return (
    <div className="melder">
      <div className="pager" aria-live="polite">
        <div className="lcd">
          <span className="lcddigits mono">{(buf + "___").slice(0, 3).split("").join(" ")}</span>
          <span className="lcdlabel">
            {unknown ? "Code nicht in der Tabelle" : preview.length === 1 ? preview[0].t : preview.length > 1 ? `${preview.length} Codes beginnen mit ${buf}` : "Code eingeben"}
          </span>
        </div>
        {preview.length > 1 && preview.length <= 12 && (
          <div className="prevrow">
            {preview.map((c) => (
              <button key={c.c} className="prevbtn" onClick={() => { addCode(c.c); setBuf(""); }}>
                <span className="mono">{c.c}</span> {c.t}
              </button>
            ))}
          </div>
        )}
        {pad && <Keypad onDigit={digit} onBack={() => setBuf(buf.slice(0, -1))} onList={() => setList(true)} />}
        {codes.length > 0 && (
          <button className="padtoggle" onClick={() => setPad(!pad)}>
            {pad ? "Ziffernblock ausblenden" : "Code hinzufügen"}
          </button>
        )}
      </div>

      <div className="chips">
        {codes.map((c) => (
          <button key={c} className={"chip" + (CODEMAP[c].a ? " kid" : "") + (CODEMAP[c].z ? " z" : "")} onClick={() => setCodes(codes.filter((x) => x !== c))} aria-label={`Code ${c} entfernen`}>
            <span className="mono">{c}</span> {CODEMAP[c].t} <span className="x" aria-hidden="true">×</span>
          </button>
        ))}
        {codes.length > 0 && (
          <button className="chip clear" onClick={() => { setCodes([]); setBuf(""); setPad(true); }}>Neuer Einsatz</button>
        )}
      </div>

      <KidInfo age={age} onOpen={onOpen} />
      <Results codes={codes} age={age} onOpen={onOpen} onProblem={onProblem} />

      {list && (
        <CodeList
          selected={codes}
          onClose={() => setList(false)}
          onPick={(c) => { codes.includes(c) ? setCodes(codes.filter((x) => x !== c)) : addCode(c); }}
        />
      )}
    </div>
  );
}

/* ---------- Organsystem ---------- */

function OrganView({ age, onOpen, sys, setSys, prob, setProb }) {
  if (prob) {
    return (
      <div className="organ">
        <button className="back inline" onClick={() => setProb(null)}>‹ {SYSTEMS.find((s) => s[0] === PROBLEMS[prob].sys)[1]}</button>
        <KidInfo age={age} onOpen={onOpen} />
        <ProblemCard pkey={prob} age={age} onOpen={onOpen} onProblem={setProb} />
      </div>
    );
  }
  if (sys === "ra") {
    return (
      <div className="organ">
        <button className="back inline" onClick={() => setSys(null)}>‹ Alle Organsysteme</button>
        <h2 className="vh">Regionalanästhesie nach Lagebild</h2>
        <div className="plist">
          {RA_KEYS.filter((k) => SECTIONS[k]).map((k) => (
            <button key={k} className="prow" onClick={() => onOpen(k)}>
              <span className="ptitle">{SECTIONS[k].t.replace("Lagebild: ", "")}</span>
              <span className="pmeta">{QUICK[k] ? QUICK[k][0].split("|").slice(1).join("|") : ""}</span>
              <span className="chev" aria-hidden="true">›</span>
            </button>
          ))}
        </div>
      </div>
    );
  }
  if (sys) {
    const probs = Object.entries(PROBLEMS).filter(([, p]) => p.sys === sys);
    const chs = SYS_CHAPTERS[sys] || [];
    return (
      <div className="organ">
        <button className="back inline" onClick={() => setSys(null)}>‹ Alle Organsysteme</button>
        <h2 className="vh">{SYSTEMS.find((s) => s[0] === sys)[1]}</h2>
        <div className="plist">
          {probs.map(([k, p]) => {
            const { list } = ddFor(k, age);
            const n = list.filter((i) => i.crit).length;
            return (
              <button key={k} className="prow" onClick={() => setProb(k)}>
                <span className="ptitle">{p.t}</span>
                <span className="pmeta">{n} kritisch · {list.length} DD</span>
                <span className="chev" aria-hidden="true">›</span>
              </button>
            );
          })}
        </div>
        {chs.length > 0 && (
          <section className="pcard">
            <header className="phead"><h3>Kapitel</h3></header>
            <div className="seclist">
              {CONTENT.chapters.filter((c) => chs.includes(c.n)).flatMap((c) => c.keys).map((k) => (
                <SectionButton key={k} k={k} onOpen={onOpen} />
              ))}
            </div>
          </section>
        )}
      </div>
    );
  }
  return (
    <div className="organ">
      <div className="sysgrid">
        <button className="sysbtn ra" onClick={() => setSys("ra")}>
          <span className="systitle">Regionalanästhesie</span>
          <span className="sysmeta">nach Lagebild</span>
        </button>
        {SYSTEMS.map(([k, l]) => {
          const n = Object.values(PROBLEMS).filter((p) => p.sys === k).length;
          return (
            <button key={k} className="sysbtn" onClick={() => setSys(k)}>
              <span className="systitle">{l}</span>
              <span className="sysmeta">{n} Leitsymptom{n === 1 ? "" : "e"}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- Kapitel ---------- */

function KapitelView({ onOpen }) {
  const [q, setQ] = useState("");
  const ql = q.trim().toLowerCase();
  const hits = useMemo(() => {
    if (ql.length < 3) return null;
    return Object.entries(SECTIONS)
      .filter(([, s]) => s.t.toLowerCase().includes(ql) || s.text.includes(ql))
      .map(([k]) => k);
  }, [ql]);
  return (
    <div className="kapitel">
      <input id="volltext" className="search wide" placeholder="Volltextsuche, z. B. Ketamin, Tourniquet" value={q} onChange={(e) => setQ(e.target.value)} />
      {hits ? (
        <div className="seclist">
          {hits.length ? hits.map((k) => <SectionButton key={k} k={k} onOpen={onOpen} />) : <p className="empty">Kein Treffer.</p>}
        </div>
      ) : (
        CONTENT.chapters.map((c) => (
          <section key={c.n + c.t} className="chap">
            <h3 className="chapt"><span className="secnum">{c.back ? "A" : c.n}</span>{c.t}</h3>
            <div className="seclist">
              {c.keys.map((k) => <SectionButton key={k} k={k} onOpen={onOpen} />)}
            </div>
          </section>
        ))
      )}
    </div>
  );
}

/* ---------- Leseansicht ---------- */

function Reader({ k, onClose, onOpen }) {
  const s = SECTIONS[k];
  const ref = useRef(null);
  const [view, setView] = useState("kurz");
  useEffect(() => { if (ref.current) ref.current.scrollTop = 0; setView("kurz"); }, [k]);
  if (!s) return null;
  const chap = CONTENT.chapters.find((c) => c.keys.includes(k));
  const idx = chap ? chap.keys.indexOf(k) : -1;
  const prev = idx > 0 ? chap.keys[idx - 1] : null;
  const next = chap && idx < chap.keys.length - 1 ? chap.keys[idx + 1] : null;
  return (
    <div className="overlay reader" role="dialog" aria-label={s.t}>
      <div className="ovhead">
        <button className="back" onClick={onClose}>‹ Zurück</button>
        <div className="rtitle">
          <span className="rch">{s.back ? "Anhang" : `Kapitel ${s.ch}`} · {s.cht}</span>
          <span className="rt">{s.t}</span>
        </div>
      </div>
      <div className="ovbody" ref={ref}>
        {QUICK[k] && (
          <div className="rtabs" role="tablist">
            <button role="tab" aria-selected={view === "kurz"} className={"rtab" + (view === "kurz" ? " on" : "")} onClick={() => setView("kurz")}>Kurz</button>
            <button role="tab" aria-selected={view === "lang"} className={"rtab" + (view === "lang" ? " on" : "")} onClick={() => setView("lang")}>Ausführlich</button>
          </div>
        )}
        {QUICK[k] && view === "kurz" ? (
          <div className="rd"><Quick k={k} /></div>
        ) : (
          <article className="rd" dangerouslySetInnerHTML={{ __html: s.html }} />
        )}
        <div className="rnav">
          {prev ? <button className="minibtn" onClick={() => onOpen(prev)}>‹ {SECTIONS[prev].t}</button> : <span />}
          {next ? <button className="minibtn" onClick={() => onOpen(next)}>{SECTIONS[next].t} ›</button> : <span />}
        </div>
      </div>
    </div>
  );
}

/* ---------- App ---------- */

function App() {
  const saved = store.get("nefm_state", {});
  const [mode, setMode] = useState(saved.mode || "melder");
  const [codes, setCodes] = useState(Array.isArray(saved.codes) ? saved.codes.filter((c) => CODEMAP[c]) : []);
  const [manualAge, setManualAge] = useState(saved.manualAge || null);
  const [reader, setReader] = useState(null);
  const [sys, setSys] = useState(null);
  const [prob, setProb] = useState(null);

  const codeAge = useMemo(() => {
    const a = codes.map((c) => CODEMAP[c] && CODEMAP[c].a).filter(Boolean);
    return a.length ? a[a.length - 1] : null;
  }, [codes]);
  const age = manualAge || codeAge || "erw";

  useEffect(() => { setManualAge(null); }, [codeAge]);
  useEffect(() => { store.set("nefm_state", { mode, codes, manualAge }); }, [mode, codes, manualAge]);

  function openProblem(k) { setReader(null); setMode("organ"); setSys(PROBLEMS[k].sys); setProb(k); }

  return (
    <div className="app">
      <header className="top">
        <div className="brand">
          <span className="logo mono">NEF</span>
          <span className="bname">Melder</span>
          <span className="bsub">Einsatzcodes RLP 2023_v1</span>
        </div>
        <nav className="tabs" role="tablist">
          {[["melder", "Melder"], ["organ", "Organsystem"], ["kapitel", "Kapitel"]].map(([k, l]) => (
            <button key={k} role="tab" aria-selected={mode === k} className={"tab" + (mode === k ? " on" : "")} onClick={() => setMode(k)}>{l}</button>
          ))}
        </nav>
      </header>

      <main className="main">
        {mode !== "kapitel" && <AgeBar age={age} setAge={(a) => setManualAge(a)} auto={!manualAge && !!codeAge} />}
        {mode === "melder" && <MelderView codes={codes} setCodes={setCodes} age={age} onOpen={setReader} onProblem={openProblem} />}
        {mode === "organ" && <OrganView age={age} onOpen={setReader} sys={sys} setSys={setSys} prob={prob} setProb={setProb} />}
        {mode === "kapitel" && <KapitelView onOpen={setReader} />}
      </main>

      <footer className="foot">
        Persönliche Gedächtnisstütze auf Basis von „Präklinik kompakt“ (Stand {CONTENT.stand}). Maßgeblich bleiben SOPs, ÄLRD und Fachinformationen.
      </footer>

      {reader && <Reader k={reader} onClose={() => setReader(null)} onOpen={setReader} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
</html>
